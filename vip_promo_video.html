<!DOCTYPE html>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: radial-gradient(circle at 50% 10%, #1a0b33 0%, #080314 60%, #020106 100%);
  color: #fff;
  font-family: 'Space Grotesk', 'Plus Jakarta Sans', sans-serif;

.studio-header {

}

}

/* Offscreen 3D WebGL render target */
#threeCanvas {

/* Controls */

}

.btn-action {

}
.progress-fill {

.timer-label {

</style>

<script>
const masterCanvas = document.getElementById('showcaseCanvas');
const masterCtx = masterCanvas.getContext('2d');
const W = 1920;
const H = 1080;

const threeCanvas = document.getElementById('threeCanvas');

let isPlaying = false;
let isRecording = false;
let mediaRecorder = null;
let recordedChunks = [];
let animFrame = null;
let showcaseStartTime = 0;
const TOTAL_DURATION = 60000;

// ════════════════════════════════════════════════════════════════

// ════════════════════════════════════════════════════════════════

  canvas: threeCanvas,
  antialias: true,
  alpha: true,
  powerPreference: 'high-performance'
});
renderer.setSize(W, H);
renderer.setPixelRatio(1);

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(55, W / H, 0.1, 2000);
camera.position.set(0, 0, 45);

// 3D Lighting Setup

scene.add(ambLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 1.8);
dirLight.position.set(20, 40, 30);
scene.add(dirLight);

const neonPinkLight = new THREE.PointLight(0xd946ef, 3, 120);
neonPinkLight.position.set(-25, 15, 20);
scene.add(neonPinkLight);

const neonCyanLight = new THREE.PointLight(0x06b6d4, 3, 120);
neonCyanLight.position.set(25, -15, 20);
scene.add(neonCyanLight);

const goldLight = new THREE.PointLight(0xffd700, 3.5, 120);
goldLight.position.set(0, 20, 25);
scene.add(goldLight);

// ── 3D Starfield & Particle Cloud ──
const particleCount = 700;
const pGeom = new THREE.BufferGeometry();
const pPos = new Float32Array(particleCount * 3);
const pColors = new Float32Array(particleCount * 3);
const palette = [
  new THREE.Color(0xd946ef),
  new THREE.Color(0x06b6d4),
  new THREE.Color(0x10b981),
  new THREE.Color(0xffd700),
  new THREE.Color(0xffffff)
];

for (let i = 0; i < particleCount; i++) {
  pPos[i * 3] = (Math.random() - 0.5) * 160;
  pPos[i * 3 + 1] = (Math.random() - 0.5) * 100;
  pPos[i * 3 + 2] = (Math.random() - 0.5) * 120;
  const col = palette[Math.floor(Math.random() * palette.length)];
  pColors[i * 3] = col.r;
  pColors[i * 3 + 1] = col.g;
  pColors[i * 3 + 2] = col.b;
}
pGeom.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
pGeom.setAttribute('color', new THREE.BufferAttribute(pColors, 3));
const pMat = new THREE.PointsMaterial({
  size: 1.2,
  vertexColors: true,
  transparent: true,
  opacity: 0.85,
  blending: THREE.AdditiveBlending
});
const particleField = new THREE.Points(pGeom, pMat);
scene.add(particleField);

// ── 3D Grid Tunnel (Cyberpunk Floor & Ceiling) ──
const gridHelperBottom = new THREE.GridHelper(160, 40, 0xd946ef, 0x1e1b4b);
gridHelperBottom.position.y = -22;
scene.add(gridHelperBottom);

const gridHelperTop = new THREE.GridHelper(160, 40, 0x06b6d4, 0x1e1b4b);
gridHelperTop.position.y = 22;
gridHelperTop.rotation.x = Math.PI;
scene.add(gridHelperTop);

// Group 1: 3D Lobby Hexagons & Rings
const grpLobby = new THREE.Group();
const ringGeom = new THREE.TorusGeometry(8, 0.4, 16, 60);
const ringMat1 = new THREE.MeshStandardMaterial({
  color: 0xd946ef, emissive: 0xd946ef, emissiveIntensity: 0.8,
  metalness: 0.9, roughness: 0.1
});
const ringMat2 = new THREE.MeshStandardMaterial({
  color: 0x06b6d4, emissive: 0x06b6d4, emissiveIntensity: 0.8,
  metalness: 0.9, roughness: 0.1
});
const ring1 = new THREE.Mesh(ringGeom, ringMat1);
const ring2 = new THREE.Mesh(new THREE.TorusGeometry(12, 0.3, 16, 60), ringMat2);
grpLobby.add(ring1);
grpLobby.add(ring2);

const hexGeom = new THREE.CylinderGeometry(2.5, 2.5, 0.8, 6);
const hexMat = new THREE.MeshStandardMaterial({
  color: 0x1e1b4b, emissive: 0x3b82f6, emissiveIntensity: 0.4,
  metalness: 0.8, roughness: 0.2
});
const hexCubes = [];
for (let i = 0; i < 6; i++) {
  const hMesh = new THREE.Mesh(hexGeom, hexMat);
  const ang = (i / 6) * Math.PI * 2;
  hMesh.position.set(Math.cos(ang) * 18, Math.sin(ang) * 10, -5 + Math.sin(i) * 6);
  grpLobby.add(hMesh);
  hexCubes.push(hMesh);
}
scene.add(grpLobby);

// Group 2: 3D Aviator Jet, Gems & Dice
const grpGames = new THREE.Group();

const jetGrp = new THREE.Group();
const fuselageGeom = new THREE.ConeGeometry(1.6, 9, 8);
const jetMat = new THREE.MeshStandardMaterial({
  color: 0xef4444, emissive: 0x991b1b, emissiveIntensity: 0.5,
  metalness: 0.8, roughness: 0.2
});
const fuselage = new THREE.Mesh(fuselageGeom, jetMat);
fuselage.rotation.x = Math.PI / 2;
jetGrp.add(fuselage);

const wingShape = new THREE.Shape();
wingShape.moveTo(0, 0);
wingShape.lineTo(7, -3);
wingShape.lineTo(7, -4.5);
wingShape.lineTo(0, -2);
const wingGeom = new THREE.ShapeGeometry(wingShape);
const wingMat = new THREE.MeshStandardMaterial({ color: 0xffffff, metalness: 0.9, roughness: 0.1, side: THREE.DoubleSide });
const leftWing = new THREE.Mesh(wingGeom, wingMat);
leftWing.rotation.x = -Math.PI / 2;
leftWing.position.set(0, 0, 1);
const rightWing = leftWing.clone();
rightWing.scale.x = -1;
jetGrp.add(leftWing);
jetGrp.add(rightWing);

const flameGeom = new THREE.ConeGeometry(0.8, 4, 8);
const flameMat = new THREE.MeshBasicMaterial({ color: 0x38bdf8 });
const flame = new THREE.Mesh(flameGeom, flameMat);
flame.rotation.x = -Math.PI / 2;
flame.position.set(0, 0, -5.5);
jetGrp.add(flame);
jetGrp.position.set(-14, 2, 0);
grpGames.add(jetGrp);

const gemGeom = new THREE.OctahedronGeometry(3.5, 0);
const gemMat = new THREE.MeshStandardMaterial({
  color: 0x10b981, emissive: 0x059669, emissiveIntensity: 0.6,
  metalness: 0.9, roughness: 0.1
});
const gemMesh = new THREE.Mesh(gemGeom, gemMat);
gemMesh.position.set(15, 6, 0);
grpGames.add(gemMesh);

const diceGeom = new THREE.BoxGeometry(4.2, 4.2, 4.2);
const diceMat = new THREE.MeshStandardMaterial({
  color: 0xffd700, emissive: 0xb45309, emissiveIntensity: 0.5,
  metalness: 0.85, roughness: 0.15
});
const diceMesh = new THREE.Mesh(diceGeom, diceMat);
diceMesh.position.set(12, -8, 2);
grpGames.add(diceMesh);

scene.add(grpGames);

// Group 3: 3D Royal VIP Crown & Bars
const grpVIP = new THREE.Group();
const crownGrp = new THREE.Group();
const crownBaseGeom = new THREE.CylinderGeometry(6, 5.2, 2.5, 24);
const goldMat = new THREE.MeshStandardMaterial({
  color: 0xffd700, emissive: 0xd97706, emissiveIntensity: 0.6,
  metalness: 0.95, roughness: 0.1
});
const crownBase = new THREE.Mesh(crownBaseGeom, goldMat);
crownGrp.add(crownBase);

for (let s = 0; s < 7; s++) {
  const spikeGeom = new THREE.ConeGeometry(1.2, 4.5, 5);
  const spike = new THREE.Mesh(spikeGeom, goldMat);
  const sAng = (s / 7) * Math.PI * 2;
  spike.position.set(Math.cos(sAng) * 5.8, 3.2, Math.sin(sAng) * 5.8);
  crownGrp.add(spike);

  const jewelGeom = new THREE.SphereGeometry(0.6, 8, 8);
  const jewelMat = new THREE.MeshStandardMaterial({
    color: s % 2 === 0 ? 0xef4444 : 0x06b6d4,
    emissive: s % 2 === 0 ? 0xef4444 : 0x06b6d4,
    emissiveIntensity: 0.9, metalness: 0.9, roughness: 0.1
  });
  const jewel = new THREE.Mesh(jewelGeom, jewelMat);
  jewel.position.set(Math.cos(sAng) * 5.8, 5.6, Math.sin(sAng) * 5.8);
  crownGrp.add(jewel);
}
crownGrp.position.set(0, 3, 0);
grpVIP.add(crownGrp);

const barGeom = new THREE.BoxGeometry(5.5, 1.8, 3);
const platMat = new THREE.MeshStandardMaterial({
  color: 0xe2e8f0, emissive: 0x38bdf8, emissiveIntensity: 0.4,
  metalness: 0.98, roughness: 0.05
});
const bar1 = new THREE.Mesh(barGeom, platMat);
bar1.position.set(-16, -5, -4);
bar1.rotation.set(0.3, 0.5, 0.2);
const bar2 = new THREE.Mesh(barGeom, goldMat);
bar2.position.set(16, -5, -4);
bar2.rotation.set(-0.3, -0.5, -0.2);
grpVIP.add(bar1);
grpVIP.add(bar2);

scene.add(grpVIP);

// Group 4: 3D UPI Coin Fountain
const grpUPI = new THREE.Group();
const coinGeom = new THREE.CylinderGeometry(2.8, 2.8, 0.4, 32);
const coinMat = new THREE.MeshStandardMaterial({
  color: 0xffd700, emissive: 0xf59e0b, emissiveIntensity: 0.5,
  metalness: 0.92, roughness: 0.1
});
const upiCoins = [];
for (let c = 0; c < 28; c++) {
  const cMesh = new THREE.Mesh(coinGeom, coinMat);
  cMesh.position.set((Math.random() - 0.5) * 50, (Math.random() - 0.5) * 35, (Math.random() - 0.5) * 30);
  cMesh.rotation.set(Math.random() * Math.PI, Math.random() * Math.PI, Math.random() * Math.PI);
  cMesh.userData = {
    vx: (Math.random() - 0.5) * 0.4,
    vy: (Math.random() - 0.5) * 0.4,
    vz: (Math.random() - 0.5) * 0.4,
    rx: (Math.random() - 0.5) * 0.08,
    ry: (Math.random() - 0.5) * 0.08
  };
  grpUPI.add(cMesh);
  upiCoins.push(cMesh);
}

const shieldGeom = new THREE.TorusGeometry(8, 0.6, 16, 6);
const shieldMat = new THREE.MeshStandardMaterial({
  color: 0x10b981, emissive: 0x10b981, emissiveIntensity: 0.8,
  metalness: 0.8, roughness: 0.2
});
const shieldMesh = new THREE.Mesh(shieldGeom, shieldMat);
shieldMesh.position.set(0, 0, -2);
grpUPI.add(shieldMesh);

scene.add(grpUPI);

// Group 5: 3D Grand Finale Monolith
const grpFinale = new THREE.Group();
const trophyGeom = new THREE.DodecahedronGeometry(6, 0);
const finaleMat = new THREE.MeshStandardMaterial({
  color: 0xd946ef, emissive: 0xd946ef, emissiveIntensity: 0.7,
  metalness: 0.9, roughness: 0.1
});
const finaleTrophy = new THREE.Mesh(trophyGeom, finaleMat);
grpFinale.add(finaleTrophy);

const finaleRings = [];
for (let r = 0; r < 3; r++) {
  const fRing = new THREE.Mesh(
    new THREE.TorusGeometry(9 + r * 3.5, 0.35, 16, 64),
    new THREE.MeshStandardMaterial({
      color: r === 0 ? 0xffd700 : r === 1 ? 0x06b6d4 : 0x10b981,
      emissive: r === 0 ? 0xffd700 : r === 1 ? 0x06b6d4 : 0x10b981,
      emissiveIntensity: 0.8, metalness: 0.9, roughness: 0.1
    })
  );
  grpFinale.add(fRing);
  finaleRings.push(fRing);
}
scene.add(grpFinale);

// ════════════════════════════════════════════════════════════════
// 🎵 PROCEDURAL AUDIO SYNTHESIZER
// ════════════════════════════════════════════════════════════════
let audioCtx = null;
function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playSubBassDrop(delayMs = 0) {
  if (!audioCtx) return;
  setTimeout(() => {
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(180, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(30, audioCtx.currentTime + 1.2);
      gain.gain.setValueAtTime(0.7, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1.2);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 1.2);
    } catch(e){}
  }, delayMs);
}

function playCyberSynth(freq = 440, type = 'sawtooth', dur = 0.35, vol = 0.35, delayMs = 0) {
  if (!audioCtx) return;
  setTimeout(() => {
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(vol, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + dur);
    } catch(e){}
  }, delayMs);
}

function playCoinChime(delayMs = 0) {
  if (!audioCtx) return;
  setTimeout(() => {
    try {
      [880, 1320, 1760, 2200].forEach((f, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(f, audioCtx.currentTime + i * 0.08);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime + i * 0.08);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i * 0.08 + 0.3);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + i * 0.08);
        osc.stop(audioCtx.currentTime + i * 0.08 + 0.3);
      });
    } catch(e){}
  }, delayMs);
}

let energeticFemaleVoice = null;
function loadVoices() {
  if ('speechSynthesis' in window) {
    const voices = window.speechSynthesis.getVoices();
    energeticFemaleVoice = voices.find(v => (
      v.name.includes('Google UK English Female') ||
      v.name.includes('Samantha') ||
      v.name.includes('Zira') ||
      v.name.includes('Victoria') ||
      v.name.includes('Karen') ||
      v.name.includes('Female')
    )) || voices[0];
  }
}
if ('speechSynthesis' in window) {
  window.speechSynthesis.onvoiceschanged = loadVoices;
  loadVoices();
}

function speakHypeFemale(text, delayMs) {
  setTimeout(() => {
    if ('speechSynthesis' in window && isPlaying) {
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      if (energeticFemaleVoice) utter.voice = energeticFemaleVoice;
      utter.rate = 1.15;
      utter.pitch = 1.30;
      utter.volume = 1.0;
      window.speechSynthesis.speak(utter);
    }
  }, delayMs);
}

// ════════════════════════════════════════════════════════════════
// 🎥 CINEMATIC 3D + 2D RENDER PIPELINE
// ════════════════════════════════════════════════════════════════
function update3DScene(t) {
  const sec = t / 1000;

  particleField.rotation.y = sec * 0.08;
  particleField.rotation.x = Math.sin(sec * 0.1) * 0.1;

  gridHelperBottom.position.z = (sec * 12) % 4;
  gridHelperTop.position.z = (sec * 12) % 4;

  neonPinkLight.position.x = Math.cos(sec * 1.5) * 30;
  neonPinkLight.position.y = Math.sin(sec * 1.2) * 20;
