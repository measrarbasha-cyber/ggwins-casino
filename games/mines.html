<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mines – GG Wins</title>
<link rel="stylesheet" href="../game-shell.css">
<style>
.mines-area {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  overflow: auto;
  position: relative;
}
.mines-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 10px;
  width: min(440px, 92vw);
  perspective: 1000px;
}
.mines-grid.grid-shake {
  animation: gridTremor 0.5s cubic-bezier(.36,.07,.19,.97) both;
}
@keyframes gridTremor {
  10%, 90% { transform: translate3d(-3px, 0, 0); }
  20%, 80% { transform: translate3d(5px, 0, 0); }
  30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
  40%, 60% { transform: translate3d(6px, 0, 0); }
}
.mine-tile {
  aspect-ratio: 1;
  background: linear-gradient(145deg, #1e3a55, #122538);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 30px;
  cursor: pointer;
  transition: transform 0.25s cubic-bezier(.175, .885, .32, 1.275), box-shadow 0.25s, border-color 0.25s;
  position: relative;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  box-shadow: inset 0 2px 4px rgba(255,255,255,0.08), 0 4px 12px rgba(0,0,0,0.4);
}
.mine-tile::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.1), transparent);
  border-radius: 12px;
}
.mine-tile:hover:not(.revealed):not(.disabled) {
  border-color: rgba(0,230,118,0.6);
  transform: translateY(-4px) scale(1.06);
  box-shadow: 0 6px 20px rgba(0,230,118,0.25);
  background: linear-gradient(145deg, #264d6b, #18334b);
}
.mine-tile.flipping {
  animation: tileFlip 0.4s ease forwards;
}
@keyframes tileFlip {
  0% { transform: rotateY(0deg) scale(1); }
  50% { transform: rotateY(90deg) scale(1.15); }
  100% { transform: rotateY(0deg) scale(1); }
}
.mine-tile.gem {
  background: radial-gradient(circle at center, #0f5132 0%, #062b1a 100%);
  border-color: #00e676;
  box-shadow: 0 0 25px rgba(0,230,118,0.5), inset 0 0 15px rgba(0,230,118,0.3);
  animation: gemSparkle 0.45s cubic-bezier(.34,1.56,.64,1);
}
@keyframes gemSparkle {
  0%{transform:scale(0.3) rotate(-45deg);opacity:0}
  70%{transform:scale(1.2) rotate(10deg);opacity:1}
  100%{transform:scale(1) rotate(0deg);opacity:1}
}
.mine-tile.mine-hit {
  background: radial-gradient(circle at center, #dc2626 0%, #450a0a 100%);
  border-color: #ef4444;
  box-shadow: 0 0 30px rgba(239,68,68,0.8), inset 0 0 20px rgba(239,68,68,0.5);
  animation: mineExplosion 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
@keyframes mineExplosion {
  0%{transform:scale(1)} 25%{transform:scale(1.4) rotate(-15deg)} 50%{transform:scale(0.85) rotate(10deg)} 75%{transform:scale(1.15)} 100%{transform:scale(1)}
}
.mine-tile.mine-show {
  background: linear-gradient(145deg, #3a1010, #4a1515);
  border-color: rgba(239,83,80,0.3);
  opacity: 0.6;
  cursor: default;
}
.mine-tile.disabled { cursor: default; }

.multiplier-display {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.3s;
}
.multiplier-display.visible { opacity: 1; }
.mult-big {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 56px;
  font-weight: 900;
  color: var(--green);
  text-shadow: 0 0 30px rgba(0,230,118,0.5);
  line-height: 1;
}
.mult-sub { font-size: 14px; color: var(--text2); margin-top: 6px; font-weight: 600; }

.mines-info-bar {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.mines-info-item {
  text-align: center;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px 18px;
}
.mines-info-label { font-size: 10px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; }
.mines-info-val { font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 800; color: var(--text); margin-top: 2px; }
.mines-info-val.green { color: var(--green); }

.mines-container { display: flex; flex-direction: column; align-items: center; gap: 16px; width: 100%; }

/* Mine count selector */
.mine-count-grid {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 4px;
  margin-top: 4px;
}
.mc-btn {
  padding: 6px;
  border-radius: 6px;
  font-size: 12px;
  font-weight: 700;
  text-align: center;
  background: var(--bg3);
  border: 1px solid var(--border);
  color: var(--text2);
  cursor: pointer;
  transition: all var(--t);
  font-family: 'Space Grotesk', sans-serif;
}
.mc-btn:hover { border-color: var(--border2); color: var(--text); }
.mc-btn.active { background: rgba(239,83,80,0.15); border-color: rgba(239,83,80,0.4); color: var(--red); }
</style>
<script src="../security-guard.js"></script>
</head>
<body>

<nav class="gnav">
  <button class="gnav-back" onclick="window.location.href='../index.html'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    Lobby
  </button>
  <div class="gnav-brand-block">
    <div class="gnav-logo">GG <span>Wins</span></div>
    <div class="gnav-game-under-logo">💣 GG Mines</div>
  </div>
  <div class="gnav-game-name">Mines</div>
  <span class="gnav-game-badge">ORIGINAL</span>
  <button class="btn-sound-toggle" onclick="toggleSound()" title="Toggle Sound" style="background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:14px;cursor:pointer">🔊</button>
  <div class="gnav-spacer"></div>
  <div id="wallet-chip-target"></div>
  <a href="../deposit.html" target="_blank" class="btn-deposit-blue" title="Deposit Funds">
    <span class="dep-blue-icon">💳</span>
    <span>Deposit</span>
  </a>
</nav>

<div class="game-layout">
  <!-- GAME AREA -->
  <div class="game-area" style="position:relative">
    <div class="mines-area">
      <div class="mines-container">
        <div class="mines-info-bar">
          <div class="mines-info-item">
            <div class="mines-info-label">Gems Found</div>
            <div class="mines-info-val green" id="gems-found">0</div>
          </div>
          <div class="mines-info-item">
            <div class="mines-info-label">Mines Hidden</div>
            <div class="mines-info-val" id="mines-count-display">3</div>
          </div>
          <div class="mines-info-item">
            <div class="mines-info-label">Next Multiplier</div>
            <div class="mines-info-val green" id="next-mult">1.16×</div>
          </div>
          <div class="mines-info-item">
            <div class="mines-info-label">Current Payout</div>
            <div class="mines-info-val green" id="current-payout">₹0.00</div>
          </div>
        </div>
        <div class="mines-grid" id="mines-grid"></div>
      </div>
    </div>
  </div>

  <!-- BET PANEL -->
  <div class="bet-panel">
    <div class="bet-section">
      <div class="bet-label">Bet Amount</div>
      <div class="bet-input-row">
        <div class="bet-currency">₹</div>
        <input class="bet-input" id="bet-amount" type="number" value="100.00" min="1" step="1">
        <div class="bet-quick-btns">
          <button class="qbtn" onclick="halveBet()">½</button>
          <button class="qbtn" onclick="doubleBet()">2×</button>
          <button class="qbtn" onclick="maxBet()">Max</button>
        </div>
      </div>
    </div>

    <div class="bet-section">
      <div class="bet-label">Number of Mines</div>
      <div class="mine-count-grid" id="mine-count-grid">
        <!-- filled by JS -->
      </div>
    </div>

    <div class="bet-section">
      <div id="result-container"></div>
      <button class="btn-bet" id="game-btn" onclick="handleGameBtn()">Start Game</button>
    </div>

    <div class="bet-section" id="cashout-section" style="display:none">
      <button class="btn-bet cashout" id="cashout-btn" onclick="cashOut()">
        Cash Out ₹0.00
      </button>
    </div>

    <!-- Current multiplier progress -->
    <div class="bet-section">
      <div class="bet-label">Multiplier Progress</div>
      <div class="stat-box" style="padding:14px;text-align:center">
        <div class="stat-box-label">Active Multiplier</div>
        <div class="stat-box-val green" id="active-mult" style="font-size:28px">1.00×</div>
      </div>
    </div>

    <div class="stats-row">
      <div class="stat-box">
        <div class="stat-box-label">Net Profit</div>
        <div class="stat-box-val" id="stat-profit">₹0.00</div>
      </div>
      <div class="stat-box">
        <div class="stat-box-label">Wins</div>
        <div class="stat-box-val green" id="stat-wins">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-box-label">Losses</div>
        <div class="stat-box-val red" id="stat-losses">0</div>
      </div>
    </div>

    <div class="history-section">
      <div class="history-title">Recent Results</div>
      <div class="history-chips" id="my-history"></div>
    </div>
  </div>
</div>

<script src="../wallet.js"></script>
<script>
let mineCount = 3;
let gameActive = false;
let betAmount = 100;
let minePositions = new Set();
let revealed = new Set();
let gemsFound = 0;
let totalProfit = 0; let wins = 0; let losses = 0;
let isWinRound = true; // 60% win probability controller
let picksInRound = 0;
const TOTAL = 25;

// Mine count buttons
const mcGrid = document.getElementById('mine-count-grid');
[1,2,3,4,5,6,7,8,10,12,15,18,20,22,24].forEach(n => {
  const btn = document.createElement('button');
  btn.className = 'mc-btn' + (n === 3 ? ' active' : '');
  btn.textContent = n;
  btn.onclick = () => {
    if(gameActive) return;
    mineCount = n;
    document.querySelectorAll('.mc-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById('mines-count-display').textContent = n;
    updateNextMult(0);
  };
  mcGrid.appendChild(btn);
});

// Multiplier calculation (heavily reduced across all levels and all picks)
function calcMult(totalTiles, mines, safeRevealed){
  if(safeRevealed === 0) return 1.00;
  let prob = 1;
  for(let i = 0; i < safeRevealed; i++){
    prob *= (totalTiles - mines - i) / (totalTiles - i);
  }
  
  // Heavily reduced base multiplier scaling
  let baseMult = 1.00 + (0.55 * (1.0 / prob - 1.0));

  // Tightly flatten multiplier gains after 3 gems
  if (safeRevealed > 3) {
    let p3 = 1;
    for (let i = 0; i < 3; i++) {
      p3 *= (totalTiles - mines - i) / (totalTiles - i);
    }
    const multAt3 = 1.00 + (0.55 * (1.0 / p3 - 1.0));
    const excess = baseMult - multAt3;
    baseMult = multAt3 + (excess * 0.15);
  }

  // Cap extreme maximum multipliers
  baseMult = Math.min(3.50, Math.max(1.02, baseMult));

  return parseFloat(baseMult.toFixed(2));
}

function updateNextMult(gems){
  const m = calcMult(TOTAL, mineCount, gems + 1);
  document.getElementById('next-mult').textContent = m.toFixed(2) + '×';
}

function buildGrid(){
  const grid = document.getElementById('mines-grid');
  grid.innerHTML = '';
  for(let i = 0; i < TOTAL; i++){
    const tile = document.createElement('div');
    tile.className = 'mine-tile';
    tile.dataset.idx = i;
    tile.textContent = '❓';
    tile.addEventListener('click', () => clickTile(i, tile));
    grid.appendChild(tile);
  }
}

/* 🎯 DYNAMIC PROBABILITY MATRIX:
   - For Mines 15, 18, 20, 22, 24: 0 free gems, 1% Win / 99% Loss from pick 1!
   - For Mines < 15: First 2-3 gems guaranteed safe, then 25% Win / 75% Loss.
*/
let safePicksThreshold = 2;

function clickTile(idx, tile){
  if(!gameActive || revealed.has(idx)) return;
  picksInRound++;

  let hitMine = false;

  // 1. Extreme Mine Counts (15, 18, 20, 22, 24): NO free gems, 1% Win / 99% Loss
  if (mineCount >= 15) {
    const loseChance = 0.99; // 99% Loss, 1% Win
    if (Math.random() < loseChance) {
      hitMine = true;
      minePositions.add(idx);
    } else {
      hitMine = false;
      if (minePositions.has(idx)) {
        minePositions.delete(idx);
        const unrevealed = [];
        for (let i = 0; i < TOTAL; i++) {
          if (!revealed.has(i) && i !== idx && !minePositions.has(i)) unrevealed.push(i);
        }
        if (unrevealed.length > 0) {
          minePositions.add(unrevealed[Math.floor(Math.random() * unrevealed.length)]);
        }
      }
    }
  } 
  // 2. Regular Mine Counts (< 15): First 2-3 gems safe, then 25% Win / 75% Loss
  else if (picksInRound <= safePicksThreshold && (TOTAL - mineCount) >= picksInRound) {
    hitMine = false;
    if (minePositions.has(idx)) {
      minePositions.delete(idx);
      // Relocate mine to an unrevealed tile
      const unrevealed = [];
      for (let i = 0; i < TOTAL; i++) {
        if (!revealed.has(i) && i !== idx && !minePositions.has(i)) unrevealed.push(i);
      }
      if (unrevealed.length > 0) {
        minePositions.add(unrevealed[Math.floor(Math.random() * unrevealed.length)]);
      }
    }
  } else {
    // After 2-3 gems for regular boards: 25% Win / 75% Loss
    const loseChance = 0.75;
    if (Math.random() < loseChance) {
      hitMine = true;
      minePositions.add(idx);
    } else {
      hitMine = false;
      if (minePositions.has(idx)) {
        minePositions.delete(idx);
        const unrevealed = [];
        for (let i = 0; i < TOTAL; i++) {
          if (!revealed.has(i) && i !== idx && !minePositions.has(i)) unrevealed.push(i);
        }
        if (unrevealed.length > 0) {
          minePositions.add(unrevealed[Math.floor(Math.random() * unrevealed.length)]);
        }
      }
    }
  }

  revealed.add(idx);
  tile.classList.add('flipping');

  const grid = document.getElementById('mines-grid');

  if(minePositions.has(idx) || hitMine){
    // 💣 Hit a mine!
    tile.className = 'mine-tile mine-hit disabled';
    tile.textContent = '💣';
    
    if(grid){
      grid.classList.add('grid-shake');
      setTimeout(() => grid.classList.remove('grid-shake'), 600);
    }

    setTimeout(() => {
      document.querySelectorAll('.mine-tile').forEach((t, i) => {
        if(minePositions.has(i) && i !== idx){
          setTimeout(() => {
            t.className = 'mine-tile mine-show disabled';
            t.textContent = '💣';
          }, (i % 5) * 50);
        } else if(!revealed.has(i)){
          t.className = 'mine-tile disabled';
          t.textContent = '💎';
          t.style.opacity = '0.25';
        }
      });
    }, 350);

    endGame(false);
  } else {
    // 💎 Safe gem!
    gemsFound++;
    tile.className = 'mine-tile gem disabled';
    tile.textContent = '💎';

    const mult = calcMult(TOTAL, mineCount, gemsFound);
    document.getElementById('gems-found').textContent = gemsFound;
    document.getElementById('active-mult').textContent = mult.toFixed(2) + '×';
    document.getElementById('current-payout').textContent = '₹' + (betAmount * mult).toFixed(2);
    updateNextMult(gemsFound);

    // Update cashout button
    document.getElementById('cashout-btn').textContent = `Cash Out ₹${(betAmount * mult).toFixed(2)}`;

    // Win if all safe gems found
    if(gemsFound >= TOTAL - mineCount){
      endGame(true);
    }
  }
}

function startGame(){
  const amt = parseFloat(document.getElementById('bet-amount').value);
  if(isNaN(amt)||amt<=0){ showToast('Enter a valid bet amount!', 'error'); return; }
  const currBal = (typeof getBalance === 'function') ? getBalance() : 50000;
  if(amt > currBal){ showToast('Insufficient balance!', 'error'); return; }

  betAmount = amt;
  if(typeof adjustBalance === 'function') {
    adjustBalance(-amt, 'GG Mines Wager');
  } else if(typeof setBalance === 'function') {
    setBalance(currBal - amt);
  }

  gameActive = true;
  gemsFound = 0;
  picksInRound = 0;
  revealed.clear();

  // 🎲 Set 2 or 3 safe gems at start
  safePicksThreshold = (Math.random() < 0.5) ? 2 : 3;

  // Generate initial mine positions
  minePositions.clear();
  while(minePositions.size < mineCount){
    minePositions.add(Math.floor(Math.random() * TOTAL));
  }

  buildGrid();
  document.getElementById('gems-found').textContent = '0';
  document.getElementById('active-mult').textContent = '1.00×';
  document.getElementById('current-payout').textContent = '₹' + amt.toFixed(2);
  updateNextMult(0);
  document.getElementById('result-container').innerHTML = '';

  document.getElementById('game-btn').textContent = 'New Game (Resets)';
  document.getElementById('cashout-section').style.display = 'block';
  document.getElementById('cashout-btn').textContent = 'Cash Out ₹' + amt.toFixed(2);

  document.querySelectorAll('.mc-btn').forEach(b => b.style.opacity = '0.5');
}

function cashOut(){
  if(!gameActive || gemsFound === 0){ showToast('Reveal at least one gem first!', 'info'); return; }
  const mult = calcMult(TOTAL, mineCount, gemsFound);
  const payout = betAmount * mult;

  if(typeof adjustBalance === 'function') {
    adjustBalance(payout, `GG Mines Cashed Out (${mult.toFixed(2)}×)`);
  } else if(typeof setBalance === 'function') {
    setBalance(getBalance() + payout);
  }

  totalProfit += payout - betAmount;
  wins++;
  addHistory(mult, true);
  showResult(true, payout);
  if(typeof trackGameWager === 'function') trackGameWager('GG Mines', betAmount, payout, true);
  endGame(true, true);
}

function endGame(won, cashed = false){
  gameActive = false;
  document.querySelectorAll('.mine-tile').forEach(t => t.classList.add('disabled'));
  document.getElementById('cashout-section').style.display = 'none';
  document.getElementById('game-btn').textContent = 'Start Game';
  document.querySelectorAll('.mc-btn').forEach(b => b.style.opacity = '');

  if(!won){
    totalProfit -= betAmount;
    losses++;
    const mult = calcMult(TOTAL, mineCount, gemsFound);
    addHistory(mult, false);
    showResult(false, betAmount);
    if(typeof flashBal === 'function') flashBal('flash-lose');
    if(typeof trackGameWager === 'function') trackGameWager('GG Mines', betAmount, 0, false);
  } else if(!cashed){
    // Auto win (all gems found)
    const mult = calcMult(TOTAL, mineCount, gemsFound);
    const payout = betAmount * mult;
    if(typeof adjustBalance === 'function') adjustBalance(payout, 'GG Mines All Gems Found');
    totalProfit += payout - betAmount;
    wins++;
    addHistory(mult, true);
    showResult(true, payout);
    if(typeof flashBal === 'function') flashBal('flash-win');
    if(typeof trackGameWager === 'function') trackGameWager('GG Mines', betAmount, payout, true);
  } else {
    if(typeof flashBal === 'function') flashBal('flash-win');
  }
  updateStats();
}

function handleGameBtn(){
  startGame();
}

function addHistory(mult, won){
  const c = document.getElementById('my-history');
  if(!c) return;
  const chip = document.createElement('div');
  chip.className = 'hchip '+(won?'win':'lose');
  chip.textContent = mult.toFixed(2)+'×';
  c.insertBefore(chip, c.firstChild);
  if(c.children.length > 15) c.removeChild(c.lastChild);
}

function showResult(won, amount){
  const c = document.getElementById('result-container');
  if(!c) return;
  c.innerHTML=`<div class="result-box ${won?'win':'lose'}">
    <div class="result-box-title">${won?'💎 Cashed Out!':'💣 Exploded!'}</div>
    <div class="result-box-val">${won?'+₹'+amount.toFixed(2):'-₹'+amount.toFixed(2)}</div>
  </div>`;
  setTimeout(()=>c.innerHTML='',4000);
}

function updateStats(){
  const p=document.getElementById('stat-profit');
  if(p) {
    p.textContent=(totalProfit>=0?'+':'-')+' ₹'+Math.abs(totalProfit).toFixed(2);
    p.className='stat-box-val '+(totalProfit>=0?'green':'red');
  }
  const sw=document.getElementById('stat-wins');
  const sl=document.getElementById('stat-losses');
  if(sw) sw.textContent=wins;
  if(sl) sl.textContent=losses;
}

function flashBal(cls){
  const el=document.getElementById('bal-display');
  if(!el) return;
  el.classList.remove('flash-win','flash-lose');
  void el.offsetWidth;
  el.classList.add(cls);
}

function halveBet(){ const i=document.getElementById('bet-amount'); i.value=Math.max(1, (parseFloat(i.value||100)/2)).toFixed(2); }
function doubleBet(){ const i=document.getElementById('bet-amount'); i.value=(parseFloat(i.value||100)*2).toFixed(2); }
function maxBet(){ const currBal = (typeof getBalance === 'function') ? getBalance() : 50000; document.getElementById('bet-amount').value=currBal.toFixed(2); }

function showToast(msg, type = 'info'){
  const t=document.createElement('div');
  t.style.cssText='position:fixed;bottom:20px;right:20px;background:#1e2d3d;border:1.5px solid '+(type==='error'?'#ef4444':'#00e676')+';color:#e8edf5;padding:10px 16px;border-radius:8px;font-size:13px;font-weight:700;z-index:999;box-shadow:0 8px 24px rgba(0,0,0,0.6)';
  t.textContent=msg; document.body.appendChild(t);
  setTimeout(()=>t.remove(),2500);
}

buildGrid();
updateNextMult(0);
</script>
<script src="../auth-guard.js"></script>
</body>
