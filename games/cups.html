<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GG Magic Shells 3D – GG Wins</title>

<style>
/* Cups Arena */
.cups-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 14px;
  gap: 12px;
  overflow: auto;
  position: relative;
  background: radial-gradient(ellipse at 50% 30%, #1e1b4b 0%, #0f172a 60%, #030712 100%);
  user-select: none;
}

/* Stage Table */
.cups-stage {
  width: min(580px, 94vw);
  background: linear-gradient(145deg, #18181b, #09090b);
  border: 3px solid #ffd700;
  border-radius: 24px;
  padding: 18px 14px;
  box-shadow: 0 10px 45px rgba(0,0,0,0.8), inset 0 0 35px rgba(0,0,0,0.9);
  display: flex;
  flex-direction: column;
  gap: 12px;
  position: relative;
}

.stage-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-family: 'Space Grotesk', sans-serif;
  color: #ffd700;
  font-weight: 800;
  font-size: 13px;
  border-bottom: 1px dashed rgba(255,215,0,0.3);
  padding-bottom: 6px;
}

/* Difficulty Tabs */
.level-tabs {
  display: flex;
  gap: 6px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 12px;
  padding: 4px;
}
.level-btn {
  flex: 1;
  padding: 8px 4px;
  border-radius: 8px;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 12px;
  font-weight: 800;
  color: #94a3b8;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
}
.level-btn.active {
  background: linear-gradient(135deg, #ffd700, #f59e0b);
  color: #000;
  box-shadow: 0 2px 10px rgba(255,215,0,0.4);
}
.level-btn:hover:not(.active) {
  color: #fff;
  background: rgba(255,255,255,0.08);
}

/* Result Banner on Stage */
.result-banner {
  display: none;
  padding: 10px 16px;
  border-radius: 14px;
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 900;
  text-align: center;
  font-size: 15px;
  animation: bannerSlide 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
@keyframes bannerSlide {
  0% { transform: scale(0.85); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}
.result-banner.win {
  display: block;
  background: linear-gradient(135deg, rgba(0,230,118,0.25), rgba(0,180,216,0.2));
  border: 2px solid #00e676;
  color: #00e676;
  box-shadow: 0 0 20px rgba(0,230,118,0.4);
}
.result-banner.lose {
  display: block;
  background: linear-gradient(135deg, rgba(239,68,68,0.25), rgba(185,28,28,0.2));
  border: 2px solid #ef4444;
  color: #ef4444;
  box-shadow: 0 0 20px rgba(239,68,68,0.4);
}

/* Cups Arena Row */
.cups-rack {
  height: 180px;
  display: flex;
  align-items: flex-end;
  justify-content: space-around;
  position: relative;
  padding: 10px 10px 20px 10px;
  background: radial-gradient(ellipse at 50% 100%, rgba(255,215,0,0.12), transparent 70%);
  border-bottom: 3px solid rgba(255,215,0,0.4);
  border-radius: 0 0 16px 16px;
  overflow: hidden;
}

/* Individual Cup Stand */
.cup-spot {
  position: relative;
  width: 85px;
  height: 145px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  cursor: pointer;
  transition: transform 0.22s cubic-bezier(0.2, 0.8, 0.2, 1);
}
.cup-spot:hover .magic-cup {
  filter: drop-shadow(0 0 12px rgba(255,215,0,0.9));
}

/* 3D Golden Glass/Cup */
.magic-cup {
  width: 72px;
  height: 94px;
  background: linear-gradient(135deg, #fef08a 0%, #eab308 35%, #ca8a04 70%, #854d0e 100%);
  clip-path: polygon(15% 0%, 85% 0%, 100% 100%, 0% 100%);
  border-radius: 8px 8px 4px 4px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.8), inset 0 -4px 8px rgba(0,0,0,0.4);
  position: absolute;
  bottom: 0;
  z-index: 10;
  transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  display: flex;
  align-items: center;
  justify-content: center;
}
.magic-cup::before {
  content: '👑';
  font-size: 20px;
  opacity: 0.85;
}
.magic-cup.lifted {
  transform: translateY(-65px);
  filter: drop-shadow(0 15px 25px rgba(255,215,0,0.9));
}

/* Glowing Diamond Ball */
.gold-ball {
  width: 32px;
  height: 32px;
  background: radial-gradient(circle at 35% 35%, #ffffff 0%, #38bdf8 40%, #0284c7 80%, #0369a1 100%);
  border-radius: 50%;
  box-shadow: 0 0 20px #38bdf8, 0 4px 10px rgba(0,0,0,0.6);
  position: absolute;
  bottom: 12px;
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  animation: ballGlow 1s infinite alternate;
}
@keyframes ballGlow {
  0% { transform: scale(0.95); box-shadow: 0 0 15px #38bdf8; }
  100% { transform: scale(1.15); box-shadow: 0 0 30px #38bdf8, 0 0 45px rgba(56,189,248,0.8); }
}

.cup-label {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 11px;
  font-weight: 800;
  color: #ffd700;
  margin-top: 6px;
  opacity: 0.9;
}
.cup-badge {
  font-size: 14px;
  position: absolute;
  top: 0px;
  z-index: 20;
}

/* Chip Selector Row */
.chip-row {
  display: flex;
  gap: 6px;
  justify-content: center;
  margin-top: 2px;
}
.casino-chip {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  border: 2px dashed rgba(255,255,255,0.5);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 11px;
  font-weight: 900;
  color: #fff;
  cursor: pointer;
  box-shadow: 0 4px 10px rgba(0,0,0,0.4);
  transition: all 0.2s;
}
.casino-chip:hover {
  transform: translateY(-3px) scale(1.1);
  box-shadow: 0 6px 15px rgba(255,215,0,0.5);
}
.casino-chip.c10 { background: radial-gradient(circle, #3b82f6, #1d4ed8); }
.casino-chip.c50 { background: radial-gradient(circle, #ef4444, #b91c1c); }
.casino-chip.c100 { background: radial-gradient(circle, #10b981, #047857); }
.casino-chip.c500 { background: radial-gradient(circle, #8b5cf6, #6d28d9); }
.casino-chip.c1000 { background: radial-gradient(circle, #f59e0b, #b45309); color: #000; border-color: #ffd700; }

/* End Round Center Action Bar */
.round-action-bar {
  display: flex;
  gap: 8px;
  width: 100%;
}
.btn-action-main {
  flex: 1.2;
  padding: 12px;
  background: linear-gradient(135deg, #00e676, #00b0ff);
  border: none;
  border-radius: 12px;
  color: #000;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 14px;
  font-weight: 900;
  cursor: pointer;
  box-shadow: 0 4px 15px rgba(0,230,118,0.4);
  transition: all 0.2s;
}
.btn-action-main:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(0,230,118,0.6);
}
.btn-action-2x {
  flex: 1;
  padding: 12px;
  background: linear-gradient(135deg, #f59e0b, #d97706);
  border: none;
  border-radius: 12px;
  color: #000;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 14px;
  font-weight: 900;
  cursor: pointer;
  transition: all 0.2s;
}
.btn-action-2x:hover {
  transform: translateY(-2px);
}

#cups-confetti {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  pointer-events: none; z-index: 50;
}
</style>
</head>

<script>
updateAllWalletDisplays();

// Audio Synthesizer
function playSynth(type) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const now = ctx.currentTime;
    if (type === 'lift') {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.frequency.setValueAtTime(300, now);
      osc.frequency.exponentialRampToValueAtTime(750, now + 0.15);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(now); osc.stop(now + 0.15);
    } else if (type === 'shuffle') {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(250 + Math.random()*200, now);
      gain.gain.setValueAtTime(0.18, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.06);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(now); osc.stop(now + 0.06);
    } else if (type === 'chip') {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.frequency.setValueAtTime(800, now);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.05);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(now); osc.stop(now + 0.05);
    }
  } catch(e) {}
}

let numCups = 3;
let currentMultiplier = 2.35;
let winningIndex = 0;
let isShuffling = false;
let isGuessing = false;
let lastBet = 100;
let totalProfit = 0, wins = 0, losses = 0;

function updateBetLabels(){
  const b = parseFloat(document.getElementById('bet-amt').value) || 100;
  const _lv = document.getElementById('lbl-bet-val'); if(_lv) _lv.textContent = b.toFixed(0);
  const _l2x = document.getElementById('lbl-bet-2x'); if(_l2x) _l2x.textContent = (b*2).toFixed(0);
}

function halveBet(){ const el=document.getElementById('bet-amt'); el.value = Math.max(1, (parseFloat(el.value)/2)).toFixed(2); updateBetLabels(); }
function doubleBet(){ const el=document.getElementById('bet-amt'); el.value = (parseFloat(el.value)*2).toFixed(2); updateBetLabels(); }
function maxBet(){ const el=document.getElementById('bet-amt'); el.value = Math.floor(getBalance()).toFixed(2); updateBetLabels(); }

function addChip(amount){
  if(isShuffling || isGuessing) return;
  const el = document.getElementById('bet-amt');
  el.value = (parseFloat(el.value || 0) + amount).toFixed(2);
  updateBetLabels();
  playSynth('chip');
}

function selectLevel(cups, mult, label, btn){
  if(isShuffling || isGuessing) return;
  numCups = cups;
  currentMultiplier = mult;
  document.querySelectorAll('.level-tabs .level-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  renderCups();
  const msg = document.getElementById('stage-status-msg');
  if (msg) msg.textContent = label;
  playSynth('chip');
}

function renderCups(){
  const rack = document.getElementById('cups-rack');
  if (!rack) return;
  rack.innerHTML = '';
  for(let i=0; i<numCups; i++){
    const spot = document.createElement('div');
    spot.className = 'cup-spot';
    spot.id = `cup-spot-${i}`;
    spot.onclick = () => pickCup(i);

    const ball = document.createElement('div');
    ball.className = 'gold-ball';
    ball.id = `ball-${i}`;
    ball.textContent = '💎';
    ball.style.display = (i === winningIndex) ? 'flex' : 'none';

    const cup = document.createElement('div');
    cup.className = 'magic-cup';
    cup.id = `cup-${i}`;

    const badge = document.createElement('div');
    badge.className = 'cup-badge';
    badge.id = `badge-${i}`;

    const lbl = document.createElement('div');
    lbl.className = 'cup-label';
    lbl.textContent = `CUP ${i+1}`;

    spot.appendChild(badge);
    spot.appendChild(ball);
    spot.appendChild(cup);
    spot.appendChild(lbl);
    rack.appendChild(spot);
  }
}

renderCups();
updateBetLabels();
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', () => { renderCups(); updateBetLabels(); });
} else {
  renderCups();
  updateBetLabels();
}
window.addEventListener('load', () => { renderCups(); updateBetLabels(); });



function startCupsGame(){
  if(!requireAuth()) return;
  if(isShuffling || isGuessing) return;

  const bet = parseFloat(document.getElementById('bet-amt').value) || 100;
  if(bet > getBalance()){ showToast('Insufficient balance'); return; }

  lastBet = bet;
  setBalance(getBalance() - bet);

  isShuffling = true;
  isGuessing = false;

  document.getElementById('stage-result-banner').style.display = 'none';
  document.getElementById('bet-amt').disabled = true;
  document.getElementById('btn-main-play').disabled = true;
  
  document.getElementById('btn-panel-play').disabled = true;
  document.getElementById('stage-status-msg').textContent = '👀 Watch closely! Locating diamond...';

  // Clear badges
  for(let i=0; i<numCups; i++){
    const b = document.getElementById(`badge-${i}`);
    if(b) b.textContent = '';
  }

  // Initial random ball placement
  winningIndex = Math.floor(Math.random() * numCups);
  for(let i=0; i<numCups; i++){
    const ball = document.getElementById(`ball-${i}`);
    ball.style.display = (i === winningIndex) ? 'flex' : 'none';
    document.getElementById(`cup-${i}`).classList.remove('lifted');
  }

  // Step 1: Lift cup to show ball
  setTimeout(()=>{
    document.getElementById(`cup-${winningIndex}`).classList.add('lifted');
    playSynth('lift');
  }, 250);

  // Step 2: Lower cup
  setTimeout(()=>{
    document.getElementById(`cup-${winningIndex}`).classList.remove('lifted');
    playSynth('lift');
  }, 1000);

  // Step 3: Fast Animated Shuffling
  setTimeout(()=>{
    document.getElementById('stage-status-msg').textContent = '🌪️ Shuffling glasses at high speed...';
    let shuffleCount = 0;
    const maxShuffles = numCups === 3 ? 12 : numCups === 4 ? 16 : 20;
    const shuffleSpeed = numCups === 3 ? 110 : numCups === 4 ? 85 : 65; // High speed animations

    const shuffleInterval = setInterval(()=>{
      const idx1 = Math.floor(Math.random() * numCups);
      let idx2 = Math.floor(Math.random() * numCups);
      while(idx2 === idx1) idx2 = Math.floor(Math.random() * numCups);

      const cup1 = document.getElementById(`cup-spot-${idx1}`);
      const cup2 = document.getElementById(`cup-spot-${idx2}`);

      // Rapid 3D sliding animation
      cup1.style.transform = `translate(${(idx2-idx1)*45}px, -18px) scale(0.92)`;
      cup2.style.transform = `translate(${(idx1-idx2)*45}px, 18px) scale(1.08)`;
      playSynth('shuffle');

      setTimeout(()=>{
        cup1.style.transform = '';
        cup2.style.transform = '';
      }, shuffleSpeed - 20);

      shuffleCount++;
      if(shuffleCount >= maxShuffles){
        clearInterval(shuffleInterval);
        isShuffling = false;
        isGuessing = true;
        document.getElementById('stage-status-msg').innerHTML = '👉 <strong>Click a cup to reveal the diamond!</strong>';
        document.getElementById('stage-status-msg').style.color = '#00e676';
      }
    }, shuffleSpeed);
  }, 1350);
}

function pickCup(chosenIndex){
  if(!isGuessing) return;
  isGuessing = false;

  const bet = lastBet;

  // USER 10% WIN PROBABILITY (As specified by user request)
  const isWin = Math.random() < 0.10;
  if(isWin){
    winningIndex = chosenIndex;
  } else {
    const otherIndices = [];
    for(let i=0; i<numCups; i++){
      if(i !== chosenIndex) otherIndices.push(i);
    }
    winningIndex = otherIndices[Math.floor(Math.random() * otherIndices.length)];
  }

  // Update visual ball position to actual outcome
  for(let i=0; i<numCups; i++){
    document.getElementById(`ball-${i}`).style.display = (i === winningIndex) ? 'flex' : 'none';
  }

  // Lift chosen cup immediately
  const chosenCup = document.getElementById(`cup-${chosenIndex}`);
  chosenCup.classList.add('lifted');
  playSynth('lift');

  // Mark badges
  document.getElementById(`badge-${chosenIndex}`).textContent = isWin ? '✅' : '❌';
  if(!isWin) {
    document.getElementById(`badge-${winningIndex}`).textContent = '💎';
  }

  // Lift all other cups after 400ms
  setTimeout(()=>{
    for(let i=0; i<numCups; i++){
      document.getElementById(`cup-${i}`).classList.add('lifted');
    }
  }, 400);

  const payout = bet * currentMultiplier;
  const banner = document.getElementById('stage-result-banner');
  const res = document.getElementById('result-container');

  if(isWin){
    setBalance(getBalance() + payout);
    totalProfit += (payout - bet);
    wins++;
    flashBal('flash-win');
    launchCupsConfetti();
    if(typeof playGameSound==='function') playGameSound('win');
    if(typeof trackGameWager==='function') trackGameWager('GG Magic Cups', bet, payout, true);

    banner.className = 'result-banner win';
    banner.innerHTML = `🎉 <strong>YOU WON +₹${payout.toFixed(2)} (${currentMultiplier}×)!</strong> Diamond was in Cup ${chosenIndex+1}`;
    res.innerHTML = `<div class="result-box win"><div class="result-box-title">💎 FOUND DIAMOND!</div><div class="result-box-val">+₹${payout.toFixed(2)}</div></div>`;
    document.getElementById('stage-status-msg').textContent = `🎉 Correct! Diamond found in Cup ${chosenIndex+1}`;
  } else {
    totalProfit -= bet;
    losses++;
    flashBal('flash-lose');
    if(typeof playGameSound==='function') playGameSound('lose');
    if(typeof trackGameWager==='function') trackGameWager('GG Magic Cups', bet, 0, false);

    banner.className = 'result-banner lose';
    banner.innerHTML = `💀 <strong>YOU LOST -₹${bet.toFixed(2)}!</strong> You picked Cup ${chosenIndex+1}, but Diamond was in Cup ${winningIndex+1}`;
    res.innerHTML = `<div class="result-box lose"><div class="result-box-title">💀 EMPTY CUP!</div><div class="result-box-val">-₹${bet.toFixed(2)}</div></div>`;
    document.getElementById('stage-status-msg').textContent = `Missed! Diamond was in Cup ${winningIndex+1}`;
  }

  const pEl = document.getElementById('stat-profit');
  pEl.textContent = (totalProfit>=0?'+':'')+' ₹'+totalProfit.toFixed(2);
  pEl.className = 'stat-box-val '+(totalProfit>=0?'green':'red');
  document.getElementById('stat-wins').textContent = wins;
  document.getElementById('stat-losses').textContent = losses;

  // Reactivate all buttons immediately for 1-click Play Again
  document.getElementById('bet-amt').disabled = false;
  document.getElementById('btn-main-play').disabled = false;
  
  document.getElementById('btn-panel-play').disabled = false;
  document.getElementById('btn-main-play').innerHTML = `🔁 PLAY AGAIN (₹<span id="lbl-bet-val">${bet.toFixed(0)}</span>)`;
  document.getElementById('btn-panel-play').textContent = '🔁 Shuffle Again';
}

function launchCupsConfetti(){
  const canvas = document.getElementById('cups-confetti');
  const ctx = canvas.getContext('2d');
  canvas.width  = canvas.parentElement.clientWidth;
  canvas.height = canvas.parentElement.clientHeight;
  const particles = [];
  const colors = ['#38bdf8','#ffd700','#ffffff','#00e676'];
  for(let i=0;i<70;i++){
    particles.push({
      x:canvas.width/2, y:canvas.height/2,
      vx:(Math.random()-0.5)*14, vy:(Math.random()-0.8)*15,
      size:Math.random()*7+3, color:colors[Math.floor(Math.random()*colors.length)],
      alpha:1
    });
  }
  function render(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    let alive=false;
    particles.forEach(p=>{
      p.x+=p.vx; p.y+=p.vy; p.vy+=0.35; p.alpha-=0.015;
      if(p.alpha>0){
        alive=true;
        ctx.fillStyle=p.color;
        ctx.globalAlpha=Math.max(0,p.alpha);
        ctx.fillRect(p.x,p.y,p.size,p.size);
      }
    });
    if(alive) requestAnimationFrame(render);
    else ctx.clearRect(0,0,canvas.width,canvas.height);
  }
  render();
}
</script>
