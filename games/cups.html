<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Magic Shells 3D – GG Wins</title>
<link rel="stylesheet" href="../game-shell.css">
<script src="../security-guard.js"></script>
<style>
.cups-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 16px;
  background: radial-gradient(ellipse at 50% 40%, #1e1b4b 0%, #0f172a 70%, #030712 100%);
  position: relative;
  overflow: hidden;
  user-select: none;
}

/* 3D Stage Table */
.cups-stage-3d {
  width: min(560px, 94vw);
  background: linear-gradient(180deg, #18181b 0%, #09090b 100%);
  border: 3.5px solid #ffd700;
  border-radius: 24px;
  padding: 18px 14px;
  box-shadow: 0 15px 50px rgba(0,0,0,0.9), inset 0 0 35px rgba(0,0,0,0.9), 0 0 30px rgba(255,215,0,0.25);
  display: flex;
  flex-direction: column;
  gap: 14px;
  position: relative;
}

.stage-top-banner {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1.5px dashed rgba(255,215,0,0.3);
  padding-bottom: 6px;
  font-family: 'Space Grotesk', sans-serif;
}

.level-tabs {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 6px;
  background: rgba(255,255,255,0.05);
  padding: 4px;
  border-radius: 10px;
}
.level-btn {
  padding: 6px 4px;
  border-radius: 6px;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 11.5px;
  font-weight: 800;
  color: #94a3b8;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
}
.level-btn.active {
  background: linear-gradient(135deg, #ffd700, #f59e0b);
  color: #000;
  box-shadow: 0 2px 10px rgba(255,215,0,0.4);
}

/* Cups Rack Row */
.cups-rack {
  height: 180px;
  display: flex;
  align-items: flex-end;
  justify-content: space-around;
  position: relative;
  padding: 10px;
  background: radial-gradient(ellipse at 50% 100%, rgba(255,215,0,0.15), transparent 70%);
  border-bottom: 3px solid rgba(255,215,0,0.4);
  border-radius: 0 0 16px 16px;
}

.cup-spot {
  position: relative;
  width: 80px;
  height: 140px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  cursor: pointer;
  transition: transform 0.2s ease;
}

/* 3D Golden Chalice Cup */
.magic-cup {
  width: 70px;
  height: 90px;
  background: linear-gradient(135deg, #fef08a 0%, #eab308 40%, #ca8a04 75%, #854d0e 100%);
  clip-path: polygon(15% 0%, 85% 0%, 100% 100%, 0% 100%);
  border-radius: 8px 8px 4px 4px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.8), inset 0 -4px 8px rgba(0,0,0,0.4);
  position: absolute;
  bottom: 0;
  z-index: 10;
  transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  display: flex;
  align-items: center;
  justify-content: center;
}
.magic-cup::before {
  content: '👑';
  font-size: 18px;
  opacity: 0.9;
}
.magic-cup.lifted {
  transform: translateY(-60px);
  filter: drop-shadow(0 15px 25px rgba(255,215,0,0.9));
}

/* Glowing Diamond Ball */
.gold-ball {
  width: 32px;
  height: 32px;
  background: radial-gradient(circle at 35% 35%, #ffffff 0%, #38bdf8 40%, #0284c7 80%, #0369a1 100%);
  border-radius: 50%;
  box-shadow: 0 0 20px #38bdf8, 0 4px 10px rgba(0,0,0,0.6);
  position: absolute;
  bottom: 10px;
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
}

.cup-label {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 11px;
  font-weight: 800;
  color: #ffd700;
  margin-top: 6px;
}
</style>
</head>
<body>

<nav class="gnav">
  <button class="gnav-back" onclick="window.location.href='../index.html'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    Lobby
  </button>
  <div class="gnav-brand-block">
    <div class="gnav-logo">GG <span>Wins</span></div>
    <div class="gnav-game-under-logo">🪄 Magic Shells 3D</div>
  </div>
  <div class="gnav-game-name">Magic Shells</div>
  <span class="gnav-game-badge" style="background:#ffd700;color:#000">3D SHELLS</span>
  <button class="btn-sound-toggle" onclick="toggleSound()" title="Toggle Sound" style="background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:14px;cursor:pointer">🔊</button>
  <div class="gnav-spacer"></div>
  <div id="wallet-chip-target"></div>
  <a href="../deposit.html" target="_blank" class="btn-deposit-box" title="Deposit Funds">
    <span class="dep-box-chip">💳</span>
    <span class="dep-box-text">Deposit</span>
  </a>
</nav>

<div class="game-layout">
  <div class="game-area cups-area">
    <div class="cups-stage-3d">
      <div class="stage-top-banner">
        <span style="font-weight:900;color:#ffd700">GOLDEN SHELL TABLE</span>
        <span id="stage-status-msg" style="color:#00e676;font-size:11.5px;font-weight:800">READY TO SHUFFLE</span>
      </div>

      <div class="level-tabs">
        <div class="level-btn active" onclick="selectLevel(3, 2.0, 'Level 1: 3 Cups', this)">Lvl 1 (3 Cups)</div>
        <div class="level-btn" onclick="selectLevel(4, 3.8, 'Level 2: 4 Cups', this)">Lvl 2 (4 Cups)</div>
        <div class="level-btn" onclick="selectLevel(5, 5.0, 'Level 3: 5 Cups', this)">Lvl 3 (5 Cups)</div>
      </div>

      <div class="cups-rack" id="cups-rack"></div>
    </div>

    <div class="copyright-footer">
      © 2026 GG Wins. Proprietary Algorithm &amp; Code Protected. Unauthorized Copying Prohibited.
    </div>
  </div>

  <div class="bet-panel">
    <div class="bet-section">
      <div class="bet-label">Bet Amount</div>
      <div class="bet-input-row">
        <div class="bet-currency">₹</div>
        <input class="bet-input" id="bet-amount" type="number" value="100.00" min="1" step="10">
        <div class="bet-quick-btns">
          <button class="qbtn" onclick="halveBet()">½</button>
          <button class="qbtn" onclick="doubleBet()">2×</button>
          <button class="qbtn" onclick="maxBet()">Max</button>
        </div>
      </div>
    </div>

    <div class="bet-section">
      <button class="btn-bet" id="btn-play" onclick="startCupsGame()">🪄 SHUFFLE &amp; PLAY</button>
    </div>

    <div class="bet-section">
      <div id="result-container"></div>
    </div>

    <div class="stats-row">
      <div class="stat-box">
        <div class="stat-box-label">Profit</div>
        <div class="stat-box-val" id="stat-profit">₹0.00</div>
      </div>
      <div class="stat-box">
        <div class="stat-box-label">Wins</div>
        <div class="stat-box-val green" id="stat-wins">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-box-label">Losses</div>
        <div class="stat-box-val red" id="stat-losses">0</div>
      </div>
    </div>
  </div>
</div>

<script src="../wallet.js"></script>
<script src="../auth-guard.js"></script>
<script>
let numCups = 3;
let currentMultiplier = 2.0;
let winningIndex = 0;
let isShuffling = false;
let isGuessing = false;
let currentBet = 100;
let totalProfit = 0, wins = 0, losses = 0;

function selectLevel(cups, mult, label, btn){
  if(isShuffling || isGuessing) return;
  numCups = cups;
  currentMultiplier = mult;
  document.querySelectorAll('.level-tabs .level-btn').forEach(b => b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  renderCups();
  const msg = document.getElementById('stage-status-msg');
  if(msg) msg.textContent = label;
}

function renderCups(){
  const rack = document.getElementById('cups-rack');
  if(!rack) return;
  rack.innerHTML = '';

  for(let i=0; i<numCups; i++){
    const spot = document.createElement('div');
    spot.className = 'cup-spot';
    spot.id = `cup-spot-${i}`;
    spot.onclick = () => pickCup(i);

    const ball = document.createElement('div');
    ball.className = 'gold-ball';
    ball.id = `ball-${i}`;
    ball.textContent = '💎';
    ball.style.display = (i === winningIndex) ? 'flex' : 'none';

    const cup = document.createElement('div');
    cup.className = 'magic-cup';
    cup.id = `cup-${i}`;

    const lbl = document.createElement('div');
    lbl.className = 'cup-label';
    lbl.textContent = `CUP ${i+1}`;

    spot.appendChild(ball);
    spot.appendChild(cup);
    spot.appendChild(lbl);
    rack.appendChild(spot);
  }
}

function startCupsGame(){
  if(typeof requireAuth === 'function' && !requireAuth()) return;
  if(isShuffling || isGuessing) return;

  const amt = parseFloat(document.getElementById('bet-amount').value);
  if(isNaN(amt) || amt <= 0){ showToast('Enter a valid bet amount!', 'error'); return; }

  const curBal = typeof getBalance === 'function' ? getBalance() : 10000;
  if(amt > curBal){ showToast('Insufficient balance!', 'error'); return; }

  if(typeof setBalance === 'function') setBalance(curBal - amt);
  currentBet = amt;

  isShuffling = true;
  isGuessing = false;
  document.getElementById('btn-play').disabled = true;
  document.getElementById('result-container').innerHTML = '';

  // 1. Reveal ball briefly
  winningIndex = Math.floor(Math.random() * numCups);
  renderCups();

  const winCup = document.getElementById(`cup-${winningIndex}`);
  if(winCup) winCup.classList.add('lifted');
  document.getElementById('stage-status-msg').textContent = '👀 Locating Diamond...';

  setTimeout(() => {
    if(winCup) winCup.classList.remove('lifted');
    document.getElementById('stage-status-msg').textContent = '🌪️ Shuffling Shells...';

    // 2. Shuffle animation
    let shuffleTicks = 0;
    const shuffleInterval = setInterval(() => {
      const spots = document.querySelectorAll('.cup-spot');
      spots.forEach(s => {
        s.style.transform = `translateX(${(Math.random()-0.5)*35}px)`;
      });
      shuffleTicks++;
      if(shuffleTicks >= 12){
        clearInterval(shuffleInterval);
        spots.forEach(s => s.style.transform = 'none');
        isShuffling = false;
        isGuessing = true;
        document.getElementById('stage-status-msg').textContent = '👉 Tap a cup to reveal!';
      }
    }, 120);
  }, 900);
}

function pickCup(idx){
  if(!isGuessing || isShuffling) return;
  isGuessing = false;
  document.getElementById('btn-play').disabled = false;

  // Reveal all cups
  for(let i=0; i<numCups; i++){
    const c = document.getElementById(`cup-${i}`);
    if(c) c.classList.add('lifted');
  }

  const res = document.getElementById('result-container');
  if(idx === winningIndex){
    const payout = currentBet * currentMultiplier;
    if(typeof setBalance === 'function') setBalance(getBalance() + payout);
    totalProfit += payout - currentBet;
    wins++;
    document.getElementById('stage-status-msg').textContent = `🎉 Diamond Found! +₹${payout.toFixed(2)}`;
    res.innerHTML = `<div class="result-box win" style="padding:8px;text-align:center;font-weight:900;color:#00e676">🎉 Correct Pick! +₹${payout.toFixed(2)} (${currentMultiplier}×)</div>`;
  } else {
    totalProfit -= currentBet;
    losses++;
    document.getElementById('stage-status-msg').textContent = `💀 Empty Cup! -₹${currentBet.toFixed(2)}`;
    res.innerHTML = `<div class="result-box lose" style="padding:8px;text-align:center;font-weight:900;color:#ef4444">💀 Empty Cup! -₹${currentBet.toFixed(2)}</div>`;
  }
  updateStats();
}

function updateStats(){
  const p = document.getElementById('stat-profit');
  if(p){
    p.textContent = (totalProfit >= 0 ? '+' : '') + ' ₹' + totalProfit.toFixed(2);
    p.className = 'stat-box-val ' + (totalProfit >= 0 ? 'green' : 'red');
  }
  const w = document.getElementById('stat-wins');
  if(w) w.textContent = wins;
  const l = document.getElementById('stat-losses');
  if(l) l.textContent = losses;
}

function halveBet(){ const i=document.getElementById('bet-amount'); if(i) i.value=Math.max(1,parseFloat(i.value||1)/2).toFixed(2); }
function doubleBet(){ const i=document.getElementById('bet-amount'); if(i) i.value=Math.min(getBalance(),parseFloat(i.value||1)*2).toFixed(2); }
function maxBet(){ const i=document.getElementById('bet-amount'); if(i) i.value=getBalance().toFixed(2); }

renderCups();
</script>
</body>
</html>
