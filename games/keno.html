<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Keno – GG Wins</title>
<link rel="stylesheet" href="../game-shell.css">
<style>
.keno-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 24px;
  gap: 18px;
  overflow: auto;
  position: relative;
  background: radial-gradient(ellipse at 50% 50%, #0d2838 0%, #040d14 100%);
}
.keno-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 8px;
  width: min(520px, 94vw);
}
.keno-tile {
  aspect-ratio: 1;
  background: linear-gradient(145deg, #132b3f, #0c1b28);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 10px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 16px;
  font-weight: 800;
  color: #94a3b8;
  cursor: pointer;
  user-select: none;
  transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  box-shadow: 0 4px 10px rgba(0,0,0,0.4);
}
.keno-tile:hover:not(.disabled) {
  border-color: #00e676;
  color: #fff;
  transform: scale(1.06);
}
.keno-tile.selected {
  background: linear-gradient(135deg, #7c4dff, #651fff);
  border-color: #b388ff;
  color: #fff;
  box-shadow: 0 0 15px rgba(124,77,255,0.6);
  transform: scale(1.04);
}
.keno-tile.drawn {
  background: #334155;
  color: #fff;
  animation: tileStrike 0.3s ease;
}
.keno-tile.match {
  background: linear-gradient(135deg, #ffd700, #ff8c00) !important;
  border-color: #fff !important;
  color: #000 !important;
  box-shadow: 0 0 25px rgba(255,215,0,0.9) !important;
  animation: matchFlash 0.5s infinite alternate !important;
  transform: scale(1.1) !important;
}
@keyframes matchFlash {
  0%{box-shadow:0 0 15px rgba(255,215,0,0.6)} 100%{box-shadow:0 0 35px rgba(255,215,0,1)}
}
@keyframes tileStrike {
  0%{transform:scale(0.8)} 50%{transform:scale(1.2)} 100%{transform:scale(1)}
}
.keno-toolbar {
  display: flex;
  gap: 10px;
  width: min(520px, 94vw);
  justify-content: space-between;
}
.keno-tool-btn {
  padding: 8px 16px;
  border-radius: 8px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.12);
  color: #fff;
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 700;
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
}
.keno-tool-btn:hover { background: rgba(255,255,255,0.12); }

.keno-payouts-strip {
  display: flex;
  gap: 6px;
  overflow-x: auto;
  width: min(520px, 94vw);
  padding: 6px 0;
}
.kp-item {
  flex: 1;
  text-align: center;
  padding: 6px 4px;
  border-radius: 8px;
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  font-family: 'Space Grotesk', sans-serif;
  font-size: 11px;
}
.kp-item.active-hit {
  background: rgba(255,215,0,0.2);
  border-color: #ffd700;
  color: #ffd700;
  font-weight: 900;
  box-shadow: 0 0 12px rgba(255,215,0,0.5);
}
</style>
<script src="../security-guard.js"></script>
</head>
<body>

<nav class="gnav">
  <button class="gnav-back" onclick="window.location.href='../index.html'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    Lobby
  </button>
  <div class="gnav-brand-block">
    <div class="gnav-logo">GG <span>Wins</span></div>
    <div class="gnav-game-under-logo">🎱 GG Keno</div>
  </div>
  <div class="gnav-game-name">Keno</div>
  <span class="gnav-game-badge" style="background:#00e676;color:#000">ORIGINAL</span>
  <button class="btn-sound-toggle" onclick="toggleSound()" title="Toggle Sound" style="background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:14px;cursor:pointer">🔊</button>
  <div class="gnav-spacer"></div>
  <div id="wallet-chip-target"></div>
  <button class="btn-wallet-game" onclick="if(typeof openWalletModal==='function') openWalletModal('deposit')">💳 Deposit</button>
</nav>

<div class="game-layout">
  <div class="game-area keno-area">
    <div class="keno-toolbar">
      <span style="font-size:12px;color:#94a3b8;font-weight:700" id="picks-count">Selected: 0/10</span>
      <div>
        <button class="keno-tool-btn" onclick="autoPick()">⚡ Auto Pick</button>
        <button class="keno-tool-btn" onclick="clearPicks()">✕ Clear</button>
      </div>
    </div>

    <div class="keno-grid" id="keno-grid"></div>

    <div class="keno-payouts-strip" id="payouts-strip"></div>
  
<div class="copyright-footer">© 2026 GG Wins. Proprietary Algorithm & Code Protected. Unauthorized Copying Prohibited.</div>
</div>

  <div class="bet-panel">
    <div class="bet-section">
      <div class="bet-label">Bet Amount</div>
      <div class="bet-input-row">
        <div class="bet-currency">₹</div>
        <input class="bet-input" id="bet-amount" type="number" value="100.00" min="1" step="1">
        <div class="bet-quick-btns">
          <button class="qbtn" onclick="halveBet()">½</button>
          <button class="qbtn" onclick="doubleBet()">2×</button>
          <button class="qbtn" onclick="maxBet()">Max</button>
        </div>
      </div>
    </div>

    <div class="bet-section">
      <button class="btn-bet" id="play-btn" onclick="playKeno()">Draw 10 Balls</button>
      
    </div>

    <div class="bet-section">
      <div id="result-container"></div>
    </div>

    <div class="stats-row">
      <div class="stat-box">
        <div class="stat-box-label">Profit</div>
        <div class="stat-box-val" id="stat-profit">$0.00</div>
      </div>
      <div class="stat-box">
        <div class="stat-box-label">Wins</div>
        <div class="stat-box-val green" id="stat-wins">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-box-label">Losses</div>
        <div class="stat-box-val red" id="stat-losses">0</div>
      </div>
    </div>
  </div>
</div>

<script src="../wallet.js"></script>
<script src="../auth-guard.js"></script>
<script>
function updateBal(){ updateAllWalletDisplays(); }
updateBal();

const TOTAL_NUMS = 40;
const DRAW_COUNT = 10;
const MAX_PICKS = 10;

const PAYOUT_TABLES = {
  1: { 1: 3.5 },
  2: { 1: 1.5, 2: 8.0 },
  3: { 2: 2.5, 3: 24.0 },
  4: { 2: 1.8, 3: 8.0, 4: 80.0 },
  5: { 3: 4.0, 4: 25.0, 5: 300.0 },
  6: { 3: 2.5, 4: 15.0, 5: 120.0, 6: 800.0 },
  7: { 3: 1.5, 4: 8.0, 5: 50.0, 6: 350.0, 7: 2000.0 },
  8: { 4: 5.0, 5: 25.0, 6: 150.0, 7: 1000.0, 8: 5000.0 },
  9: { 4: 3.0, 5: 15.0, 6: 80.0, 7: 500.0, 8: 2500.0, 9: 10000.0 },
  10: { 4: 2.0, 5: 10.0, 6: 40.0, 7: 200.0, 8: 1000.0, 9: 5000.0, 10: 25000.0 }
};

let selected = new Set();
let isPlaying = false;
let totalProfit = 0, wins = 0, losses = 0;

function buildGrid(){
  const grid = document.getElementById('keno-grid');
  grid.innerHTML = '';
  for(let i=1; i<=TOTAL_NUMS; i++){
    const tile = document.createElement('div');
    tile.className = 'keno-tile' + (selected.has(i) ? ' selected' : '');
    tile.textContent = i;
    tile.dataset.num = i;
    tile.onclick = () => togglePick(i, tile);
    grid.appendChild(tile);
  }
}
buildGrid();

function togglePick(num, tile){
  if(isPlaying) return;
  if(selected.has(num)){
    selected.delete(num);
    tile.classList.remove('selected');
  } else {
    if(selected.size >= MAX_PICKS){
      showToast('Maximum 10 numbers allowed');
      return;
    }
    selected.add(num);
    tile.classList.add('selected');
  }
  document.getElementById('picks-count').textContent = `Selected: ${selected.size}/${MAX_PICKS}`;
  updatePayoutsStrip();
}

function autoPick(){
  if(isPlaying) return;
  selected.clear();
  while(selected.size < 5){
    selected.add(Math.floor(Math.random() * TOTAL_NUMS) + 1);
  }
  buildGrid();
  document.getElementById('picks-count').textContent = `Selected: ${selected.size}/${MAX_PICKS}`;
  updatePayoutsStrip();
}

function clearPicks(){
  if(isPlaying) return;
  selected.clear();
  buildGrid();
  document.getElementById('picks-count').textContent = `Selected: 0/${MAX_PICKS}`;
  updatePayoutsStrip();
}

function updatePayoutsStrip(activeHits = null){
  const strip = document.getElementById('payouts-strip');
  strip.innerHTML = '';
  const count = selected.size;
  if(count === 0){
    strip.innerHTML = '<div style="font-size:12px;color:#94a3b8;margin:auto">Pick numbers to view multipliers</div>';
    return;
  }
  const table = PAYOUT_TABLES[count] || {};
  for(let h=1; h<=count; h++){
    const mult = table[h] || 0;
    if(mult > 0){
      const div = document.createElement('div');
      div.className = 'kp-item' + (activeHits === h ? ' active-hit' : '');
      div.innerHTML = `<div>${h} Hits</div><div style="font-weight:800">${mult}×</div>`;
      strip.appendChild(div);
    }
  }
}

function playKeno(){ if(!requireAuth()) return;
  if(isPlaying) return;
  if(selected.size === 0){ showToast('Select at least 1 number'); return; }

  const amt = parseFloat(document.getElementById('bet-amount').value);
  if(isNaN(amt) || amt <= 0){ showToast('Enter valid amount'); return; }
  if(amt > getBalance()){ showToast('Insufficient balance'); return; }

  setBalance(getBalance() - amt);
  if(typeof playGameSound === 'function') playGameSound('bet');

  isPlaying = true;
  document.getElementById('play-btn').disabled = true;
  buildGrid();

  // House edge bias: 80% forced 0 hits or low hits
  let drawn = [];
  const biasLoss = Math.random() < 0.80;
  if(biasLoss){
    const unpicked = [];
    for(let i=1; i<=TOTAL_NUMS; i++){ if(!selected.has(i)) unpicked.push(i); }
    // Pick mostly from unpicked
    while(drawn.length < DRAW_COUNT && unpicked.length > 0){
      const idx = Math.floor(Math.random() * unpicked.length);
      drawn.push(unpicked.splice(idx, 1)[0]);
    }
  } else {
    const all = Array.from({length: TOTAL_NUMS}, (_, i) => i + 1);
    while(drawn.length < DRAW_COUNT){
      const idx = Math.floor(Math.random() * all.length);
      drawn.push(all.splice(idx, 1)[0]);
    }
  }

  let matchHits = 0;
  drawn.forEach((n, i) => {
    setTimeout(() => {
      const tile = document.querySelector(`.keno-tile[data-num="${n}"]`);
      if(tile){
        if(selected.has(n)){
          tile.className = 'keno-tile match';
          matchHits++;
          if(typeof playGameSound === 'function') playGameSound('gem');
        } else {
          tile.className = 'keno-tile drawn';
          if(typeof playGameSound === 'function') playGameSound('tick');
        }
      }

      if(i === DRAW_COUNT - 1){
        setTimeout(() => resolveKeno(matchHits, amt), 400);
      }
    }, i * 200);
  });
}

function launchKenoConfetti(){
  let canvas = document.getElementById('keno-confetti');
  if(!canvas){
    canvas = document.createElement('canvas');
    canvas.id = 'keno-confetti';
    canvas.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:30;';
    document.querySelector('.keno-area').appendChild(canvas);
  }
  const ctx = canvas.getContext('2d');
  canvas.width = canvas.parentElement.clientWidth;
  canvas.height = canvas.parentElement.clientHeight;

  const particles = [];
  const colors = ['#ffd700', '#00e676', '#00bcd4', '#ff8c00', '#ffffff'];
  for(let i=0; i<65; i++){
    particles.push({
      x: canvas.width/2, y: canvas.height/2,
      vx: (Math.random()-0.5)*14, vy: (Math.random()-0.8)*15,
      size: Math.random()*7+3, color: colors[Math.floor(Math.random()*colors.length)],
      alpha: 1
    });
  }

  function render(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    let alive = false;
    particles.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.vy += 0.35; p.alpha -= 0.015;
      if(p.alpha > 0){
        alive = true;
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.fillRect(p.x, p.y, p.size, p.size);
      }
    });
    if(alive) requestAnimationFrame(render);
    else ctx.clearRect(0,0,canvas.width,canvas.height);
  }
  render();
}

function resolveKeno(hits, amt){
  isPlaying = false;
  document.getElementById('play-btn').disabled = false;

  const table = PAYOUT_TABLES[selected.size] || {};
  const mult = table[hits] || 0;
  const payout = amt * mult;
  const resContainer = document.getElementById('result-container');

  updatePayoutsStrip(hits);

  if(mult > 0){
    setBalance(getBalance() + payout);
    totalProfit += payout - amt;
    wins++;
    flashBal('flash-win');
    launchKenoConfetti();
    if(typeof playGameSound === 'function') playGameSound('win');
    if(typeof trackGameWager === 'function') trackGameWager('GG Keno', amt, payout, true);
    resContainer.innerHTML = `<div class="result-box win"><div class="result-box-title">🎉 ${hits} Hits!</div><div class="result-box-val">+₹${payout.toFixed(2)} (${mult}×)</div></div>`;
  } else {
    totalProfit -= amt;
    losses++;
    flashBal('flash-lose');
    if(typeof playGameSound === 'function') playGameSound('lose');
    if(typeof trackGameWager === 'function') trackGameWager('GG Keno', amt, 0, false);
    resContainer.innerHTML = `<div class="result-box lose"><div class="result-box-title">💸 ${hits} Hits</div><div class="result-box-val">-₹${amt.toFixed(2)}</div></div>`;
  }

  updateStats();
  setTimeout(() => resContainer.innerHTML = '', 4000);
}

function updateStats(){
  const p = document.getElementById('stat-profit');
  p.textContent = (totalProfit >= 0 ? '+' : '') + ' ₹' + totalProfit.toFixed(2);
  p.className = 'stat-box-val ' + (totalProfit >= 0 ? 'green' : 'red');
  document.getElementById('stat-wins').textContent = wins;
  document.getElementById('stat-losses').textContent = losses;
}

function halveBet(){ const i=document.getElementById('bet-amount'); i.value=Math.max(1,parseFloat(i.value||1)/2).toFixed(2); }
function doubleBet(){ const i=document.getElementById('bet-amount'); i.value=Math.min(getBalance(),parseFloat(i.value||1)*2).toFixed(2); }
function maxBet(){ document.getElementById('bet-amount').value=getBalance().toFixed(2); }
</script>
</body>
</html>
