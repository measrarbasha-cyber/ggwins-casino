<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Keno Classic 3D – GG Wins</title>
<link rel="stylesheet" href="../game-shell.css">
<script src="../security-guard.js"></script>
<style>
.keno-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 14px;
  background: radial-gradient(circle at 50% 30%, #1e1022 0%, #0c0512 70%, #030105 100%);
  position: relative;
  overflow: hidden;
  user-select: none;
}

/* 80-Ball Grid Card */
.keno-board-3d {
  width: min(540px, 94vw);
  background: linear-gradient(180deg, #18181b 0%, #09090b 100%);
  border: 3px solid #ffd700;
  border-radius: 20px;
  padding: 12px;
  box-shadow: 0 15px 45px rgba(0,0,0,0.9), inset 0 0 25px rgba(0,0,0,0.8);
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.keno-grid {
  display: grid;
  grid-template-columns: repeat(10, 1fr);
  gap: 5px;
}
.keno-tile {
  height: 32px;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 11.5px;
  font-weight: 800;
  color: #cbd5e1;
  cursor: pointer;
  transition: all 0.15s;
}
.keno-tile:hover {
  background: rgba(255,255,255,0.15);
  border-color: #ffd700;
}
.keno-tile.selected {
  background: #7c4dff;
  border-color: #a78bfa;
  color: #fff;
  box-shadow: 0 0 10px rgba(124,77,255,0.6);
}
.keno-tile.drawn {
  background: #ffd700;
  color: #000;
  border-color: #fff;
  transform: scale(1.1);
  font-weight: 900;
}
.keno-tile.matched {
  background: #00e676 !important;
  color: #000 !important;
  border-color: #fff !important;
  box-shadow: 0 0 15px rgba(0,230,118,0.9);
  animation: matchGlow 0.3s alternate infinite;
}
@keyframes matchGlow {
  0% { transform: scale(1.1); }
  100% { transform: scale(1.2); }
}
</style>
</head>
<body>

<nav class="gnav">
  <button class="gnav-back" onclick="window.location.href='../index.html'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    Lobby
  </button>
  <div class="gnav-brand-block">
    <div class="gnav-logo">GG <span>Wins</span></div>
    <div class="gnav-game-under-logo">🎱 Keno Classic 3D</div>
  </div>
  <div class="gnav-game-name">Keno Classic</div>
  <span class="gnav-game-badge" style="background:#ffd700;color:#000">80 BALLS</span>
  <button class="btn-sound-toggle" onclick="toggleSound()" title="Toggle Sound" style="background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:14px;cursor:pointer">🔊</button>
  <div class="gnav-spacer"></div>
  <div id="wallet-chip-target"></div>
  <div class="dep-action-box">
    <a href="../deposit.html" target="_blank" class="dep-box-btn" title="Instant Deposit & Match Bonus">
      <div class="dep-box-left">
        <span class="dep-box-icon">⚡</span>
        <div class="dep-box-text-group">
          <span class="dep-box-title">DEPOSIT</span>
          <span class="dep-box-sub">INSTANT FUNDS</span>
        </div>
      </div>
      <span class="dep-box-badge">+100%</span>
    </a>
  </div>
  
      </div>
      <span class="dep-box-badge">+100%</span>
    </a>
  </div>
      <span class="dep-box-badge">+100%</span>
    </a>
  </div>
</nav>

<div class="game-layout">
  <div class="game-area keno-area">
    <div class="keno-board-3d">
      <div style="display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:800;color:#ffd700;padding:0 4px">
        <span>PICK UP TO 10 NUMBERS:</span>
        <span id="lbl-keno-status" style="color:#00e676">0/10 SELECTED</span>
      </div>

      <div class="keno-grid" id="keno-grid"></div>

      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button onclick="autoPickKeno()" style="background:rgba(255,255,255,0.08);border:1px solid var(--border);color:#fff;border-radius:6px;padding:4px 10px;font-size:11px;cursor:pointer;font-weight:700">🎲 Auto Pick</button>
        <button onclick="clearKeno()" style="background:rgba(239,68,68,0.15);border:1px solid #ef4444;color:#ef4444;border-radius:6px;padding:4px 10px;font-size:11px;cursor:pointer;font-weight:700">✕ Clear</button>
      </div>
    </div>

    <div class="copyright-footer">
      © 2026 GG Wins. Proprietary Algorithm &amp; Code Protected. Unauthorized Copying Prohibited.
    </div>
  </div>

  <div class="bet-panel">
    <div class="bet-section">
      <div class="bet-label">Bet Amount</div>
      <div class="bet-input-row">
        <div class="bet-currency">₹</div>
        <input class="bet-input" id="bet-amount" type="number" value="100.00" min="1" step="10">
        <div class="bet-quick-btns">
          <button class="qbtn" onclick="halveBet()">½</button>
          <button class="qbtn" onclick="doubleBet()">2×</button>
          <button class="qbtn" onclick="maxBet()">Max</button>
        </div>
      </div>
    </div>

    <div class="bet-section">
      <button class="btn-bet" id="btn-draw" onclick="drawKeno()">🎱 DRAW 20 BALLS</button>
    </div>

    <div class="bet-section">
      <div id="result-container"></div>
    </div>

    <div class="stats-row">
      <div class="stat-box">
        <div class="stat-box-label">Profit</div>
        <div class="stat-box-val" id="stat-profit">₹0.00</div>
      </div>
      <div class="stat-box">
        <div class="stat-box-label">Wins</div>
        <div class="stat-box-val green" id="stat-wins">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-box-label">Losses</div>
        <div class="stat-box-val red" id="stat-losses">0</div>
      </div>
    </div>
  </div>
</div>

<script src="../wallet.js"></script>
<script src="../auth-guard.js"></script>
<script>
const selectedNumbers = new Set();
let isDrawing = false;
let totalProfit = 0, wins = 0, losses = 0;

function buildKenoGrid(){
  const grid = document.getElementById('keno-grid');
  grid.innerHTML = '';
  for(let i=1; i<=80; i++){
    const tile = document.createElement('div');
    tile.className = 'keno-tile';
    tile.id = `k-tile-${i}`;
    tile.textContent = i;
    tile.onclick = () => toggleNumber(i, tile);
    grid.appendChild(tile);
  }
}
buildKenoGrid();

function toggleNumber(num, tile){
  if(isDrawing) return;
  if(selectedNumbers.has(num)){
    selectedNumbers.delete(num);
    tile.classList.remove('selected');
  } else {
    if(selectedNumbers.size >= 10){
      showToast('Maximum 10 numbers allowed!', 'info');
      return;
    }
    selectedNumbers.add(num);
    tile.classList.add('selected');
  }
  document.getElementById('lbl-keno-status').textContent = `${selectedNumbers.size}/10 SELECTED`;
}

function autoPickKeno(){
  if(isDrawing) return;
  clearKeno();
  while(selectedNumbers.size < 5){
    const r = Math.floor(Math.random() * 80) + 1;
    selectedNumbers.add(r);
    const tile = document.getElementById(`k-tile-${r}`);
    if(tile) tile.classList.add('selected');
  }
  document.getElementById('lbl-keno-status').textContent = `${selectedNumbers.size}/10 SELECTED`;
}

function clearKeno(){
  if(isDrawing) return;
  selectedNumbers.clear();
  document.querySelectorAll('.keno-tile').forEach(t => {
    t.className = 'keno-tile';
  });
  document.getElementById('lbl-keno-status').textContent = `0/10 SELECTED`;
}

function drawKeno(){
  if(typeof requireAuth === 'function' && !requireAuth()) return;
  if(isDrawing) return;

  if(selectedNumbers.size === 0){
    showToast('Select at least 1 number first!', 'info');
    return;
  }

  const amt = parseFloat(document.getElementById('bet-amount').value);
  if(isNaN(amt) || amt <= 0){ showToast('Enter a valid bet amount!', 'error'); return; }

  const curBal = typeof getBalance === 'function' ? getBalance() : 10000;
  if(amt > curBal){ showToast('Insufficient balance!', 'error'); return; }

  if(typeof setBalance === 'function') setBalance(curBal - amt);
  isDrawing = true;
  document.getElementById('btn-draw').disabled = true;

  // Clear previous drawn classes but keep selected
  for(let i=1; i<=80; i++){
    const t = document.getElementById(`k-tile-${i}`);
    if(t){
      t.classList.remove('drawn', 'matched');
      if(selectedNumbers.has(i)) t.classList.add('selected');
    }
  }

  // Draw 20 random numbers
  const drawn = [];
  while(drawn.length < 20){
    const r = Math.floor(Math.random() * 80) + 1;
    if(!drawn.includes(r)) drawn.push(r);
  }

  let hits = 0;
  drawn.forEach((num, idx) => {
    setTimeout(() => {
      const tile = document.getElementById(`k-tile-${num}`);
      if(tile){
        if(selectedNumbers.has(num)){
          tile.className = 'keno-tile matched';
          hits++;
        } else {
          tile.className = 'keno-tile drawn';
        }
      }

      if(idx === 19){
        finishKenoRound(amt, hits);
      }
    }, idx * 90);
  });
}

function finishKenoRound(betAmt, hits){
  isDrawing = false;
  document.getElementById('btn-draw').disabled = false;

  const mults = { 0: 0, 1: 1.5, 2: 3.0, 3: 8.0, 4: 20.0, 5: 50.0, 6: 150.0, 7: 500.0, 8: 1000.0, 9: 2500.0, 10: 10000.0 };
  const mult = mults[hits] || 0;
  const payout = betAmt * mult;

  const res = document.getElementById('result-container');
  if(payout >= betAmt){
    if(typeof setBalance === 'function') setBalance(getBalance() + payout);
    totalProfit += payout - betAmt;
    wins++;
    res.innerHTML = `<div class="result-box win" style="padding:8px;text-align:center;font-weight:900;color:#00e676">🎉 ${hits} Hits! +₹${payout.toFixed(2)} (${mult}×)</div>`;
  } else {
    totalProfit -= betAmt;
    losses++;
    res.innerHTML = `<div class="result-box lose" style="padding:8px;text-align:center;font-weight:900;color:#ef4444">💀 ${hits} Hits! -₹${betAmt.toFixed(2)}</div>`;
  }
  updateStats();
}

function updateStats(){
  const p = document.getElementById('stat-profit');
  if(p){
    p.textContent = (totalProfit >= 0 ? '+' : '') + ' ₹' + totalProfit.toFixed(2);
    p.className = 'stat-box-val ' + (totalProfit >= 0 ? 'green' : 'red');
  }
  const w = document.getElementById('stat-wins');
  if(w) w.textContent = wins;
  const l = document.getElementById('stat-losses');
  if(l) l.textContent = losses;
}

function halveBet(){ const i=document.getElementById('bet-amount'); if(i) i.value=Math.max(1,parseFloat(i.value||1)/2).toFixed(2); }
function doubleBet(){ const i=document.getElementById('bet-amount'); if(i) i.value=Math.min(getBalance(),parseFloat(i.value||1)*2).toFixed(2); }
function maxBet(){ const i=document.getElementById('bet-amount'); if(i) i.value=getBalance().toFixed(2); }
</script>
</body>
</html>
