<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Plinko Drops 3D – GG Wins</title>
<link rel="stylesheet" href="../game-shell.css">
<script src="../security-guard.js"></script>
<style>
.plinko-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 12px;
  background: radial-gradient(ellipse at 50% 30%, #0f172a 0%, #060b14 70%, #020408 100%);
  position: relative;
  overflow: hidden;
  user-select: none;
}

#plinko-canvas {
  background: rgba(15, 23, 42, 0.6);
  border: 2px solid rgba(255, 215, 0, 0.3);
  border-radius: 20px;
  box-shadow: 0 15px 45px rgba(0,0,0,0.8), inset 0 0 30px rgba(0,0,0,0.8);
  max-width: 95vw;
  max-height: 65vh;
}
</style>
</head>
<body>

<nav class="gnav">
  <button class="gnav-back" onclick="window.location.href='../index.html'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    Lobby
  </button>
  <div class="gnav-brand-block">
    <div class="gnav-logo">GG <span>Wins</span></div>
    <div class="gnav-game-under-logo">⚽ Plinko Drops 3D</div>
  </div>
  <div class="gnav-game-name">Plinko Drops</div>
  <span class="gnav-game-badge" style="background:#00e676;color:#000">3D PHYSICS</span>
  <button class="btn-sound-toggle" onclick="toggleSound()" title="Toggle Sound" style="background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:14px;cursor:pointer">🔊</button>
  <div class="gnav-spacer"></div>
  <div id="wallet-chip-target"></div>
  <a href="../deposit.html" target="_blank" class="btn-deposit-glow" title="Instant Deposit & Bonus Portal"><span class="dep-glow-icon">⚡</span><span class="dep-glow-label">DEPOSIT</span><span class="dep-glow-badge">+100%</span></a>
</nav>

<div class="game-layout">
  <div class="game-area plinko-area">
    <canvas id="plinko-canvas" width="480" height="420"></canvas>
    <div class="copyright-footer">
      © 2026 GG Wins. Proprietary Algorithm &amp; Code Protected. Unauthorized Copying Prohibited.
    </div>
  </div>

  <div class="bet-panel">
    <div class="bet-section">
      <div class="bet-label">Bet Amount</div>
      <div class="bet-input-row">
        <div class="bet-currency">₹</div>
        <input class="bet-input" id="bet-amount" type="number" value="100.00" min="1" step="10">
        <div class="bet-quick-btns">
          <button class="qbtn" onclick="halveBet()">½</button>
          <button class="qbtn" onclick="doubleBet()">2×</button>
          <button class="qbtn" onclick="maxBet()">Max</button>
        </div>
      </div>
    </div>

    <div class="bet-section">
      <div class="bet-label">Risk Level</div>
      <div class="seg-ctrl" id="risk-ctrl">
        <div class="seg-btn" data-risk="low" onclick="setRisk('low', this)">Low</div>
        <div class="seg-btn active" data-risk="medium" onclick="setRisk('medium', this)">Med</div>
        <div class="seg-btn" data-risk="high" onclick="setRisk('high', this)">High</div>
      </div>
    </div>

    <div class="bet-section">
      <button class="btn-bet" id="btn-drop" onclick="dropBall()">⚽ DROP BALL</button>
    </div>

    <div class="bet-section">
      <div id="result-container"></div>
    </div>

    <div class="stats-row">
      <div class="stat-box">
        <div class="stat-box-label">Profit</div>
        <div class="stat-box-val" id="stat-profit">₹0.00</div>
      </div>
      <div class="stat-box">
        <div class="stat-box-label">Wins</div>
        <div class="stat-box-val green" id="stat-wins">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-box-label">Losses</div>
        <div class="stat-box-val red" id="stat-losses">0</div>
      </div>
    </div>
  </div>
</div>

<script src="../wallet.js"></script>
<script src="../auth-guard.js"></script>
<script>
const canvas = document.getElementById('plinko-canvas');
const ctx = canvas.getContext('2d');

const ROWS = 10;
const PINS = [];
const BALLS = [];
const BUCKET_MULTS = [10.0, 3.0, 1.5, 0.5, 0.2, 0.2, 0.5, 1.5, 3.0, 10.0];
const BUCKET_COLORS = ['#ef4444', '#f97316', '#eab308', '#84cc16', '#10b981', '#10b981', '#84cc16', '#eab308', '#f97316', '#ef4444'];

let totalProfit = 0, wins = 0, losses = 0;
let currentRisk = 'medium';

// Build Pin Pyramid
function buildPins(){
  PINS.length = 0;
  const startY = 50;
  const rowGap = 30;
  for(let r=0; r<ROWS; r++){
    const pinsInRow = r + 3;
    const spacing = 32;
    const startX = (canvas.width / 2) - ((pinsInRow - 1) * spacing / 2);
    for(let c=0; c<pinsInRow; c++){
      PINS.push({
        x: startX + c * spacing,
        y: startY + r * rowGap,
        r: 3.5
      });
    }
  }
}
buildPins();

function playTone(freq, dur){
  try {
    const actx = new (window.AudioContext || window.webkitAudioContext)();
    const osc = actx.createOscillator();
    const gain = actx.createGain();
    osc.frequency.setValueAtTime(freq, actx.currentTime);
    gain.gain.setValueAtTime(0.12, actx.currentTime);
    gain.gain.linearRampToValueAtTime(0.01, actx.currentTime + dur);
    osc.connect(gain); gain.connect(actx.destination);
    osc.start(); osc.stop(actx.currentTime + dur);
  } catch(e){}
}

function dropBall(){
  if(typeof requireAuth === 'function' && !requireAuth()) return;

  const amt = parseFloat(document.getElementById('bet-amount').value);
  if(isNaN(amt) || amt <= 0){ showToast('Enter a valid bet amount!', 'error'); return; }

  const curBal = typeof getBalance === 'function' ? getBalance() : 10000;
  if(amt > curBal){ showToast('Insufficient balance!', 'error'); return; }

  if(typeof setBalance === 'function') setBalance(curBal - amt);

  const startOffset = (Math.random() - 0.5) * 8;
  BALLS.push({
    x: canvas.width / 2 + startOffset,
    y: 18,
    vx: (Math.random() - 0.5) * 1.5,
    vy: 1.5,
    r: 6.5,
    bet: amt,
    color: '#00e676'
  });

  playTone(600, 0.05);
}

function updatePhysics(){
  for(let i=BALLS.length-1; i>=0; i--){
    const b = BALLS[i];
    b.vy += 0.22; // gravity
    b.x += b.vx;
    b.y += b.vy;
    b.vx *= 0.98;

    // Pin collisions
    PINS.forEach(p => {
      const dx = b.x - p.x;
      const dy = b.y - p.y;
      const dist = Math.hypot(dx, dy);
      if(dist < b.r + p.r){
        const angle = Math.atan2(dy, dx);
        b.vx = Math.cos(angle) * 2.2 + (Math.random() - 0.5) * 0.8;
        b.vy = Math.abs(Math.sin(angle)) * 2.2;
        b.x = p.x + Math.cos(angle) * (b.r + p.r + 1);
        b.y = p.y + Math.sin(angle) * (b.r + p.r + 1);
        playTone(350 + Math.random()*300, 0.03);
      }
    });

    // Reached bottom buckets
    if(b.y >= canvas.height - 35){
      const bucketWidth = canvas.width / BUCKET_MULTS.length;
      const bIdx = Math.max(0, Math.min(BUCKET_MULTS.length - 1, Math.floor(b.x / bucketWidth)));
      const mult = BUCKET_MULTS[bIdx];
      const payout = b.bet * mult;

      if(typeof setBalance === 'function') setBalance(getBalance() + payout);
      totalProfit += payout - b.bet;
      if(payout >= b.bet) wins++; else losses++;
      playTone(mult >= 2 ? 800 : 250, 0.15);

      const res = document.getElementById('result-container');
      if(res){
        res.innerHTML = `<div class="result-box ${payout>=b.bet?'win':'lose'}" style="padding:6px;text-align:center;font-weight:900;color:${payout>=b.bet?'#00e676':'#ef4444'}">${mult}× (${payout>=b.bet?'+':''}₹${payout.toFixed(2)})</div>`;
      }
      updateStats();
      BALLS.splice(i, 1);
    }
  }
}

function drawGame(){
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Draw Bottom Buckets
  const bucketWidth = canvas.width / BUCKET_MULTS.length;
  BUCKET_MULTS.forEach((m, idx) => {
    ctx.fillStyle = BUCKET_COLORS[idx];
    ctx.fillRect(idx * bucketWidth + 2, canvas.height - 28, bucketWidth - 4, 24);
    ctx.fillStyle = '#000';
    ctx.font = 'bold 10px Space Grotesk, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(m + '×', idx * bucketWidth + bucketWidth / 2, canvas.height - 12);
  });

  // Draw Pins
  PINS.forEach(p => {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = '#ffd700';
    ctx.shadowColor = 'rgba(255,215,0,0.8)';
    ctx.shadowBlur = 6;
    ctx.fill();
    ctx.shadowBlur = 0;
  });

  // Draw Balls
  BALLS.forEach(b => {
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    ctx.fillStyle = b.color;
    ctx.shadowColor = 'rgba(0,230,118,0.9)';
    ctx.shadowBlur = 10;
    ctx.fill();
    ctx.shadowBlur = 0;
  });

  updatePhysics();
  requestAnimationFrame(drawGame);
}
drawGame();

function setRisk(r, btn){
  currentRisk = r;
  document.querySelectorAll('#risk-ctrl .seg-btn').forEach(b => b.classList.remove('active'));
  if(btn) btn.classList.add('active');
}

function updateStats(){
  const p = document.getElementById('stat-profit');
  if(p){
    p.textContent = (totalProfit >= 0 ? '+' : '') + ' ₹' + totalProfit.toFixed(2);
    p.className = 'stat-box-val ' + (totalProfit >= 0 ? 'green' : 'red');
  }
  const w = document.getElementById('stat-wins');
  if(w) w.textContent = wins;
  const l = document.getElementById('stat-losses');
  if(l) l.textContent = losses;
}

function halveBet(){ const i=document.getElementById('bet-amount'); if(i) i.value=Math.max(1,parseFloat(i.value||1)/2).toFixed(2); }
function doubleBet(){ const i=document.getElementById('bet-amount'); if(i) i.value=Math.min(getBalance(),parseFloat(i.value||1)*2).toFixed(2); }
function maxBet(){ const i=document.getElementById('bet-amount'); if(i) i.value=getBalance().toFixed(2); }
</script>
</body>
</html>
