<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>7 Up 7 Down – GG Wins</title>
<link rel="stylesheet" href="../game-shell.css">
<style>
.table-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  background: radial-gradient(circle at 50% 40%, #0d2818 0%, #06150d 70%, #020704 100%);
  padding: 20px;
}
.shaker-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  margin-bottom: 24px;
}
.shaker-cup {
  width: 140px;
  height: 110px;
  background: linear-gradient(135deg, rgba(255,215,0,0.4), rgba(255,255,255,0.1));
  border: 3px solid #ffd700;
  border-radius: 70px 70px 20px 20px;
  box-shadow: 0 0 35px rgba(255,215,0,0.3), inset 0 2px 10px rgba(255,255,255,0.4);
  display: flex;
  align-items: center;
  justify-content: center;
  backdrop-filter: blur(8px);
  position: relative;
  transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.shaker-cup.shaking {
  animation: fxScreenShake 0.45s infinite alternate;
}
.shaker-cup.lifted {
  transform: translateY(-45px) scale(1.05);
}
.dice-tray {
  display: flex;
  gap: 18px;
  margin-top: 15px;
}
.p-die {
  width: 54px;
  height: 54px;
  background: #ffffff;
  border-radius: 12px;
  box-shadow: 0 6px 16px rgba(0,0,0,0.6), inset 0 -2px 0 #cbd5e1;
  display: grid;
  grid-template: repeat(3, 1fr) / repeat(3, 1fr);
  padding: 6px;
  transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.p-pip {
  width: 8px;
  height: 8px;
  background: #0f172a;
  border-radius: 50%;
  align-self: center;
  justify-self: center;
}
.p-die.red-pip .p-pip {
  background: #dc2626;
}
.bet-zones {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 14px;
  width: min(540px, 94vw);
}
.bet-zone-card {
  background: rgba(17, 24, 39, 0.85);
  border: 2px solid rgba(255, 255, 255, 0.12);
  border-radius: 16px;
  padding: 18px 12px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
  position: relative;
  overflow: hidden;
}
.bet-zone-card:hover {
  transform: translateY(-4px);
  border-color: rgba(255, 215, 0, 0.5);
}
.bet-zone-card.selected {
  border-color: #ffd700;
  background: radial-gradient(circle at 50% 30%, rgba(255, 215, 0, 0.25) 0%, rgba(17, 24, 39, 0.95) 100%);
  box-shadow: 0 0 25px rgba(255, 215, 0, 0.35);
}
.bet-zone-card.winner {
  border-color: #00e676 !important;
  background: radial-gradient(circle at 50% 30%, rgba(0, 230, 118, 0.35) 0%, rgba(17, 24, 39, 0.95) 100%) !important;
  box-shadow: 0 0 35px rgba(0, 230, 118, 0.6) !important;
  animation: fxBorderPulse 1.2s infinite;
}
.zone-title {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 17px;
  font-weight: 900;
  color: #f8fafc;
  margin-bottom: 4px;
}
.zone-range {
  font-size: 12px;
  color: #94a3b8;
  font-weight: 700;
  margin-bottom: 8px;
}
.zone-mult {
  display: inline-block;
  background: rgba(255, 215, 0, 0.15);
  color: #ffd700;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 13px;
  font-weight: 900;
  padding: 3px 10px;
  border-radius: 10px;
  border: 1px solid rgba(255, 215, 0, 0.3);
}
.dice-sum-display {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 32px;
  font-weight: 900;
  color: #ffd700;
  margin-top: 10px;
  text-shadow: 0 0 20px rgba(255,215,0,0.5);
}
</style>
<script src="../security-guard.js"></script>
</head>
<body>

<nav class="gnav">
  <div class="gnav-left">
    <button class="gnav-back" onclick="window.location.href='../index.html'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="18" height="18"><polyline points="15 18 9 12 15 6"/></svg>
      Lobby
    </button>
    <div class="gnav-title">🎲 7 Up 7 Down</div>
  </div>
  <div class="gnav-right">
    <div class="wallet-switcher-container">
      <button class="wallet-chip-btn" onclick="toggleWalletMenu()">
        <span class="wallet-chip-icon">🪙</span>
        <span id="bal-display" style="color:#00e676;font-weight:800">₹50,000.00</span>
        <span class="wallet-active-badge" style="background:#7c4dff">DEMO</span>
        <svg class="chevron-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="12" height="12"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
    </div>
  </div>
  <button class="btn-wallet-game" onclick="openWalletModal('deposit')">
    💳 Deposit
  </button>
</nav>

<div class="game-layout">
  <div class="game-area table-area">
    <div class="shaker-container">
      <div class="shaker-cup" id="shaker-cup">
        <span style="font-size:32px">👑</span>
      </div>
      <div class="dice-tray" id="dice-tray">
        <div class="p-die red-pip" id="die-1"></div>
        <div class="p-die" id="die-2"></div>
      </div>
      <div class="dice-sum-display" id="sum-display">TOTAL: --</div>
    </div>

    <!-- 3 BET ZONES -->
    <div class="bet-zones">
      <div class="bet-zone-card selected" id="zone-down" onclick="selectZone('down')">
        <div class="zone-title">7 DOWN</div>
        <div class="zone-range">Numbers 2 - 6</div>
        <div class="zone-mult">2.00×</div>
      </div>
      <div class="bet-zone-card" id="zone-seven" onclick="selectZone('seven')">
        <div class="zone-title">LUCKY 7</div>
        <div class="zone-range">Exact 7</div>
        <div class="zone-mult" style="color:#00e676;border-color:#00e676">5.00×</div>
      </div>
      <div class="bet-zone-card" id="zone-up" onclick="selectZone('up')">
        <div class="zone-title">7 UP</div>
        <div class="zone-range">Numbers 8 - 12</div>
        <div class="zone-mult">2.00×</div>
      </div>
    </div>
    <div class="copyright-footer">© 2026 GG Wins. Proprietary Algorithm & Code Protected.</div>
  </div>

  <div class="bet-panel">
    <div class="bet-section">
      <div class="bet-label">Bet Amount</div>
      <div class="bet-input-row">
        <div class="bet-currency">₹</div>
        <input class="bet-input" id="bet-amount" type="number" value="100.00" min="1" step="1">
        <div class="bet-quick-btns">
          <button class="qbtn" onclick="halveBet()">½</button>
          <button class="qbtn" onclick="doubleBet()">2×</button>
          <button class="qbtn" onclick="maxBet()">Max</button>
        </div>
      </div>
    </div>

    <div class="bet-section">
      <button class="btn-bet" id="roll-btn" onclick="rollDice()">🎲 Shake & Roll Dice</button>
    </div>

    <div class="bet-section">
      <div id="result-box"></div>
    </div>

    <div class="stats-row">
      <div class="stat-box">
        <div class="stat-box-label">Profit</div>
        <div class="stat-box-val" id="stat-profit">₹0.00</div>
      </div>
      <div class="stat-box">
        <div class="stat-box-label">Wins</div>
        <div class="stat-box-val green" id="stat-wins">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-box-label">Losses</div>
        <div class="stat-box-val red" id="stat-losses">0</div>
      </div>
    </div>
  </div>
</div>

<script src="../wallet.js"></script>
<script>
let selectedZone = 'down';
let rolling = false;
let totalProfit = 0; let wins = 0; let losses = 0;

const DIE_PIPS = {
  1: [4],
  2: [0, 8],
  3: [0, 4, 8],
  4: [0, 2, 6, 8],
  5: [0, 2, 4, 6, 8],
  6: [0, 2, 3, 5, 6, 8]
};

function renderDie(el, val) {
  el.innerHTML = '';
  const pips = DIE_PIPS[val] || [];
  for (let i = 0; i < 9; i++) {
    if (pips.includes(i)) {
      const pip = document.createElement('div');
      pip.className = 'p-pip';
      el.appendChild(pip);
    } else {
      el.appendChild(document.createElement('div'));
    }
  }
}

renderDie(document.getElementById('die-1'), 3);
renderDie(document.getElementById('die-2'), 4);

function selectZone(zone) {
  if (rolling) return;
  selectedZone = zone;
  document.querySelectorAll('.bet-zone-card').forEach(c => c.classList.remove('selected'));
  document.getElementById('zone-' + zone).classList.add('selected');
  if (window.fxPlayClick) window.fxPlayClick();
}

function halveBet() {
  const el = document.getElementById('bet-amount');
  el.value = Math.max(1, (parseFloat(el.value) / 2).toFixed(2));
}
function doubleBet() {
  const el = document.getElementById('bet-amount');
  el.value = (parseFloat(el.value) * 2).toFixed(2);
}
function maxBet() {
  const bal = typeof getBalance === 'function' ? getBalance() : 50000;
  document.getElementById('bet-amount').value = Math.min(10000, bal).toFixed(2);
}

function rollDice() {
  if (rolling) return;
  const amt = parseFloat(document.getElementById('bet-amount').value);
  if (isNaN(amt) || amt <= 0) { showToast('Enter valid bet amount', 'error'); return; }
  const bal = typeof getBalance === 'function' ? getBalance() : 50000;
  if (amt > bal) { showToast('Insufficient balance', 'error'); return; }

  if (typeof adjustBalance === 'function') adjustBalance(-amt, '7 Up 7 Down Bet');
  rolling = true;
  document.getElementById('roll-btn').disabled = true;
  document.querySelectorAll('.bet-zone-card').forEach(c => c.classList.remove('winner'));
  document.getElementById('result-box').innerHTML = '';

  const cup = document.getElementById('shaker-cup');
  cup.classList.add('shaking');
  cup.classList.remove('lifted');

  if (window.fxPlayCoin) window.fxPlayCoin();

  const isDemo = typeof window.isDemoMode === 'function' && window.isDemoMode();
  let outcome;

  if (isDemo) {
    // 100% Guaranteed Win in Demo
    if (selectedZone === 'down') outcome = Math.floor(Math.random() * 5) + 2; // 2..6
    else if (selectedZone === 'seven') outcome = 7;
    else outcome = Math.floor(Math.random() * 5) + 8; // 8..12
  } else {
    // 20% Win / 80% Loss in Real
    const isWin = Math.random() < 0.20;
    if (isWin) {
      if (selectedZone === 'down') outcome = Math.floor(Math.random() * 5) + 2;
      else if (selectedZone === 'seven') outcome = 7;
      else outcome = Math.floor(Math.random() * 5) + 8;
    } else {
      // Pick opposing zone
      if (selectedZone === 'down') outcome = Math.random() < 0.5 ? 7 : Math.floor(Math.random() * 5) + 8;
      else if (selectedZone === 'seven') outcome = Math.random() < 0.5 ? 4 : 9;
      else outcome = Math.random() < 0.5 ? 7 : Math.floor(Math.random() * 5) + 2;
    }
  }

  // Split outcome into 2 dice
  let d1 = Math.max(1, Math.min(6, Math.floor(outcome / 2)));
  let d2 = outcome - d1;
  if (d2 > 6) { d2 = 6; d1 = outcome - 6; }

  setTimeout(() => {
    cup.classList.remove('shaking');
    cup.classList.add('lifted');

    renderDie(document.getElementById('die-1'), d1);
    renderDie(document.getElementById('die-2'), d2);
    document.getElementById('sum-display').textContent = `TOTAL: ${outcome}`;

    // Evaluate Win
    let won = false;
    let mult = 2.0;
    let winningZoneId = '';

    if (outcome < 7) {
      winningZoneId = 'zone-down';
      if (selectedZone === 'down') won = true;
    } else if (outcome === 7) {
      winningZoneId = 'zone-seven';
      mult = 5.0;
      if (selectedZone === 'seven') won = true;
    } else {
      winningZoneId = 'zone-up';
      if (selectedZone === 'up') won = true;
    }

    document.getElementById(winningZoneId).classList.add('winner');

    if (won) {
      const payout = amt * mult;
      if (typeof adjustBalance === 'function') adjustBalance(payout, `7 Up 7 Down Win (${mult}×)`);
      totalProfit += payout - amt;
      wins++;
      document.getElementById('result-box').innerHTML = `<div style="padding:10px;background:rgba(0,230,118,0.15);border:1px solid #00e676;border-radius:8px;color:#00e676;font-weight:800;text-align:center">🎉 WON ₹${payout.toFixed(2)} (${mult}×)</div>`;
      if (window.fireGoldCoinShower) window.fireGoldCoinShower(window.innerWidth / 2, window.innerHeight * 0.4, 40);
      if (window.showBigWinModal && mult >= 5) window.showBigWinModal('₹' + payout.toFixed(2), mult + '×');
      if (window.fxPlayWin) window.fxPlayWin();
    } else {
      totalProfit -= amt;
      losses++;
      document.getElementById('result-box').innerHTML = `<div style="padding:10px;background:rgba(239,68,68,0.15);border:1px solid #ef4444;border-radius:8px;color:#ef4444;font-weight:800;text-align:center">TRY AGAIN! TOTAL WAS ${outcome}</div>`;
      if (window.triggerScreenShake) window.triggerScreenShake(document.querySelector('.table-area'));
    }

    updateStats();
    rolling = false;
    document.getElementById('roll-btn').disabled = false;
  }, 1200);
}

function updateStats() {
  document.getElementById('stat-profit').textContent = (totalProfit >= 0 ? '+' : '') + '₹' + totalProfit.toFixed(2);
  document.getElementById('stat-profit').className = 'stat-box-val ' + (totalProfit >= 0 ? 'green' : 'red');
  document.getElementById('stat-wins').textContent = wins;
  document.getElementById('stat-losses').textContent = losses;
}
</script>
</body>
</html>
