<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Fortune Slots 3D – GG Wins</title>
<link rel="stylesheet" href="../game-shell.css">
<script src="../security-guard.js"></script>
<style>
.slots-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 16px;
  background: radial-gradient(circle at 50% 40%, #2e1065 0%, #0f0728 70%, #03010c 100%);
  position: relative;
  overflow: hidden;
  user-select: none;
}

/* 3D Machine Cabinet */
.slot-machine-3d {
  width: min(540px, 94vw);
  background: linear-gradient(180deg, #3b0764 0%, #1e1b4b 50%, #0f172a 100%);
  border: 3.5px solid #ffd700;
  border-radius: 24px;
  padding: 18px 14px;
  box-shadow: 0 15px 50px rgba(0,0,0,0.9), 0 0 35px rgba(255,215,0,0.35), inset 0 0 30px rgba(0,0,0,0.8);
  display: flex;
  flex-direction: column;
  gap: 12px;
  position: relative;
  perspective: 1000px;
}

/* Jackpot Ticker */
.slot-top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: rgba(0,0,0,0.6);
  border: 1.5px solid rgba(255,215,0,0.4);
  border-radius: 12px;
  padding: 6px 12px;
  font-family: 'Space Grotesk', sans-serif;
}
.jackpot-label { color: #ffd700; font-weight: 900; font-size: 13px; }
.jackpot-val { color: #00e676; font-weight: 900; font-size: 15px; text-shadow: 0 0 10px rgba(0,230,118,0.6); }

/* Reels Window Frame */
.reels-container {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 8px;
  background: #000;
  border: 3px solid #7c4dff;
  border-radius: 16px;
  padding: 10px;
  box-shadow: inset 0 0 25px rgba(0,0,0,0.9), 0 0 20px rgba(124,77,255,0.4);
  position: relative;
  overflow: hidden;
}

.reel-strip {
  height: 140px;
  background: linear-gradient(180deg, #18181b 0%, #27272a 50%, #18181b 100%);
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,0.12);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-size: 42px;
  box-shadow: inset 0 8px 15px rgba(0,0,0,0.8), inset 0 -8px 15px rgba(0,0,0,0.8);
  transition: transform 0.1s ease;
  position: relative;
}
.reel-strip.spinning {
  animation: reelSpin 0.12s infinite linear;
}
@keyframes reelSpin {
  0% { transform: translateY(-10px); }
  50% { transform: translateY(10px); }
  100% { transform: translateY(0); }
}

/* Payline Win Banner */
.win-banner {
  display: none;
  background: linear-gradient(135deg, rgba(0,230,118,0.25), rgba(255,215,0,0.2));
  border: 2px solid #00e676;
  border-radius: 12px;
  padding: 8px 14px;
  text-align: center;
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 900;
  font-size: 15px;
  color: #ffd700;
  text-shadow: 0 0 10px rgba(0,230,118,0.6);
  animation: bannerPulse 0.4s infinite alternate;
}
@keyframes bannerPulse {
  0% { transform: scale(0.98); }
  100% { transform: scale(1.02); }
}

#confetti-canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 50;
}
</style>
</head>
<body>

  <button class="gnav-back" onclick="window.location.href='../index.html'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    Lobby
  </button>
  <div class="gnav-brand-block">
    <div class="gnav-logo">GG <span>Wins</span></div>
    <div class="gnav-game-under-logo">🎰 Fortune Slots 3D</div>
  </div>
  <div class="gnav-game-name">Fortune Slots</div>
  <span class="gnav-game-badge" style="background:#ffd700;color:#000">3D ORIGINAL</span>
  <button class="btn-sound-toggle" onclick="toggleSound()" title="Toggle Sound" style="background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:14px;cursor:pointer">🔊</button>
  <div class="gnav-spacer"></div>
  <div id="wallet-chip-target"></div>
  <a href="../deposit.html" target="_blank" class="btn-deposit-blue" title="Deposit Funds"><span class="dep-blue-icon">💳</span><span>Deposit</span></a>
      <span class="dep-box-badge">+100%</span>
    </a>
  </div>
  
      </div>
      <span class="dep-box-badge">+100%</span>
    </a>
  </div>
      <span class="dep-box-badge">+100%</span>
    </a>
  </div>
</nav>

<div class="game-layout">
  <div class="game-area slots-area">
    <canvas id="confetti-canvas"></canvas>

    <div class="slot-machine-3d">
      <div class="slot-top-bar">
        <span class="jackpot-label">👑 MEGA JACKPOT</span>
        <span class="jackpot-val" id="lbl-jackpot">₹2,50,000.00</span>
      </div>

      <div class="win-banner" id="slot-win-banner">
        🎉 JACKPOT MATCH! +₹0.00
      </div>

      <div class="reels-container">
        <div class="reel-strip" id="reel-0">💎</div>
        <div class="reel-strip" id="reel-1">👑</div>
        <div class="reel-strip" id="reel-2">7️⃣</div>
        <div class="reel-strip" id="reel-3">🍀</div>
        <div class="reel-strip" id="reel-4">🔔</div>
      </div>
    </div>

    <div class="copyright-footer">
      © 2026 GG Wins. Proprietary Algorithm &amp; Code Protected. Unauthorized Copying Prohibited.
    </div>
  </div>

  <div class="bet-panel">
    <div class="bet-section">
      <div class="bet-label">Bet Amount</div>
      <div class="bet-input-row">
        <div class="bet-currency">₹</div>
        <input class="bet-input" id="bet-amount" type="number" value="100.00" min="1" step="10">
        <div class="bet-quick-btns">
          <button class="qbtn" onclick="halveBet()">½</button>
          <button class="qbtn" onclick="doubleBet()">2×</button>
          <button class="qbtn" onclick="maxBet()">Max</button>
        </div>
      </div>
    </div>

    <div class="bet-section">
      <button class="btn-bet" id="btn-spin" onclick="spinSlots()">🎰 SPIN REELS</button>
    </div>

    <div class="bet-section">
      <div id="result-container"></div>
    </div>

    <div class="stats-row">
      <div class="stat-box">
        <div class="stat-box-label">Profit</div>
        <div class="stat-box-val" id="stat-profit">₹0.00</div>
      </div>
      <div class="stat-box">
        <div class="stat-box-label">Wins</div>
        <div class="stat-box-val green" id="stat-wins">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-box-label">Losses</div>
        <div class="stat-box-val red" id="stat-losses">0</div>
      </div>
    </div>
  </div>
</div>

<script src="../wallet.js"></script>
<script src="../auth-guard.js"></script>
<script>
const SYMBOLS = ['💎', '👑', '7️⃣', '🍀', '🔔', '🍇', '🍒'];
const PAYOUTS = {
  '👑': 25.0,
  '💎': 15.0,
  '7️⃣': 10.0,
  '🍀': 5.0,
  '🔔': 3.0,
  '🍇': 2.0,
  '🍒': 1.5
};

let isSpinning = false;
let totalProfit = 0, wins = 0, losses = 0;

function playSlotsSound(type){
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const now = ctx.currentTime;
    if(type === 'spin'){
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.frequency.setValueAtTime(300, now);
      osc.frequency.linearRampToValueAtTime(700, now + 0.1);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(now); osc.stop(now + 0.1);
    } else if(type === 'win'){
      [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.setValueAtTime(freq, now + i * 0.08);
        gain.gain.setValueAtTime(0.2, now + i * 0.08);
        gain.gain.linearRampToValueAtTime(0.01, now + i * 0.08 + 0.3);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(now + i * 0.08); osc.stop(now + i * 0.08 + 0.3);
      });
    }
  } catch(e){}
}

function spinSlots(){
  if(typeof requireAuth === 'function' && !requireAuth()) return;
  if(isSpinning) return;

  const amt = parseFloat(document.getElementById('bet-amount').value);
  if(isNaN(amt) || amt <= 0){ showToast('Enter a valid bet amount!', 'error'); return; }

  const curBal = typeof getBalance === 'function' ? getBalance() : 10000;
  if(amt > curBal){ showToast('Insufficient balance!', 'error'); return; }

  if(typeof setBalance === 'function') setBalance(curBal - amt);
  isSpinning = true;
  document.getElementById('btn-spin').disabled = true;
  document.getElementById('slot-win-banner').style.display = 'none';

  playSlotsSound('spin');

  // Start spinning animation
  for(let i=0; i<5; i++){
    const reel = document.getElementById(`reel-${i}`);
    if(reel) reel.classList.add('spinning');
  }

  // Generate outcomes
  const outcomes = [];
  const winRoll = Math.random();
  if(winRoll < 0.35){
    // Match 3, 4, or 5
    const winSym = SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];
    const matchCount = Math.random() < 0.6 ? 3 : (Math.random() < 0.8 ? 4 : 5);
    for(let i=0; i<matchCount; i++) outcomes.push(winSym);
    while(outcomes.length < 5) outcomes.push(SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)]);
  } else {
    // Mixed
    for(let i=0; i<5; i++) outcomes.push(SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)]);
  }

  // Stop reels sequentially
  outcomes.forEach((sym, idx) => {
    setTimeout(() => {
      const reel = document.getElementById(`reel-${idx}`);
      if(reel){
        reel.classList.remove('spinning');
        reel.textContent = sym;
      }
      playSlotsSound('spin');

      if(idx === 4){
        finishRound(amt, outcomes);
      }
    }, 400 + idx * 250);
  });
}

function finishRound(betAmt, results){
  isSpinning = false;
  document.getElementById('btn-spin').disabled = false;

  // Evaluate matches
  let matchLen = 1;
  for(let i=1; i<results.length; i++){
    if(results[i] === results[0]) matchLen++;
    else break;
  }

  const resContainer = document.getElementById('result-container');
  const winBanner = document.getElementById('slot-win-banner');

  if(matchLen >= 3){
    const sym = results[0];
    const baseMult = PAYOUTS[sym] || 2.0;
    const mult = matchLen === 5 ? baseMult * 3 : (matchLen === 4 ? baseMult * 1.8 : baseMult);
    const payout = betAmt * mult;

    if(typeof setBalance === 'function') setBalance(getBalance() + payout);
    totalProfit += payout - betAmt;
    wins++;
    playSlotsSound('win');

    winBanner.style.display = 'block';
    winBanner.textContent = `🎉 ${matchLen}× ${sym} MATCH! +₹${payout.toFixed(2)} (${mult}×)`;
    resContainer.innerHTML = `<div class="result-box win" style="padding:8px;text-align:center;color:#00e676;font-weight:900">+₹${payout.toFixed(2)}</div>`;
  } else {
    totalProfit -= betAmt;
    losses++;
    resContainer.innerHTML = `<div class="result-box lose" style="padding:8px;text-align:center;color:#ef4444;font-weight:900">-₹${betAmt.toFixed(2)}</div>`;
  }

  updateStats();
}

function updateStats(){
  const p = document.getElementById('stat-profit');
  if(p){
    p.textContent = (totalProfit >= 0 ? '+' : '') + ' ₹' + totalProfit.toFixed(2);
    p.className = 'stat-box-val ' + (totalProfit >= 0 ? 'green' : 'red');
  }
  const w = document.getElementById('stat-wins');
  if(w) w.textContent = wins;
  const l = document.getElementById('stat-losses');
  if(l) l.textContent = losses;
}

function halveBet(){ const i=document.getElementById('bet-amount'); if(i) i.value=Math.max(1,parseFloat(i.value||1)/2).toFixed(2); }
function doubleBet(){ const i=document.getElementById('bet-amount'); if(i) i.value=Math.min(getBalance(),parseFloat(i.value||1)*2).toFixed(2); }
function maxBet(){ const i=document.getElementById('bet-amount'); if(i) i.value=getBalance().toFixed(2); }
</script>
</body>
</html>
