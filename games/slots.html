<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slots – GG Wins</title>
<link rel="stylesheet" href="../game-shell.css">
<style>
.slots-area {
  flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:24px;gap:20px;overflow:auto;position:relative;
}
.slot-machine {
  background:linear-gradient(145deg,#0d1f30,#162d44);
  border:2px solid rgba(255,215,0,0.4);
  border-radius:24px;
  padding:28px 24px;
  box-shadow:0 0 50px rgba(255,215,0,0.15), inset 0 0 60px rgba(0,0,0,0.5);
  position:relative;
  transition:transform 0.2s cubic-bezier(.17,.67,.43,.98);
}
.slot-machine.shake {
  animation: machineShake 0.4s cubic-bezier(.36,.07,.19,.97) both;
}
@keyframes machineShake {
  10%, 90% { transform: translate3d(-2px, 0, 0); }
  20%, 80% { transform: translate3d(3px, 0, 0); }
  30%, 50%, 70% { transform: translate3d(-4px, 0, 0); }
  40%, 60% { transform: translate3d(4px, 0, 0); }
}
.slot-machine::before {
  content:'✨ GG WINS MEGA SLOTS ✨';
  position:absolute;top:-18px;left:50%;transform:translateX(-50%);
  background:linear-gradient(135deg,#ffd700,#ff8c00);
  color:#000;font-family:'Space Grotesk',sans-serif;font-size:12px;font-weight:900;
  padding:5px 20px;border-radius:12px;letter-spacing:0.12em;
  box-shadow:0 0 20px rgba(255,215,0,0.6);
  animation: headerGlow 2s ease-in-out infinite alternate;
}
@keyframes headerGlow {
  0% { box-shadow:0 0 15px rgba(255,215,0,0.4); }
  100% { box-shadow:0 0 30px rgba(255,215,0,0.9); }
}
.reels-container {
  display:flex;gap:8px;margin:12px 0;perspective:1000px;
}
.reel-frame {
  width:84px;height:240px;
  overflow:hidden;
  background:radial-gradient(ellipse at center, #0a192f 0%, #030712 100%);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:14px;
  position:relative;
  box-shadow:inset 0 0 20px rgba(0,0,0,0.8), 0 4px 12px rgba(0,0,0,0.5);
}
.reel-frame::before, .reel-frame::after {
  content:'';position:absolute;left:0;right:0;height:60px;z-index:2;pointer-events:none;
}
.reel-frame::before { top:0;background:linear-gradient(to bottom,#030712,transparent); }
.reel-frame::after { bottom:0;background:linear-gradient(to top,#030712,transparent); }
.reel {
  display:flex;flex-direction:column;align-items:center;
  transition:transform 0.5s cubic-bezier(.17,.67,.43,.98);
}
.reel.blurring {
  filter: blur(3px);
}
.reel-symbol {
  width:84px;height:80px;
  display:flex;align-items:center;justify-content:center;
  font-size:44px;
  flex-shrink:0;
  transition: transform 0.3s, filter 0.3s;
}
.reel-symbol.winning {
  animation: symbolPulse 0.8s ease-in-out infinite alternate;
  filter: drop-shadow(0 0 12px rgba(255,215,0,0.8));
}
@keyframes symbolPulse {
  0% { transform: scale(1); }
  100% { transform: scale(1.18); }
}
/* Win line */
.win-line {
  position:absolute;left:0;right:0;top:50%;
  transform:translateY(-50%);
  height:82px;
  border:2px solid rgba(255,215,0,0.4);
  background:rgba(255,215,0,0.04);
  pointer-events:none;
  border-radius:8px;
  z-index:3;
  transition: all 0.3s;
}
.win-line.active {
  border-color: #00e676;
  background: rgba(0,230,118,0.12);
  box-shadow: 0 0 25px rgba(0,230,118,0.5);
}
/* Spin result overlay */
.spin-result {
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  background:rgba(0,0,0,0.75);
  backdrop-filter: blur(4px);
  border-radius:24px;
  pointer-events:none;
  opacity:0;
  transition:opacity 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  z-index:10;
}
.spin-result.visible { opacity:1; }
.spin-result-inner {
  text-align:center;
  animation:popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}
@keyframes popIn {
  0% { transform: scale(0.3); opacity: 0; }
  80% { transform: scale(1.1); opacity: 1; }
  100% { transform: scale(1); opacity: 1; }
}
.sr-mult {
  font-family:'Space Grotesk',sans-serif;
  font-size:52px;font-weight:900;
  color:var(--gold);
  text-shadow:0 0 35px rgba(255,215,0,0.8);
}
.sr-amount {
  font-family:'Space Grotesk',sans-serif;
  font-size:24px;font-weight:800;
  color:var(--green);margin-top:4px;
  text-shadow:0 0 20px rgba(0,230,118,0.6);
}

/* Paylines table */
.paytable {
  display:grid;grid-template-columns:repeat(3,1fr);gap:8px;
  width:100%;max-width:380px;
}
.pay-item {
  display:flex;align-items:center;gap:6px;
  background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.08);
  border-radius:8px;padding:6px 10px;
  font-size:12px;backdrop-filter: blur(6px);
}
.pay-symbols { font-size:18px; }
.pay-mult { font-family:'Space Grotesk',sans-serif;font-weight:700;color:var(--gold);margin-left:auto; }

.spin-btn {
  width:84px;height:84px;
  border-radius:50%;
  background:linear-gradient(135deg,#ffd700,#ff8c00);
  color:#000;
  font-size:32px;
  display:flex;align-items:center;justify-content:center;
  transition:all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  box-shadow:0 4px 25px rgba(255,215,0,0.5);
  cursor:pointer;border:none;
}
.spin-btn:hover:not(:disabled) { transform:scale(1.1) rotate(5deg); box-shadow:0 8px 35px rgba(255,215,0,0.7); }
.spin-btn:disabled { opacity:0.5;cursor:not-allowed;transform:none; }
.spin-btn.spinning { animation:spinPulse 0.4s ease infinite; }
@keyframes spinPulse { 0%,100%{transform:scale(1) rotate(0deg)} 50%{transform:scale(0.92) rotate(180deg)} }

/* Confetti canvas */
#confetti-canvas {
  position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:20;
}
</style>

<script>
function updateBal(){ updateAllWalletDisplays(); }
updateBal();

const SYMBOLS = ['🍒','🍋','🍊','🍇','🔔','💎','7️⃣','⭐'];
const WEIGHTS = [20, 18, 16, 14, 10, 8, 5, 3];
const PAYOUTS = {
  '🍒': {3: 1.4, 4: 3.2, 5: 9},
  '🍋': {3: 1.6, 4: 3.8, 5: 11},
  '🍊': {3: 1.8, 4: 4.8, 5: 14},
  '🍇': {3: 2.2, 4: 6.0, 5: 18},
  '🔔': {3: 3.0, 4: 8.5, 5: 24},
  '💎': {3: 4.5, 4: 14.0, 5: 42},
  '7️⃣': {3: 8.0, 4: 28.0, 5: 110},
  '⭐': {3: 14.0, 4: 55.0, 5: 260},
};
const REEL_SIZE = 30;
let spinning = false;
let totalProfit=0, wins=0, losses=0;
let autoSpinTimer = null;

function weightedPick(){
  const total = WEIGHTS.reduce((a,b)=>a+b,0);
  let r = Math.random() * total;
  for(let i=0;i<SYMBOLS.length;i++){
    r -= WEIGHTS[i];
    if(r <= 0) return SYMBOLS[i];
  }
  return SYMBOLS[0];
}

function buildReel(reelId){
  const reel = document.getElementById('reel-'+reelId);
  reel.innerHTML = '';
  for(let i=0;i<REEL_SIZE;i++){
    const div = document.createElement('div');
    div.className = 'reel-symbol';
    div.textContent = SYMBOLS[Math.floor(Math.random()*SYMBOLS.length)];
    reel.appendChild(div);
  }
  reel.style.transform = 'translateY(-80px)';
}

function setReelResult(reelId, symbols){
  const reel = document.getElementById('reel-'+reelId);
  // Set middle 3 symbols (visible area is 3 symbols: index 0=top, 1=middle, 2=bottom)
  const children = reel.children;
  // We place result at position 1 (the center)
  children[0].textContent = SYMBOLS[Math.floor(Math.random()*SYMBOLS.length)];
  children[1].textContent = symbols;
  children[2].textContent = SYMBOLS[Math.floor(Math.random()*SYMBOLS.length)];
}

for(let i=0;i<5;i++) buildReel(i);

function spin(){ if(!requireAuth()) return;
  if(spinning) return;
  const amt = parseFloat(document.getElementById('bet-amount').value);
  if(isNaN(amt)||amt<=0){ showToast('Enter valid amount'); return; }
  if(amt > getBalance()){ showToast('Insufficient balance'); return; }

  setBalance(getBalance() - amt);
  if(typeof playGameSound === 'function') playGameSound('bet');
  spinning = true;
  document.getElementById('spin-btn').disabled = true;
  document.getElementById('spin-btn').classList.add('spinning');
  // Generate house-biased results (85% near-miss / loss, 15% small win)
  let results;
  if(Math.random() < 0.85){
    // Force near miss: Pick a symbol for reels 0 and 1, then ensure reel 2 and beyond break the streak
    const s1 = weightedPick();
    const otherSymbols = SYMBOLS.filter(s => s !== s1);
    results = [
      s1,
      s1,
      otherSymbols[Math.floor(Math.random() * otherSymbols.length)],
      otherSymbols[Math.floor(Math.random() * otherSymbols.length)],
      weightedPick()
    ];
  } else {
    results = Array.from({length:5}, ()=>weightedPick());
  }

  const turbo = document.getElementById('turbo-toggle').checked;
  const baseDelay = turbo ? 200 : 500;

  if(typeof playGameSound === 'function') playGameSound('tick');

  // Animate reels
  const machine = document.getElementById('slot-machine');
  const winLine = document.querySelector('.win-line');
  if (winLine) winLine.classList.remove('active');

  for(let i=0;i<5;i++){
    const reel = document.getElementById('reel-'+i);
    reel.classList.add('blurring');
    // Reset
    reel.innerHTML = '';
    const totalSymbols = 15 + i*5;
    for(let j=0;j<totalSymbols;j++){
      const div = document.createElement('div');
      div.className = 'reel-symbol';
      // Last 3 are the final visible ones, middle one is result
      if(j === totalSymbols-2){
        div.textContent = results[i];
      } else {
        div.textContent = SYMBOLS[Math.floor(Math.random()*SYMBOLS.length)];
      }
      reel.appendChild(div);
    }
    // Start at top
    reel.style.transition = 'none';
    reel.style.transform = 'translateY(0px)';
    void reel.offsetWidth;
    // Spin down with realistic bounce
    const finalY = -((totalSymbols - 3) * 80);
    reel.style.transition = `transform ${0.5+i*0.15}s cubic-bezier(.17,.67,.12,.98)`;
    reel.style.transform = `translateY(${finalY}px)`;
    
    // Remove blur once this specific reel settles
    setTimeout(() => {
      reel.classList.remove('blurring');
    }, (0.5 + i * 0.15) * 1000 - 100);
  }

  // Resolve after animation
  setTimeout(() => {
    resolveResults(results, amt);
  }, turbo ? 800 : 1500);
}

// Particle confetti engine for big wins
function launchConfetti(){
  let canvas = document.getElementById('confetti-canvas');
  if(!canvas){
    canvas = document.createElement('canvas');
    canvas.id = 'confetti-canvas';
    document.querySelector('.slots-area').appendChild(canvas);
  }
  const ctx = canvas.getContext('2d');
  canvas.width = canvas.parentElement.clientWidth;
  canvas.height = canvas.parentElement.clientHeight;

  const particles = [];
  const colors = ['#ffd700', '#ff8c00', '#00e676', '#00bcd4', '#ff3d00', '#e040fb'];
  for(let i=0; i<80; i++){
    particles.push({
      x: canvas.width / 2,
      y: canvas.height / 2,
      vx: (Math.random() - 0.5) * 14,
      vy: (Math.random() - 0.8) * 16,
      size: Math.random() * 8 + 4,
      color: colors[Math.floor(Math.random() * colors.length)],
      rotation: Math.random() * 360,
      rotSpeed: (Math.random() - 0.5) * 10,
      alpha: 1
    });
  }

  let animId;
  function render(){
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    let alive = false;
    particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.vy += 0.4; // gravity
      p.alpha -= 0.015;
      p.rotation += p.rotSpeed;
      if(p.alpha > 0){
        alive = true;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate((p.rotation * Math.PI) / 180);
        ctx.fillStyle = p.color;
        ctx.globalAlpha = Math.max(0, p.alpha);
        ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size);
        ctx.restore();
      }
    });
    if(alive){
      animId = requestAnimationFrame(render);
    } else {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
  }
  render();
}

function resolveResults(results, amt){
  // Check wins: count consecutive from left
  let maxMatch = 1;
  let matchSymbol = results[0];
  for(let i=1;i<5;i++){
    if(results[i] === results[0]) maxMatch++;
    else break;
  }

  // Also check 2-symbol combos (any 3+ matching)
  const counts = {};
  results.forEach(s => counts[s] = (counts[s]||0)+1);
  let bestSymbol = null, bestCount = 0;
  for(const [s,c] of Object.entries(counts)){
    if(c > bestCount){ bestCount=c; bestSymbol=s; }
  }

  // Use the better of consecutive-from-left or highest count
  let winMult = 0;
  let winSymbol = matchSymbol;
  let winCount = maxMatch;

  if(maxMatch >= 3 && PAYOUTS[matchSymbol]){
    winMult = PAYOUTS[matchSymbol][maxMatch] || 0;
  }

  if(bestCount >= 3 && PAYOUTS[bestSymbol]){
    const altMult = PAYOUTS[bestSymbol][bestCount] || 0;
    if(altMult > winMult){
      winMult = altMult;
      winSymbol = bestSymbol;
      winCount = bestCount;
    }
  }

  const winLine = document.querySelector('.win-line');
  const machine = document.getElementById('slot-machine');

  if(winMult > 0){
    const payout = amt * winMult;
    setBalance(getBalance() + payout);
    totalProfit += payout - amt;
    wins++;
    
    // Visual celebratory effects
    if (winLine) winLine.classList.add('active');
    if (machine) {
      machine.classList.add('shake');
      setTimeout(() => machine.classList.remove('shake'), 500);
    }
    launchConfetti();

    // Highlight winning symbols in middle row
    for(let i=0; i<5; i++){
      const reel = document.getElementById('reel-'+i);
      const centerSymbol = reel.children[reel.children.length - 2];
      if (centerSymbol && centerSymbol.textContent === winSymbol){
        centerSymbol.classList.add('winning');
        setTimeout(() => centerSymbol.classList.remove('winning'), 2500);
      }
    }

    showWinOverlay(winMult, payout);
    addHistory(winMult, true);
    showResult(true, payout - amt);
    flashBal('flash-win');
    if(typeof playGameSound === 'function') playGameSound('win');
    if(typeof trackGameWager === 'function') trackGameWager('GG Slots', amt, payout, true);
  } else {
    totalProfit -= amt;
    losses++;
    if (winLine) winLine.classList.remove('active');
    addHistory(0, false);
    showResult(false, amt);
    flashBal('flash-lose');
    if(typeof playGameSound === 'function') playGameSound('lose');
    if(typeof trackGameWager === 'function') trackGameWager('GG Slots', amt, 0, false);
  }

  updateStats();
  spinning = false;
  document.getElementById('spin-btn').disabled = false;
  document.getElementById('spin-btn').classList.remove('spinning');

  // Auto spin
  if(document.getElementById('auto-spin-toggle').checked){
    autoSpinTimer = setTimeout(spin, document.getElementById('turbo-toggle').checked ? 400 : 1000);
  }
}

function showWinOverlay(mult, amount){
  document.getElementById('sr-mult').textContent = mult + '×';
  document.getElementById('sr-amount').textContent = '+$'+amount.toFixed(2);
  document.getElementById('spin-result').classList.add('visible');
  setTimeout(()=>document.getElementById('spin-result').classList.remove('visible'), 2500);
}

// Paytable
function buildPaytable(){
  const pt = document.getElementById('paytable');
  pt.innerHTML = '';
  SYMBOLS.forEach(s => {
    const p = PAYOUTS[s];
    if(!p) return;
    const div = document.createElement('div');
    div.className = 'pay-item';
    div.innerHTML = `<span class="pay-symbols">${s}${s}${s}</span><span class="pay-mult">${p[3]}×</span>`;
    pt.appendChild(div);
  });
}
buildPaytable();

document.getElementById('auto-spin-toggle').addEventListener('change', function(){
  if(!this.checked) clearTimeout(autoSpinTimer);
});

function addHistory(mult, won){
  const c=document.getElementById('my-history');
  const chip=document.createElement('div');
  chip.className='hchip '+(won?'win':'lose');
  chip.textContent=won?mult+'×':'Miss';
  c.insertBefore(chip,c.firstChild);
  if(c.children.length>15) c.removeChild(c.lastChild);
}
function showResult(won, amount){
  const c=document.getElementById('result-container');
  c.innerHTML=`<div class="result-box ${won?'win':'lose'}">
    <div class="result-box-title">${won?'🎰 Winner!':'No match'}</div>
    <div class="result-box-val">${won?'+$'+amount.toFixed(2):'-$'+amount.toFixed(2)}</div>
  </div>`;
  setTimeout(()=>c.innerHTML='',3000);
}
function updateStats(){
  const p=document.getElementById('stat-profit');
  p.textContent=(totalProfit>=0?'+':'')+' $'+totalProfit.toFixed(2);
  p.className='stat-box-val '+(totalProfit>=0?'green':'red');
  document.getElementById('stat-wins').textContent=wins;
  document.getElementById('stat-losses').textContent=losses;
}
function flashBal(cls){
  const el=document.getElementById('bal-display');
  el.classList.remove('flash-win','flash-lose'); void el.offsetWidth; el.classList.add(cls);
}
function halveBet(){ const i=document.getElementById('bet-amount'); i.value=Math.max(0.01,parseFloat(i.value||1)/2).toFixed(2); }
function doubleBet(){ const i=document.getElementById('bet-amount'); i.value=Math.min(getBalance(),parseFloat(i.value||1)*2).toFixed(2); }
function maxBet(){ document.getElementById('bet-amount').value=getBalance().toFixed(2); }
function showToast(msg){
  const t=document.createElement('div');
  t.style.cssText='position:fixed;bottom:20px;right:20px;background:#1e2d3d;border:1px solid rgba(255,255,255,0.1);color:#e8edf5;padding:10px 16px;border-radius:8px;font-size:13px;z-index:999';
  t.textContent=msg; document.body.appendChild(t);
  setTimeout(()=>t.remove(),2500);
}

// 🛡️ Safe Multi-Lifecycle Auto-Initializer
try {
  if (typeof initSlots === 'function') {
    window.initSlots = initSlots;
    initSlots();
  }
} catch(e) {}
if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', () => { try { if (typeof initSlots === 'function') initSlots(); } catch(e) {} });
}
window.addEventListener('load', () => { try { if (typeof initSlots === 'function') initSlots(); } catch(e) {} });

</script>
