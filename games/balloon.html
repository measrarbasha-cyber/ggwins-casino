<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Balloon – GG Wins</title>
<link rel="stylesheet" href="../game-shell.css">
<style>
.balloon-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  background: radial-gradient(circle at 50% 60%, #171c32 0%, #0c1020 70%, #060812 100%);
  overflow: hidden;
  padding: 20px;
}
.pump-stage {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 280px;
  width: 100%;
}
.balloon-wrapper {
  position: absolute;
  bottom: 40px;
  display: flex;
  flex-direction: column;
  align-items: center;
  transition: transform 0.05s linear;
  transform-origin: bottom center;
}
.neon-balloon {
  width: 70px;
  height: 85px;
  background: radial-gradient(circle at 35% 30%, #ff80ab, #f50057 60%, #880e4f 100%);
  border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
  box-shadow: 0 0 35px rgba(245, 0, 87, 0.5), inset -5px -5px 15px rgba(0,0,0,0.4);
  position: relative;
  transition: width 0.05s linear, height 0.05s linear;
}
.neon-balloon::after {
  content: '';
  position: absolute;
  top: 15%; left: 20%;
  width: 14px; height: 22px;
  background: rgba(255, 255, 255, 0.6);
  border-radius: 50%;
  transform: rotate(-25deg);
}
.balloon-knot {
  width: 12px;
  height: 8px;
  background: #c51162;
  border-radius: 2px 2px 6px 6px;
  margin-top: -2px;
}
.pump-base {
  position: absolute;
  bottom: 0;
  width: 90px;
  height: 38px;
  background: linear-gradient(180deg, #475569, #1e293b);
  border-radius: 8px 8px 0 0;
  border: 2px solid #64748b;
}

.balloon-mult-tag {
  position: absolute;
  top: -45px;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 28px;
  font-weight: 900;
  color: #ffd700;
  text-shadow: 0 0 15px rgba(255,215,0,0.6);
  white-space: nowrap;
}

.pump-btn {
  width: 100%;
  height: 56px;
  background: linear-gradient(135deg, #00b0ff, #00e676);
  color: #000;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 16px;
  font-weight: 900;
  border-radius: 14px;
  border: none;
  cursor: pointer;
  box-shadow: 0 6px 20px rgba(0, 176, 255, 0.35);
  user-select: none;
  touch-action: manipulation;
  transition: transform 0.1s;
}
.pump-btn:active {
  transform: scale(0.97);
}
.pump-btn.disabled {
  background: #334155;
  color: #64748b;
  box-shadow: none;
  cursor: not-allowed;
}

.cashout-btn {
  width: 100%;
  height: 56px;
  background: linear-gradient(135deg, #ffd700, #ff9100);
  color: #000;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 16px;
  font-weight: 900;
  border-radius: 14px;
  border: none;
  cursor: pointer;
  box-shadow: 0 6px 20px rgba(255, 215, 0, 0.4);
  margin-top: 10px;
  transition: all 0.2s;
}
.cashout-btn:disabled {
  background: #1e293b;
  color: #64748b;
  box-shadow: none;
  cursor: not-allowed;
  opacity: 0.5;
}
</style>
<script src="../security-guard.js"></script>
</head>
<body>

<nav class="gnav">
  <div class="gnav-left">
    <button class="gnav-back" onclick="window.location.href='../index.html'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="18" height="18"><polyline points="15 18 9 12 15 6"/></svg>
      Lobby
    </button>
    <div class="gnav-title">🎈 Balloon Inflator</div>
  </div>
  <div class="gnav-right">
    <div class="wallet-switcher-container">
      <button class="wallet-chip-btn" onclick="toggleWalletMenu()">
        <span class="wallet-chip-icon">🪙</span>
        <span id="bal-display" style="color:#00e676;font-weight:800">₹50,000.00</span>
        <span class="wallet-active-badge" style="background:#7c4dff">DEMO</span>
        <svg class="chevron-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="12" height="12"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
    </div>
  </div>
  <button class="btn-wallet-game" onclick="openWalletModal('deposit')">
    💳 Deposit
  </button>
</nav>

<div class="game-layout">
  <div class="game-area balloon-area">
    <div class="pump-stage">
      <div class="balloon-wrapper" id="balloon-wrapper">
        <div class="balloon-mult-tag" id="balloon-mult">1.00×</div>
        <div class="neon-balloon" id="neon-balloon"></div>
        <div class="balloon-knot"></div>
      </div>
      <div class="pump-base"></div>
    </div>
    <div class="copyright-footer">© 2026 GG Wins. Proprietary Algorithm & Code Protected.</div>
  </div>

  <div class="bet-panel">
    <div class="bet-section">
      <div class="bet-label">Bet Amount</div>
      <div class="bet-input-row">
        <div class="bet-currency">₹</div>
        <input class="bet-input" id="bet-amount" type="number" value="100.00" min="1" step="1">
        <div class="bet-quick-btns">
          <button class="qbtn" onclick="halveBet()">½</button>
          <button class="qbtn" onclick="doubleBet()">2×</button>
          <button class="qbtn" onclick="maxBet()">Max</button>
        </div>
      </div>
    </div>

    <div class="bet-section">
      <button class="btn-bet" id="start-btn" onclick="startRound()">🎈 Start Wager</button>

      <div id="active-controls" style="display:none;margin-top:10px">
        <button class="pump-btn" id="pump-btn" onclick="pumpStep()">💨 PUMP BALLOON (+0.12×)</button>
        <button class="cashout-btn" id="cashout-btn" onclick="cashOut()" disabled>💰 CASH OUT (Pump to 1.15×)</button>
      </div>
    </div>

    <div class="bet-section">
      <div id="result-box"></div>
    </div>

    <div class="stats-row">
      <div class="stat-box">
        <div class="stat-box-label">Profit</div>
        <div class="stat-box-val" id="stat-profit">₹0.00</div>
      </div>
      <div class="stat-box">
        <div class="stat-box-label">Wins</div>
        <div class="stat-box-val green" id="stat-wins">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-box-label">Losses</div>
        <div class="stat-box-val red" id="stat-losses">0</div>
      </div>
    </div>
  </div>
</div>

<script src="../wallet.js"></script>
<script>
let roundActive = false;
let currentMult = 1.00;
let burstPoint = 1.50;
let betAmount = 100;
let pumpCount = 0;
let totalProfit = 0; let wins = 0; let losses = 0;

const balloonWrap = document.getElementById('balloon-wrapper');
const multEl = document.getElementById('balloon-mult');
const cashoutBtn = document.getElementById('cashout-btn');
const startBtn = document.getElementById('start-btn');
const activeControls = document.getElementById('active-controls');
const resultBox = document.getElementById('result-box');

function halveBet() {
  const el = document.getElementById('bet-amount');
  el.value = Math.max(1, (parseFloat(el.value) / 2).toFixed(2));
}
function doubleBet() {
  const el = document.getElementById('bet-amount');
  el.value = (parseFloat(el.value) * 2).toFixed(2);
}
function maxBet() {
  const bal = typeof getBalance === 'function' ? getBalance() : 50000;
  document.getElementById('bet-amount').value = Math.min(10000, bal).toFixed(2);
}

function startRound() {
  if (roundActive) return;
  const amt = parseFloat(document.getElementById('bet-amount').value);
  if (isNaN(amt) || amt <= 0) { showToast('Enter valid bet amount', 'error'); return; }
  const bal = typeof getBalance === 'function' ? getBalance() : 50000;
  if (amt > bal) { showToast('Insufficient balance', 'error'); return; }

  if (typeof adjustBalance === 'function') adjustBalance(-amt, 'Balloon Wager');
  betAmount = amt;
  roundActive = true;
  currentMult = 1.00;
  pumpCount = 0;
  resultBox.innerHTML = '';

  resetBalloonVisual();

  // Reduced winning probability:
  const isDemo = typeof window.isDemoMode === 'function' && window.isDemoMode();
  if (isDemo) {
    // Demo Mode: Reduced to 45% win probability
    const win = Math.random() < 0.45;
    if (win) {
      burstPoint = parseFloat((2.20 + Math.random() * 3.50).toFixed(2));
    } else {
      burstPoint = parseFloat((1.12 + Math.random() * 0.45).toFixed(2));
    }
  } else {
    // Real Mode: Reduced to 10% win probability (90% loss rate)
    const win = Math.random() < 0.10;
    if (win) {
      burstPoint = parseFloat((2.00 + Math.random() * 2.50).toFixed(2));
    } else {
      // Tight bust range
      burstPoint = parseFloat((1.05 + Math.random() * 0.35).toFixed(2));
    }
  }

  startBtn.style.display = 'none';
  activeControls.style.display = 'block';
  cashoutBtn.disabled = true;
  cashoutBtn.textContent = '💰 CASH OUT (Pump to 1.15×)';
}

function pumpStep() {
  if (!roundActive) return;
  pumpCount++;
  currentMult = parseFloat((currentMult + 0.12).toFixed(2));
  multEl.textContent = currentMult.toFixed(2) + '×';

  const scale = Math.min(3.0, 1.0 + (currentMult - 1.0) * 0.35);
  balloonWrap.style.transform = `scale(${scale})`;

  if (window.fxPlayGem) window.fxPlayGem(pumpCount % 8);

  if (currentMult >= 1.15) {
    const curPayout = betAmount * currentMult;
    cashoutBtn.disabled = false;
    cashoutBtn.textContent = `💰 CASH OUT (₹${curPayout.toFixed(2)} / ${currentMult.toFixed(2)}×)`;
  }

  // Check burst
  if (currentMult >= burstPoint) {
    popBalloon();
  }
}

function cashOut() {
  if (!roundActive || currentMult < 1.15) return;
  roundActive = false;

  const payout = betAmount * currentMult;
  if (typeof adjustBalance === 'function') adjustBalance(payout, `Balloon Cashed Out (${currentMult.toFixed(2)}×)`);
  totalProfit += payout - betAmount;
  wins++;

  resultBox.innerHTML = `<div style="padding:10px;background:rgba(0,230,118,0.15);border:1px solid #00e676;border-radius:8px;color:#00e676;font-weight:800;text-align:center">🎉 WON ₹${payout.toFixed(2)} (${currentMult.toFixed(2)}×)</div>`;

  if (window.fireGoldCoinShower) window.fireGoldCoinShower(window.innerWidth / 2, window.innerHeight * 0.4, 40);
  if (window.showBigWinModal && currentMult >= 2.0) window.showBigWinModal('₹' + payout.toFixed(2), currentMult.toFixed(2) + '×');
  if (window.fxPlayWin) window.fxPlayWin();

  updateStats();
  endRoundUI();
}

function popBalloon() {
  roundActive = false;
  totalProfit -= betAmount;
  losses++;

  multEl.textContent = 'POPPED!';
  multEl.style.color = '#ef4444';
  balloonWrap.style.transform = 'scale(0)';

  resultBox.innerHTML = `<div style="padding:10px;background:rgba(239,68,68,0.15);border:1px solid #ef4444;border-radius:8px;color:#ef4444;font-weight:800;text-align:center">💥 POPPED AT ${burstPoint.toFixed(2)}×</div>`;

  if (window.triggerScreenShake) window.triggerScreenShake(document.querySelector('.balloon-area'));
  if (window.fxPlayExplosion) window.fxPlayExplosion();

  updateStats();
  endRoundUI();
}

function endRoundUI() {
  startBtn.style.display = 'block';
  activeControls.style.display = 'none';
  setTimeout(resetBalloonVisual, 1500);
}

function resetBalloonVisual() {
  balloonWrap.style.transform = 'scale(1)';
  multEl.textContent = '1.00×';
  multEl.style.color = '#ffd700';
}

function updateStats() {
  document.getElementById('stat-profit').textContent = (totalProfit >= 0 ? '+' : '') + '₹' + totalProfit.toFixed(2);
  document.getElementById('stat-profit').className = 'stat-box-val ' + (totalProfit >= 0 ? 'green' : 'red');
  document.getElementById('stat-wins').textContent = wins;
  document.getElementById('stat-losses').textContent = losses;
}
</script>
</body>
</html>
