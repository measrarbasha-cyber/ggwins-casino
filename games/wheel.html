<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Fortune Wheel 3D – GG Wins</title>
<link rel="stylesheet" href="../game-shell.css">
<script src="../security-guard.js"></script>
<style>
.wheel-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 16px;
  background: radial-gradient(circle at 50% 40%, #1e1b4b 0%, #0f172a 70%, #030712 100%);
  position: relative;
  overflow: hidden;
  user-select: none;
}

#wheel-canvas {
  width: 280px;
  height: 280px;
  border-radius: 50%;
  box-shadow: 0 15px 45px rgba(0,0,0,0.9), 0 0 35px rgba(255,215,0,0.3);
  border: 4px solid #ffd700;
}
</style>
</head>
<body>

<nav class="gnav">
  <button class="gnav-back" onclick="window.location.href='../index.html'">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
    Lobby
  </button>
  <div class="gnav-brand-block">
    <div class="gnav-logo">GG <span>Wins</span></div>
    <div class="gnav-game-under-logo">🎡 Fortune Wheel 3D</div>
  </div>
  <div class="gnav-game-name">Fortune Wheel</div>
  <span class="gnav-game-badge" style="background:#ffd700;color:#000">3D WHEEL</span>
  <button class="btn-sound-toggle" onclick="toggleSound()" title="Toggle Sound" style="background:rgba(255,255,255,0.05);border:1px solid var(--border);border-radius:8px;padding:6px 10px;font-size:14px;cursor:pointer">🔊</button>
  <div class="gnav-spacer"></div>
  <div id="wallet-chip-target"></div>
  <a href="../deposit.html" target="_blank" class="btn-deposit-box" title="Deposit Funds">
    <span class="dep-box-chip">💳</span>
    <span class="dep-box-text">Deposit</span>
  </a>
</nav>

<div class="game-layout">
  <div class="game-area wheel-area">
    <canvas id="wheel-canvas" width="360" height="360"></canvas>
    <div class="copyright-footer">
      © 2026 GG Wins. Proprietary Algorithm &amp; Code Protected. Unauthorized Copying Prohibited.
    </div>
  </div>

  <div class="bet-panel">
    <div class="bet-section">
      <div class="bet-label">Bet Amount</div>
      <div class="bet-input-row">
        <div class="bet-currency">₹</div>
        <input class="bet-input" id="bet-amount" type="number" value="100.00" min="1" step="10">
        <div class="bet-quick-btns">
          <button class="qbtn" onclick="halveBet()">½</button>
          <button class="qbtn" onclick="doubleBet()">2×</button>
          <button class="qbtn" onclick="maxBet()">Max</button>
        </div>
      </div>
    </div>

    <div class="bet-section">
      <button class="btn-bet" id="btn-spin" onclick="spinWheel()">🎡 SPIN WHEEL</button>
    </div>

    <div class="bet-section">
      <div id="result-container"></div>
    </div>

    <div class="stats-row">
      <div class="stat-box">
        <div class="stat-box-label">Profit</div>
        <div class="stat-box-val" id="stat-profit">₹0.00</div>
      </div>
      <div class="stat-box">
        <div class="stat-box-label">Wins</div>
        <div class="stat-box-val green" id="stat-wins">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-box-label">Losses</div>
        <div class="stat-box-val red" id="stat-losses">0</div>
      </div>
    </div>
  </div>
</div>

<script src="../wallet.js"></script>
<script src="../auth-guard.js"></script>
<script>
const canvas = document.getElementById('wheel-canvas');
const ctx = canvas.getContext('2d');

const SEGMENTS = [
  { mult: 50.0, color: '#ffd700', label: '50×' },
  { mult: 0.0, color: '#ef4444', label: '0×' },
  { mult: 2.0, color: '#3b82f6', label: '2×' },
  { mult: 5.0, color: '#10b981', label: '5×' },
  { mult: 0.5, color: '#6b7280', label: '0.5×' },
  { mult: 10.0, color: '#8b5cf6', label: '10×' },
  { mult: 0.0, color: '#ef4444', label: '0×' },
  { mult: 3.0, color: '#06b6d4', label: '3×' },
  { mult: 1.5, color: '#f59e0b', label: '1.5×' },
  { mult: 20.0, color: '#ec4899', label: '20×' }
];

let angle = 0;
let isSpinning = false;
let totalProfit = 0, wins = 0, losses = 0;

function drawWheel(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;
  const r = cx - 10;
  const arc = (Math.PI * 2) / SEGMENTS.length;

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(angle);

  SEGMENTS.forEach((seg, i) => {
    ctx.beginPath();
    ctx.fillStyle = seg.color;
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, r, i * arc, (i + 1) * arc);
    ctx.fill();
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.save();
    ctx.rotate(i * arc + arc / 2);
    ctx.fillStyle = '#000';
    ctx.font = 'bold 15px Space Grotesk, sans-serif';
    ctx.textAlign = 'right';
    ctx.fillText(seg.label, r - 16, 5);
    ctx.restore();
  });

  // Center Hub
  ctx.beginPath();
  ctx.arc(0, 0, 24, 0, Math.PI * 2);
  ctx.fillStyle = '#ffd700';
  ctx.fill();
  ctx.restore();

  // Top Pointer Arrow
  ctx.beginPath();
  ctx.moveTo(cx - 10, 10);
  ctx.lineTo(cx + 10, 10);
  ctx.lineTo(cx, 28);
  ctx.closePath();
  ctx.fillStyle = '#fff';
  ctx.shadowColor = '#00e676';
  ctx.shadowBlur = 10;
  ctx.fill();
  ctx.shadowBlur = 0;
}
drawWheel();

function spinWheel(){
  if(typeof requireAuth === 'function' && !requireAuth()) return;
  if(isSpinning) return;

  const amt = parseFloat(document.getElementById('bet-amount').value);
  if(isNaN(amt) || amt <= 0){ showToast('Enter a valid bet amount!', 'error'); return; }

  const curBal = typeof getBalance === 'function' ? getBalance() : 10000;
  if(amt > curBal){ showToast('Insufficient balance!', 'error'); return; }

  if(typeof setBalance === 'function') setBalance(curBal - amt);
  isSpinning = true;
  document.getElementById('btn-spin').disabled = true;

  const spins = 6 + Math.random() * 5;
  const targetIdx = Math.floor(Math.random() * SEGMENTS.length);
  const targetAngle = (SEGMENTS.length - targetIdx) * ((Math.PI * 2) / SEGMENTS.length) - (Math.PI / 2) + (spins * Math.PI * 2);

  const startAngle = angle;
  const duration = 3200;
  const startTime = performance.now();

  function animate(now){
    const elapsed = now - startTime;
    const progress = Math.min(1, elapsed / duration);
    const ease = 1 - Math.pow(1 - progress, 3);
    angle = startAngle + (targetAngle - startAngle) * ease;
    drawWheel();

    if(progress < 1){
      requestAnimationFrame(animate);
    } else {
      isSpinning = false;
      document.getElementById('btn-spin').disabled = false;
      evaluateWheelWin(amt, SEGMENTS[targetIdx]);
    }
  }
  requestAnimationFrame(animate);
}

function evaluateWheelWin(betAmt, seg){
  const mult = seg.mult;
  const payout = betAmt * mult;

  const res = document.getElementById('result-container');
  if(payout >= betAmt){
    if(typeof setBalance === 'function') setBalance(getBalance() + payout);
    totalProfit += payout - betAmt;
    wins++;
    res.innerHTML = `<div class="result-box win" style="padding:8px;text-align:center;font-weight:900;color:#00e676">🎉 Landed ${seg.label}! +₹${payout.toFixed(2)}</div>`;
  } else {
    if(payout > 0 && typeof setBalance === 'function') setBalance(getBalance() + payout);
    totalProfit -= (betAmt - payout);
    losses++;
    res.innerHTML = `<div class="result-box lose" style="padding:8px;text-align:center;font-weight:900;color:#ef4444">💀 Landed ${seg.label}! -₹${(betAmt - payout).toFixed(2)}</div>`;
  }
  updateStats();
}

function updateStats(){
  const p = document.getElementById('stat-profit');
  if(p){
    p.textContent = (totalProfit >= 0 ? '+' : '') + ' ₹' + totalProfit.toFixed(2);
    p.className = 'stat-box-val ' + (totalProfit >= 0 ? 'green' : 'red');
  }
  const w = document.getElementById('stat-wins');
  if(w) w.textContent = wins;
  const l = document.getElementById('stat-losses');
  if(l) l.textContent = losses;
}

function halveBet(){ const i=document.getElementById('bet-amount'); if(i) i.value=Math.max(1,parseFloat(i.value||1)/2).toFixed(2); }
function doubleBet(){ const i=document.getElementById('bet-amount'); if(i) i.value=Math.min(getBalance(),parseFloat(i.value||1)*2).toFixed(2); }
function maxBet(){ const i=document.getElementById('bet-amount'); if(i) i.value=getBalance().toFixed(2); }
</script>
</body>
</html>
