<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Cricket Crash – GG Wins</title>
<link rel="stylesheet" href="../game-shell.css">
<style>
.cricket-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
  background: radial-gradient(circle at 50% 100%, #0d2818 0%, #05140d 60%, #020704 100%);
}
#cricket-canvas {
  width: 100%;
  height: 100%;
  display: block;
}
.stadium-overlay {
  position: absolute;
  top: 24px;
  left: 50%;
  transform: translateX(-50%);
  text-align: center;
  pointer-events: none;
  z-index: 10;
}
.cricket-mult {
  font-family: 'Space Grotesk', sans-serif;
  font-size: clamp(48px, 9vw, 84px);
  font-weight: 900;
  color: #ffd700;
  text-shadow: 0 0 35px rgba(255, 215, 0, 0.65), 0 4px 15px rgba(0,0,0,0.8);
  line-height: 1;
  transition: color 0.2s, transform 0.2s;
}
.cricket-mult.crashed {
  color: #ef4444 !important;
  text-shadow: 0 0 35px rgba(239, 68, 68, 0.8) !important;
  animation: fxMineExplode 0.45s ease;
}
.cricket-status {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 13px;
  font-weight: 800;
  color: #94a3b8;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  margin-top: 6px;
}
.cricket-badge {
  display: inline-block;
  background: rgba(0, 230, 118, 0.2);
  border: 1px solid #00e676;
  color: #00e676;
  font-size: 11px;
  font-weight: 900;
  padding: 4px 12px;
  border-radius: 12px;
  margin-bottom: 8px;
}
</style>
<script src="../security-guard.js"></script>
</head>
<body>

<nav class="gnav">
  <div class="gnav-left">
    <button class="gnav-back" onclick="window.location.href='../index.html'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="18" height="18"><polyline points="15 18 9 12 15 6"/></svg>
      Lobby
    </button>
    <div class="gnav-title">🏏 Cricket Crash</div>
  </div>
  <div class="gnav-right">
    <div class="wallet-switcher-container">
      <button class="wallet-chip-btn" onclick="toggleWalletMenu()">
        <span class="wallet-chip-icon">🪙</span>
        <span id="bal-display" style="color:#00e676;font-weight:800">₹50,000.00</span>
        <span class="wallet-active-badge" style="background:#7c4dff">DEMO</span>
        <svg class="chevron-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="12" height="12"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
    </div>
  </div>
  <button class="btn-wallet-game" onclick="openWalletModal('deposit')">
    💳 Deposit
  </button>
</nav>

<div class="game-layout">
  <div class="game-area cricket-area">
    <canvas id="cricket-canvas"></canvas>
    <div class="stadium-overlay">
      <div class="cricket-badge">STADIUM FLOODLIGHTS ON</div>
      <div class="cricket-mult" id="cricket-mult">1.00×</div>
      <div class="cricket-status" id="cricket-status">PLACE BET TO SMASH SIX</div>
    </div>
    <div class="copyright-footer">© 2026 GG Wins. Proprietary Algorithm & Code Protected.</div>
  </div>

  <div class="bet-panel">
    <div class="bet-section">
      <div class="bet-label">Bet Amount</div>
      <div class="bet-input-row">
        <div class="bet-currency">₹</div>
        <input class="bet-input" id="bet-amount" type="number" value="100.00" min="1" step="1">
        <div class="bet-quick-btns">
          <button class="qbtn" onclick="halveBet()">½</button>
          <button class="qbtn" onclick="doubleBet()">2×</button>
          <button class="qbtn" onclick="maxBet()">Max</button>
        </div>
      </div>
    </div>

    <div class="bet-section">
      <button class="btn-bet" id="bet-btn" onclick="hitShot()">🏏 Hit Six (Start)</button>
      
      <div id="cashout-box" style="display:none;margin-top:10px;padding:12px;background:linear-gradient(135deg,rgba(0,230,118,0.15),rgba(255,215,0,0.1));border:2px solid #00e676;border-radius:12px;box-shadow:0 0 20px rgba(0,230,118,0.3);text-align:center;">
        <div style="font-size:11px;font-weight:800;color:#94a3b8;text-transform:uppercase;margin-bottom:4px">Potential Payout</div>
        <div id="cashout-val" style="font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:900;color:#00e676;margin-bottom:8px">₹0.00</div>
        <button class="btn-cashout" id="cashout-btn" onclick="cashOut()" style="width:100%;padding:12px;background:linear-gradient(135deg,#00e676,#00b0ff);color:#000;font-weight:900;font-size:15px;border:none;border-radius:10px;cursor:pointer;box-shadow:0 4px 15px rgba(0,230,118,0.4)">💰 CASH OUT NOW</button>
      </div>
    </div>

    <div class="bet-section">
      <div id="result-box"></div>
    </div>

    <div class="stats-row">
      <div class="stat-box">
        <div class="stat-box-label">Profit</div>
        <div class="stat-box-val" id="stat-profit">₹0.00</div>
      </div>
      <div class="stat-box">
        <div class="stat-box-label">Wins</div>
        <div class="stat-box-val green" id="stat-wins">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-box-label">Losses</div>
        <div class="stat-box-val red" id="stat-losses">0</div>
      </div>
    </div>
  </div>
</div>

<script src="../wallet.js"></script>
<script>
let canvas = document.getElementById('cricket-canvas');
let ctx = canvas.getContext('2d');
let animId = null;
let gameActive = false;
let currentMult = 1.00;
let crashPoint = 2.00;
let startTime = null;
let betAmount = 100;
let ballParticles = [];
let totalProfit = 0; let wins = 0; let losses = 0;

function resize() {
  canvas.width = canvas.parentElement.clientWidth;
  canvas.height = canvas.parentElement.clientHeight;
}
window.addEventListener('resize', resize);
resize();

function halveBet() {
  const el = document.getElementById('bet-amount');
  el.value = Math.max(1, (parseFloat(el.value) / 2).toFixed(2));
}
function doubleBet() {
  const el = document.getElementById('bet-amount');
  el.value = (parseFloat(el.value) * 2).toFixed(2);
}
function maxBet() {
  const bal = typeof getBalance === 'function' ? getBalance() : 50000;
  document.getElementById('bet-amount').value = Math.min(10000, bal).toFixed(2);
}

function drawStadium(progress, ballX, ballY, isCrashed) {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  const w = canvas.width, h = canvas.height;

  // Stadium lights
  const grad = ctx.createLinearGradient(0, 0, 0, h);
  grad.addColorStop(0, '#030b08');
  grad.addColorStop(0.6, '#06170f');
  grad.addColorStop(1, '#0e3a22');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, w, h);

  // Light beams
  ctx.save();
  ctx.fillStyle = 'rgba(255, 255, 255, 0.03)';
  ctx.beginPath();
  ctx.moveTo(w * 0.1, 0); ctx.lineTo(w * 0.4, h); ctx.lineTo(w * 0.2, h); ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(w * 0.9, 0); ctx.lineTo(w * 0.6, h); ctx.lineTo(w * 0.8, h); ctx.closePath();
  ctx.fill();
  ctx.restore();

  // Pitch ground curve
  ctx.fillStyle = '#103822';
  ctx.beginPath();
  ctx.ellipse(w / 2, h + 80, w * 0.7, 160, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#1b5e20';
  ctx.lineWidth = 4;
  ctx.stroke();

  // Draw ball comet tail
  for (let i = ballParticles.length - 1; i >= 0; i--) {
    const p = ballParticles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.alpha -= 0.025;
    if (p.alpha <= 0) {
      ballParticles.splice(i, 1);
    } else {
      ctx.save();
      ctx.globalAlpha = p.alpha;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  if (gameActive && !isCrashed) {
    // Spawn fire tail
    for (let i = 0; i < 3; i++) {
      ballParticles.push({
        x: ballX + (Math.random() * 6 - 3),
        y: ballY + (Math.random() * 6 - 3),
        vx: (Math.random() - 0.7) * 4 - 2,
        vy: Math.random() * 3 + 1,
        size: Math.random() * 5 + 2,
        color: Math.random() > 0.4 ? '#ff5252' : '#ffd700',
        alpha: 1.0
      });
    }

    // Glowing Cricket Ball
    ctx.save();
    ctx.shadowColor = '#ff1744';
    ctx.shadowBlur = 20;
    ctx.fillStyle = '#d50000';
    ctx.beginPath();
    ctx.arc(ballX, ballY, 12, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.stroke();

    // Seam
    ctx.strokeStyle = '#ffeb3b';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(ballX, ballY, 7, -0.4, 0.4);
    ctx.stroke();
    ctx.restore();
  }
}

function hitShot() {
  if (gameActive) return;
  const amt = parseFloat(document.getElementById('bet-amount').value);
  if (isNaN(amt) || amt <= 0) { showToast('Enter a valid amount!', 'error'); return; }
  const bal = typeof getBalance === 'function' ? getBalance() : 50000;
  if (amt > bal) { showToast('Insufficient balance!', 'error'); return; }

  if (typeof adjustBalance === 'function') adjustBalance(-amt, 'Cricket Crash Wager');
  betAmount = amt;
  gameActive = true;
  startTime = Date.now();
  ballParticles = [];

  const isDemo = typeof window.isDemoMode === 'function' && window.isDemoMode();
  if (isDemo) {
    // Demo Mode: 50% high flight (2.00x - 3.50x), 50% mid catch (1.35x - 1.85x)
    const fliesHigh = Math.random() < 0.50;
    if (fliesHigh) {
      crashPoint = parseFloat((2.00 + Math.random() * 1.50).toFixed(2));
    } else {
      crashPoint = parseFloat((1.35 + Math.random() * 0.50).toFixed(2));
    }
  } else {
    // Real Mode: Ball soars high with controlled cash multiplier
    // 30% High flight (1.80x - 2.80x)
    // 45% Mid-air boundary catch (1.35x - 1.75x)
    // 25% Early catch (1.18x - 1.30x) — No instant wickets!
    const roll = Math.random();
    if (roll < 0.30) {
      crashPoint = parseFloat((1.80 + Math.random() * 1.00).toFixed(2)); // 1.80x - 2.80x
    } else if (roll < 0.75) {
      crashPoint = parseFloat((1.35 + Math.random() * 0.40).toFixed(2)); // 1.35x - 1.75x
    } else {
      crashPoint = parseFloat((1.18 + Math.random() * 0.12).toFixed(2)); // 1.18x - 1.30x
    }
  }

  document.getElementById('bet-btn').style.display = 'none';
  document.getElementById('cashout-box').style.display = 'block';
  document.getElementById('cashout-btn').disabled = true;
  document.getElementById('cashout-val').textContent = 'Locked (<1.12×)';
  document.getElementById('result-box').innerHTML = '';
  document.getElementById('cricket-status').textContent = 'BALL SOARING HIGH INTO THE NIGHT SKY...';
  const multEl = document.getElementById('cricket-mult');
  multEl.className = 'cricket-mult';
  multEl.textContent = '1.00×';

  if (window.fxPlayClick) window.fxPlayClick();

  function loop() {
    if (!gameActive) return;
    const elapsed = Date.now() - startTime;

    // Smooth, moderate cash multiplier climb
    currentMult = Math.pow(Math.E, 0.00018 * elapsed);
    multEl.textContent = currentMult.toFixed(2) + '×';

    // Unlock cashout once ball reaches 1.12x
    if (currentMult >= 1.12) {
      document.getElementById('cashout-btn').disabled = false;
      document.getElementById('cashout-btn').style.opacity = '1';
      document.getElementById('cashout-btn').style.cursor = 'pointer';
      document.getElementById('cashout-val').textContent = '₹' + (betAmount * currentMult).toFixed(2);
    } else {
      document.getElementById('cashout-btn').disabled = true;
      document.getElementById('cashout-btn').style.opacity = '0.5';
      document.getElementById('cashout-btn').style.cursor = 'not-allowed';
      document.getElementById('cashout-val').textContent = 'Locked (<1.12×)';
    }

    // High soaring ball trajectory (lasts up to 4.2s across the full arc)
    const progress = Math.min(1, elapsed / 4200);
    const ballX = canvas.width * 0.18 + progress * (canvas.width * 0.68);
    const ballY = canvas.height * 0.80 - Math.sin(progress * Math.PI * 0.9) * (canvas.height * 0.68);

    drawStadium(progress, ballX, ballY, false);

    if (currentMult >= crashPoint) {
      crash(ballX, ballY);
      return;
    }

    animId = requestAnimationFrame(loop);
  }
  animId = requestAnimationFrame(loop);
}

function cashOut() {
  if (!gameActive || currentMult < 1.12) return;
  gameActive = false;
  cancelAnimationFrame(animId);

  const payout = betAmount * currentMult;
  if (typeof adjustBalance === 'function') adjustBalance(payout, `Cricket Six Cashed Out (${currentMult.toFixed(2)}×)`);
  totalProfit += payout - betAmount;
  wins++;
  updateStats();

  document.getElementById('cricket-status').textContent = 'SIXER! CASHED OUT SAFELY!';
  document.getElementById('result-box').innerHTML = `<div style="padding:10px;background:rgba(0,230,118,0.15);border:1px solid #00e676;border-radius:8px;color:#00e676;font-weight:800;text-align:center">🎉 WON ₹${payout.toFixed(2)} (${currentMult.toFixed(2)}×)</div>`;

  if (window.fireGoldCoinShower) window.fireGoldCoinShower(window.innerWidth / 2, window.innerHeight * 0.4, 45);
  if (window.showBigWinModal && currentMult >= 1.5) window.showBigWinModal('₹' + payout.toFixed(2), currentMult.toFixed(2) + '×');
  if (window.fxPlayWin) window.fxPlayWin();

  resetUI();
}

function crash(lastX, lastY) {
  gameActive = false;
  cancelAnimationFrame(animId);
  totalProfit -= betAmount;
  losses++;
  updateStats();

  const multEl = document.getElementById('cricket-mult');
  multEl.className = 'cricket-mult crashed';
  multEl.textContent = crashPoint.toFixed(2) + '×';
  document.getElementById('cricket-status').textContent = 'CAUGHT AT THE BOUNDARY!';
  document.getElementById('result-box').innerHTML = `<div style="padding:10px;background:rgba(239,68,68,0.15);border:1px solid #ef4444;border-radius:8px;color:#ef4444;font-weight:800;text-align:center">💥 CAUGHT OUT AT ${crashPoint.toFixed(2)}×</div>`;

  if (window.triggerScreenShake) window.triggerScreenShake(document.querySelector('.cricket-area'));
  if (window.fxPlayExplosion) window.fxPlayExplosion();

  resetUI();
}

function resetUI() {
  document.getElementById('bet-btn').style.display = 'block';
  document.getElementById('cashout-box').style.display = 'none';
}

function updateStats() {
  document.getElementById('stat-profit').textContent = (totalProfit >= 0 ? '+' : '') + '₹' + totalProfit.toFixed(2);
  document.getElementById('stat-profit').className = 'stat-box-val ' + (totalProfit >= 0 ? 'green' : 'red');
  document.getElementById('stat-wins').textContent = wins;
  document.getElementById('stat-losses').textContent = losses;
}
</script>
</body>
</html>
