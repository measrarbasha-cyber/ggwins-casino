<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Neon Stairs – GG Wins</title>
<link rel="stylesheet" href="../game-shell.css">
<style>
.stairs-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  background: radial-gradient(circle at 50% 60%, #16102b 0%, #0c0819 70%, #05030b 100%);
  padding: 16px;
  overflow: auto;
}
.stairs-container {
  display: flex;
  flex-direction: column-reverse;
  gap: 8px;
  width: min(420px, 94vw);
}
.stairs-row {
  display: flex;
  gap: 8px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid rgba(255, 255, 255, 0.08);
  border-radius: 10px;
  padding: 6px;
  transition: all 0.3s;
  position: relative;
}
.stairs-row.active {
  border-color: #00f2fe;
  background: rgba(0, 242, 254, 0.12);
  box-shadow: 0 0 20px rgba(0, 242, 254, 0.3);
}
.row-mult {
  position: absolute;
  left: -52px;
  top: 50%;
  transform: translateY(-50%);
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 800;
  font-size: 11px;
  color: #ffd700;
  width: 44px;
  text-align: right;
}
.step-stone {
  flex: 1;
  height: 48px;
  background: linear-gradient(145deg, #1e1b4b, #0f172a);
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  user-select: none;
  font-size: 22px;
  transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.step-stone:hover:not(.disabled) {
  border-color: #ffd700;
  transform: scale(1.04);
}
.step-stone.safe {
  background: radial-gradient(circle, #00e676, #00897b);
  border-color: #00e676;
  box-shadow: 0 0 20px rgba(0, 230, 118, 0.6);
  animation: fxSpringFlip 0.35s ease;
}
.step-stone.trap {
  background: radial-gradient(circle, #ef4444, #881337);
  border-color: #ef4444;
  box-shadow: 0 0 20px rgba(239, 68, 68, 0.8);
  animation: fxMineExplode 0.4s ease;
}
.step-stone.disabled {
  cursor: default;
  opacity: 0.4;
  pointer-events: none;
}
.status-banner {
  background: rgba(15, 23, 42, 0.85);
  border: 1px solid #ffd700;
  color: #ffd700;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 13px;
  font-weight: 800;
  padding: 6px 18px;
  border-radius: 20px;
  margin-bottom: 12px;
}
</style>
<script src="../security-guard.js"></script>
</head>
<body>

<nav class="gnav">
  <div class="gnav-left">
    <button class="gnav-back" onclick="window.location.href='../index.html'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="18" height="18"><polyline points="15 18 9 12 15 6"/></svg>
      Lobby
    </button>
    <div class="gnav-title">🪜 Neon Stairs</div>
  </div>
  <div class="gnav-right">
    <div class="wallet-switcher-container">
      <button class="wallet-chip-btn" onclick="toggleWalletMenu()">
        <span class="wallet-chip-icon">🪙</span>
        <span id="bal-display" style="color:#00e676;font-weight:800">₹50,000.00</span>
        <span class="wallet-active-badge" style="background:#7c4dff">DEMO</span>
        <svg class="chevron-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="12" height="12"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
    </div>
  </div>
  <button class="btn-wallet-game" onclick="openWalletModal('deposit')">
    💳 Deposit
  </button>
</nav>

<div class="game-layout">
  <div class="game-area stairs-area">
    <div class="status-banner" id="stairs-status">CLICK "CLIMB STAIRS" & PICK A STEP</div>
    <div class="stairs-container" id="stairs-container"></div>
    <div class="copyright-footer">© 2026 GG Wins. Proprietary Algorithm & Code Protected.</div>
  </div>

  <div class="bet-panel">
    <div class="bet-section">
      <div class="bet-label">Bet Amount</div>
      <div class="bet-input-row">
        <div class="bet-currency">₹</div>
        <input class="bet-input" id="bet-amount" type="number" value="100.00" min="1" step="1">
        <div class="bet-quick-btns">
          <button class="qbtn" onclick="halveBet()">½</button>
          <button class="qbtn" onclick="doubleBet()">2×</button>
          <button class="qbtn" onclick="maxBet()">Max</button>
        </div>
      </div>
    </div>

    <div class="bet-section">
      <button class="btn-bet" id="start-btn" onclick="startStairs()">🪜 Climb Stairs</button>
    </div>

    <!-- Separate Cashout Section (Kept separated to prevent double-tap misclicks) -->
    <div class="bet-section" id="cashout-section" style="display:none;margin-top:10px">
      <button class="btn-cashout" id="cashout-btn" onclick="cashOut()" style="width:100%;padding:14px;background:linear-gradient(135deg,#ffd700,#ff9100);color:#000;font-weight:900;font-size:16px;border:none;border-radius:12px;cursor:pointer;box-shadow:0 6px 20px rgba(255,215,0,0.4)">💰 CASH OUT (₹0.00)</button>
    </div>

    <div class="bet-section">
      <div id="result-box"></div>
    </div>

    <div class="stats-row">
      <div class="stat-box">
        <div class="stat-box-label">Profit</div>
        <div class="stat-box-val" id="stat-profit">₹0.00</div>
      </div>
      <div class="stat-box">
        <div class="stat-box-label">Wins</div>
        <div class="stat-box-val green" id="stat-wins">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-box-label">Losses</div>
        <div class="stat-box-val red" id="stat-losses">0</div>
      </div>
    </div>
  </div>
</div>

<script src="../wallet.js"></script>
<script>
const MULTS = [1.25, 1.65, 2.25, 3.20, 4.80, 7.50, 12.0, 25.0];
let currentRow = -1;
let clearedSteps = 0;
let gameActive = false;
let betAmount = 100;
let rowTraps = []; // Pre-randomized hidden traps
let totalProfit = 0; let wins = 0; let losses = 0;

function halveBet() {
  const el = document.getElementById('bet-amount');
  el.value = Math.max(1, (parseFloat(el.value) / 2).toFixed(2));
}
function doubleBet() {
  const el = document.getElementById('bet-amount');
  el.value = (parseFloat(el.value) * 2).toFixed(2);
}
function maxBet() {
  const bal = typeof getBalance === 'function' ? getBalance() : 50000;
  document.getElementById('bet-amount').value = Math.min(10000, bal).toFixed(2);
}

function buildEmptyStairs() {
  const container = document.getElementById('stairs-container');
  container.innerHTML = '';
  for (let r = 0; r < 8; r++) {
    const row = document.createElement('div');
    row.className = 'stairs-row';
    row.id = 'row-' + r;
    row.innerHTML = `<div class="row-mult">${MULTS[r].toFixed(2)}×</div>`;

    for (let s = 0; s < 3; s++) {
      const stone = document.createElement('div');
      stone.className = 'step-stone disabled';
      stone.dataset.row = r;
      stone.dataset.col = s;
      stone.textContent = '💎';
      row.appendChild(stone);
    }
    container.appendChild(row);
  }
}
buildEmptyStairs();

function startStairs() {
  if (gameActive) return;
  const amt = parseFloat(document.getElementById('bet-amount').value);
  if (isNaN(amt) || amt <= 0) { showToast('Enter valid bet amount', 'error'); return; }
  const bal = typeof getBalance === 'function' ? getBalance() : 50000;
  if (amt > bal) { showToast('Insufficient balance', 'error'); return; }

  if (typeof adjustBalance === 'function') adjustBalance(-amt, 'Neon Stairs Bet');
  betAmount = amt;
  gameActive = true;
  currentRow = 0;
  clearedSteps = 0;

  // Decide row traps strictly:
  // Real account: 75% trap rate on every step!
  // Demo account: 55% trap rate on every step!
  const isDemo = typeof window.isDemoMode === 'function' && window.isDemoMode();
  rowTraps = [];

  for (let r = 0; r < 8; r++) {
    // 2 traps out of 3 stones! (Only 1 safe stone per row)
    const safeCol = Math.floor(Math.random() * 3);
    const trapProb = isDemo ? 0.55 : 0.75;
    
    // Determine whether this row has a safe stone or all traps
    const hasSafe = Math.random() >= trapProb;
    rowTraps.push(hasSafe ? safeCol : -1); // -1 means all are traps
  }

  buildStairsForPlay();

  document.getElementById('result-box').innerHTML = '';
  document.getElementById('start-btn').style.display = 'none';
  document.getElementById('cashout-section').style.display = 'none'; // NEVER SHOW ON STEP 0
  document.getElementById('stairs-status').textContent = 'STEP 1: PICK A STONE ON ROW 1';
}

function buildStairsForPlay() {
  const container = document.getElementById('stairs-container');
  container.innerHTML = '';
  for (let r = 0; r < 8; r++) {
    const row = document.createElement('div');
    row.className = 'stairs-row' + (r === 0 ? ' active' : '');
    row.id = 'row-' + r;
    row.innerHTML = `<div class="row-mult">${MULTS[r].toFixed(2)}×</div>`;

    for (let s = 0; s < 3; s++) {
      const stone = document.createElement('div');
      stone.className = 'step-stone' + (r !== 0 ? ' disabled' : '');
      stone.dataset.row = r;
      stone.dataset.col = s;
      stone.textContent = '💎';
      stone.onclick = () => pickStone(r, s, stone);
      row.appendChild(stone);
    }
    container.appendChild(row);
  }
}

function pickStone(r, c, el) {
  if (!gameActive || r !== currentRow) return;

  // Check if chosen column matches safe column
  const isSafe = (rowTraps[r] === c);

  if (isSafe) {
    el.className = 'step-stone safe';
    el.textContent = '⭐';
    if (window.fxPlayGem) window.fxPlayGem(currentRow + 1);

    clearedSteps++;
    const mult = MULTS[currentRow];
    const payout = betAmount * mult;

    // Reveal other stones in current row
    const curRowEl = document.getElementById('row-' + currentRow);
    Array.from(curRowEl.querySelectorAll('.step-stone')).forEach((st, idx) => {
      if (idx !== c) {
        st.className = 'step-stone trap disabled';
        st.textContent = '💥';
      }
    });

    curRowEl.classList.remove('active');
    currentRow++;

    // Enable cashout now that player has legitimately cleared at least 1 step!
    document.getElementById('cashout-section').style.display = 'block';
    document.getElementById('cashout-btn').textContent = `💰 CASH OUT (₹${payout.toFixed(2)} / ${mult.toFixed(2)}×)`;
    document.getElementById('stairs-status').textContent = `CLEARED ROW ${clearedSteps}! CASH OUT OR CLIMB ROW ${currentRow + 1}`;

    if (currentRow >= 8) {
      // Reached apex!
      cashOut();
    } else {
      const nextRow = document.getElementById('row-' + currentRow);
      nextRow.classList.add('active');
      Array.from(nextRow.querySelectorAll('.step-stone')).forEach(st => st.classList.remove('disabled'));
    }
  } else {
    // Trap Triggered!
    el.className = 'step-stone trap';
    el.textContent = '💥';

    // Reveal other stones
    const curRowEl = document.getElementById('row-' + currentRow);
    Array.from(curRowEl.querySelectorAll('.step-stone')).forEach((st, idx) => {
      if (idx === rowTraps[r]) {
        st.className = 'step-stone safe disabled';
        st.textContent = '⭐';
      } else {
        st.classList.add('disabled');
      }
    });

    totalProfit -= betAmount;
    losses++;
    gameActive = false;

    document.getElementById('result-box').innerHTML = `<div style="padding:10px;background:rgba(239,68,68,0.15);border:1px solid #ef4444;border-radius:8px;color:#ef4444;font-weight:800;text-align:center">💥 TRAP TRIGGERED! LOST AT STEP ${r + 1}</div>`;
    document.getElementById('stairs-status').textContent = `TRAP ON ROW ${r + 1}! WAGER LOST`;

    if (window.triggerScreenShake) window.triggerScreenShake(document.querySelector('.stairs-area'));
    if (window.fxPlayExplosion) window.fxPlayExplosion();

    updateStats();
    resetUI();
  }
}

function cashOut() {
  if (!gameActive || clearedSteps === 0) return;
  gameActive = false;
  const mult = MULTS[clearedSteps - 1];
  const payout = betAmount * mult;

  if (typeof adjustBalance === 'function') adjustBalance(payout, `Neon Stairs Win (${mult.toFixed(2)}×)`);
  totalProfit += payout - betAmount;
  wins++;

  document.getElementById('result-box').innerHTML = `<div style="padding:10px;background:rgba(0,230,118,0.15);border:1px solid #00e676;border-radius:8px;color:#00e676;font-weight:800;text-align:center">🎉 WON ₹${payout.toFixed(2)} (${mult.toFixed(2)}×)</div>`;
  document.getElementById('stairs-status').textContent = `CASHED OUT ₹${payout.toFixed(2)} (${mult.toFixed(2)}×)!`;

  if (window.fireGoldCoinShower) window.fireGoldCoinShower(window.innerWidth / 2, window.innerHeight * 0.4, 45);
  if (window.showBigWinModal && mult >= 2.0) window.showBigWinModal('₹' + payout.toFixed(2), mult.toFixed(2) + '×');
  if (window.fxPlayWin) window.fxPlayWin();

  updateStats();
  resetUI();
}

function resetUI() {
  document.getElementById('start-btn').style.display = 'block';
  document.getElementById('cashout-section').style.display = 'none';
  document.querySelectorAll('.step-stone').forEach(st => st.classList.add('disabled'));
}

function updateStats() {
  document.getElementById('stat-profit').textContent = (totalProfit >= 0 ? '+' : '') + '₹' + totalProfit.toFixed(2);
  document.getElementById('stat-profit').className = 'stat-box-val ' + (totalProfit >= 0 ? 'green' : 'red');
  document.getElementById('stat-wins').textContent = wins;
  document.getElementById('stat-losses').textContent = losses;
}
</script>
</body>
</html>
