<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Rock Paper Scissors – GG Wins</title>
<link rel="stylesheet" href="../game-shell.css">
<style>
.rps-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  background: radial-gradient(circle at 50% 40%, #151d38 0%, #0c1122 70%, #060812 100%);
  padding: 20px;
}
.arena-clash {
  display: flex;
  align-items: center;
  justify-content: space-around;
  width: min(520px, 94vw);
  margin-bottom: 24px;
}
.fighter-spot {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
}
.fighter-hand {
  width: 110px;
  height: 110px;
  background: rgba(30, 41, 59, 0.8);
  border: 3px solid rgba(255, 255, 255, 0.15);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 52px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.6);
  transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.fighter-hand.clashing {
  animation: fxScreenShake 0.4s infinite alternate;
}
.fighter-hand.winner {
  border-color: #00e676;
  box-shadow: 0 0 35px rgba(0,230,118,0.7);
  transform: scale(1.15);
}
.fighter-label {
  font-family: 'Space Grotesk', sans-serif;
  font-size: 16px;
  font-weight: 900;
  color: #94a3b8;
}

.streak-tag {
  background: rgba(255, 215, 0, 0.15);
  border: 1px solid #ffd700;
  color: #ffd700;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 14px;
  font-weight: 900;
  padding: 4px 14px;
  border-radius: 20px;
  margin-bottom: 12px;
}

.rps-choice-grid {
  display: flex;
  gap: 14px;
  width: min(440px, 94vw);
  justify-content: center;
}
.rps-choice-btn {
  flex: 1;
  background: rgba(17, 24, 39, 0.85);
  border: 2px solid rgba(255, 255, 255, 0.12);
  border-radius: 16px;
  padding: 16px 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  cursor: pointer;
  transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.rps-choice-btn:hover {
  transform: translateY(-4px);
  border-color: #ffd700;
}
.rps-choice-btn.selected {
  border-color: #00f2fe;
  background: rgba(0, 242, 254, 0.15);
  box-shadow: 0 0 25px rgba(0, 242, 254, 0.35);
}
.rps-choice-icon { font-size: 36px; margin-bottom: 6px; }
.rps-choice-title { font-family: 'Space Grotesk', sans-serif; font-size: 14px; font-weight: 800; color: #f8fafc; }
</style>
<script src="../security-guard.js"></script>
</head>
<body>

<nav class="gnav">
  <div class="gnav-left">
    <button class="gnav-back" onclick="window.location.href='../index.html'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="18" height="18"><polyline points="15 18 9 12 15 6"/></svg>
      Lobby
    </button>
    <div class="gnav-title">✂️ Rock Paper Scissors</div>
  </div>
  <div class="gnav-right">
    <div class="wallet-switcher-container">
      <button class="wallet-chip-btn" onclick="toggleWalletMenu()">
        <span class="wallet-chip-icon">🪙</span>
        <span id="bal-display" style="color:#00e676;font-weight:800">₹50,000.00</span>
        <span class="wallet-active-badge" style="background:#7c4dff">DEMO</span>
        <svg class="chevron-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="12" height="12"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
    </div>
  </div>
  <button class="btn-wallet-game" onclick="openWalletModal('deposit')">
    💳 Deposit
  </button>
</nav>

<div class="game-layout">
  <div class="game-area rps-area">
    <div class="streak-tag" id="streak-tag">STREAK: 0 WINS (1.00×)</div>
    <div class="arena-clash">
      <div class="fighter-spot">
        <div class="fighter-label" style="color:#00f2fe">YOU</div>
        <div class="fighter-hand" id="hand-player">❓</div>
      </div>
      <div style="font-size:28px;font-weight:900;color:#ffd700">VS</div>
      <div class="fighter-spot">
        <div class="fighter-label" style="color:#ff5252">DEALER</div>
        <div class="fighter-hand" id="hand-dealer">❓</div>
      </div>
    </div>

    <!-- 3 CHOICES -->
    <div class="rps-choice-grid">
      <div class="rps-choice-btn selected" id="c-rock" onclick="selectChoice('rock')">
        <div class="rps-choice-icon">🪨</div>
        <div class="rps-choice-title">ROCK</div>
      </div>
      <div class="rps-choice-btn" id="c-paper" onclick="selectChoice('paper')">
        <div class="rps-choice-icon">📄</div>
        <div class="rps-choice-title">PAPER</div>
      </div>
      <div class="rps-choice-btn" id="c-scissors" onclick="selectChoice('scissors')">
        <div class="rps-choice-icon">✂️</div>
        <div class="rps-choice-title">SCISSORS</div>
      </div>
    </div>
    <div class="copyright-footer">© 2026 GG Wins. Proprietary Algorithm & Code Protected.</div>
  </div>

  <div class="bet-panel">
    <div class="bet-section">
      <div class="bet-label">Bet Amount</div>
      <div class="bet-input-row">
        <div class="bet-currency">₹</div>
        <input class="bet-input" id="bet-amount" type="number" value="100.00" min="1" step="1">
        <div class="bet-quick-btns">
          <button class="qbtn" onclick="halveBet()">½</button>
          <button class="qbtn" onclick="doubleBet()">2×</button>
          <button class="qbtn" onclick="maxBet()">Max</button>
        </div>
      </div>
    </div>

    <div class="bet-section">
      <button class="btn-bet" id="play-btn" onclick="playRps()">⚔️ Throw Hand</button>
      <button class="btn-cashout" id="cashout-btn" onclick="cashOut()" style="display:none;margin-top:8px;width:100%;padding:12px;background:linear-gradient(135deg,#00e676,#00b0ff);color:#000;font-weight:900;font-size:15px;border:none;border-radius:10px;cursor:pointer;box-shadow:0 4px 15px rgba(0,230,118,0.4)">💰 CASH OUT STREAK (₹0.00)</button>
    </div>

    <div class="bet-section">
      <div id="result-box"></div>
    </div>

    <div class="stats-row">
      <div class="stat-box">
        <div class="stat-box-label">Profit</div>
        <div class="stat-box-val" id="stat-profit">₹0.00</div>
      </div>
      <div class="stat-box">
        <div class="stat-box-label">Wins</div>
        <div class="stat-box-val green" id="stat-wins">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-box-label">Losses</div>
        <div class="stat-box-val red" id="stat-losses">0</div>
      </div>
    </div>
  </div>
</div>

<script src="../wallet.js"></script>
<script>
const HANDS = {
  rock: '🪨',
  paper: '📄',
  scissors: '✂️'
};
const WINS_AGAINST = {
  rock: 'scissors',
  paper: 'rock',
  scissors: 'paper'
};

let selectedChoice = 'rock';
let winStreak = 0;
let betAmount = 100;
let playing = false;
let streakActive = false;
let totalProfit = 0; let wins = 0; let losses = 0;

function selectChoice(c) {
  if (playing) return;
  selectedChoice = c;
  document.querySelectorAll('.rps-choice-btn').forEach(btn => btn.classList.remove('selected'));
  document.getElementById('c-' + c).classList.add('selected');
  if (window.fxPlayClick) window.fxPlayClick();
}

function halveBet() {
  const el = document.getElementById('bet-amount');
  el.value = Math.max(1, (parseFloat(el.value) / 2).toFixed(2));
}
function doubleBet() {
  const el = document.getElementById('bet-amount');
  el.value = (parseFloat(el.value) * 2).toFixed(2);
}
function maxBet() {
  const bal = typeof getBalance === 'function' ? getBalance() : 50000;
  document.getElementById('bet-amount').value = Math.min(10000, bal).toFixed(2);
}

function playRps() {
  if (playing) return;
  const amt = parseFloat(document.getElementById('bet-amount').value);
  if (isNaN(amt) || amt <= 0) { showToast('Enter valid bet amount', 'error'); return; }
  const bal = typeof getBalance === 'function' ? getBalance() : 50000;
  if (amt > bal) { showToast('Insufficient balance', 'error'); return; }

  if (!streakActive) {
    if (typeof adjustBalance === 'function') adjustBalance(-amt, 'RPS Wager');
    betAmount = amt;
    winStreak = 0;
    streakActive = true;
  }

  playing = true;
  document.getElementById('play-btn').disabled = true;
  document.getElementById('result-box').innerHTML = '';

  const hPlayer = document.getElementById('hand-player');
  const hDealer = document.getElementById('hand-dealer');
  hPlayer.className = 'fighter-hand clashing';
  hDealer.className = 'fighter-hand clashing';
  hPlayer.textContent = '✊';
  hDealer.textContent = '✊';

  if (window.fxPlayCoin) window.fxPlayCoin();

  const isDemo = typeof window.isDemoMode === 'function' && window.isDemoMode();
  let dealerChoice;

  // Reduced win probability: 45% in Demo, 10% in Real
  const winRate = isDemo ? 0.45 : 0.10;
  const isWin = Math.random() < winRate;

  if (isWin) {
    dealerChoice = WINS_AGAINST[selectedChoice];
  } else {
    // Dealer counters
    const counterMoves = Object.keys(HANDS).filter(k => WINS_AGAINST[k] === selectedChoice);
    dealerChoice = counterMoves[0];
  }

  setTimeout(() => {
    hPlayer.classList.remove('clashing');
    hDealer.classList.remove('clashing');
    hPlayer.textContent = HANDS[selectedChoice];
    hDealer.textContent = HANDS[dealerChoice];

    if (WINS_AGAINST[selectedChoice] === dealerChoice) {
      // Win!
      winStreak++;
      const mult = Math.pow(1.96, winStreak);
      const curPayout = betAmount * mult;

      hPlayer.classList.add('winner');
      document.getElementById('streak-tag').textContent = `STREAK: ${winStreak} WINS (${mult.toFixed(2)}×)`;
      document.getElementById('cashout-btn').style.display = 'block';
      document.getElementById('cashout-btn').textContent = `💰 CASH OUT (₹${curPayout.toFixed(2)} / ${mult.toFixed(2)}×)`;

      document.getElementById('result-box').innerHTML = `<div style="padding:10px;background:rgba(0,230,118,0.15);border:1px solid #00e676;border-radius:8px;color:#00e676;font-weight:800;text-align:center">🎉 YOU WIN ROUND ${winStreak}! CURRENT: ₹${curPayout.toFixed(2)}</div>`;
      if (window.fxPlayGem) window.fxPlayGem(winStreak);

      if (winStreak >= 4) {
        cashOut();
      }
    } else if (selectedChoice === dealerChoice) {
      // Tie
      document.getElementById('result-box').innerHTML = `<div style="padding:10px;background:rgba(255,215,0,0.15);border:1px solid #ffd700;border-radius:8px;color:#ffd700;font-weight:800;text-align:center">🤝 TIE! THROW AGAIN!</div>`;
    } else {
      // Loss
      hDealer.classList.add('winner');
      totalProfit -= betAmount;
      losses++;
      streakActive = false;
      winStreak = 0;

      document.getElementById('streak-tag').textContent = 'STREAK: 0 WINS (1.00×)';
      document.getElementById('cashout-btn').style.display = 'none';
      document.getElementById('result-box').innerHTML = `<div style="padding:10px;background:rgba(239,68,68,0.15);border:1px solid #ef4444;border-radius:8px;color:#ef4444;font-weight:800;text-align:center">💥 DEALER WON! STREAK BROKEN</div>`;

      if (window.triggerScreenShake) window.triggerScreenShake(document.querySelector('.rps-area'));
      if (window.fxPlayExplosion) window.fxPlayExplosion();

      updateStats();
    }

    playing = false;
    document.getElementById('play-btn').disabled = false;
  }, 900);
}

function cashOut() {
  if (!streakActive || winStreak === 0) return;
  streakActive = false;
  const mult = Math.pow(1.96, winStreak);
  const payout = betAmount * mult;

  if (typeof adjustBalance === 'function') adjustBalance(payout, `RPS Streak Win (${winStreak} Wins, ${mult.toFixed(2)}×)`);
  totalProfit += payout - betAmount;
  wins++;

  document.getElementById('result-box').innerHTML = `<div style="padding:10px;background:rgba(0,230,118,0.15);border:1px solid #00e676;border-radius:8px;color:#00e676;font-weight:800;text-align:center">🎉 CASHED OUT ₹${payout.toFixed(2)} (${mult.toFixed(2)}×)</div>`;

  if (window.fireGoldCoinShower) window.fireGoldCoinShower(window.innerWidth / 2, window.innerHeight * 0.4, 45);
  if (window.showBigWinModal && winStreak >= 2) window.showBigWinModal('₹' + payout.toFixed(2), mult.toFixed(2) + '×');
  if (window.fxPlayWin) window.fxPlayWin();

  winStreak = 0;
  document.getElementById('streak-tag').textContent = 'STREAK: 0 WINS (1.00×)';
  document.getElementById('cashout-btn').style.display = 'none';

  updateStats();
}

function updateStats() {
  document.getElementById('stat-profit').textContent = (totalProfit >= 0 ? '+' : '') + '₹' + totalProfit.toFixed(2);
  document.getElementById('stat-profit').className = 'stat-box-val ' + (totalProfit >= 0 ? 'green' : 'red');
  document.getElementById('stat-wins').textContent = wins;
  document.getElementById('stat-losses').textContent = losses;
}
</script>
</body>
</html>
