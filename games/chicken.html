<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chicken Cross – GG Wins</title>
<link rel="stylesheet" href="../game-shell.css">
<style>
.chicken-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  background: radial-gradient(circle at 50% 50%, #15202b 0%, #0c1219 70%, #06090d 100%);
  padding: 16px;
  overflow: auto;
}
.road-container {
  display: flex;
  flex-direction: column-reverse;
  gap: 10px;
  width: min(440px, 94vw);
}
.road-lane {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(30, 41, 59, 0.7);
  border: 1.5px solid rgba(255, 255, 255, 0.1);
  border-radius: 12px;
  padding: 8px 14px;
  position: relative;
  transition: all 0.3s;
}
.road-lane.active {
  border-color: #ffd700;
  box-shadow: 0 0 20px rgba(255, 215, 0, 0.35);
  background: rgba(255, 215, 0, 0.1);
}
.road-lane.cleared {
  border-color: #00e676;
  background: rgba(0, 230, 118, 0.12);
}
.lane-mult {
  font-family: 'Space Grotesk', sans-serif;
  font-weight: 900;
  font-size: 16px;
  color: #ffd700;
  width: 70px;
}
.lane-spots {
  display: flex;
  gap: 14px;
}
.lane-spot {
  width: 50px;
  height: 50px;
  background: rgba(15, 23, 42, 0.85);
  border: 2px dashed rgba(255, 255, 255, 0.25);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
  cursor: pointer;
  user-select: none;
  transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.lane-spot:hover:not(.disabled) {
  border-color: #ffd700;
  transform: scale(1.08);
}
.lane-spot.egg {
  background: rgba(0, 230, 118, 0.25);
  border: 2px solid #00e676;
  box-shadow: 0 0 15px rgba(0, 230, 118, 0.5);
}
.lane-spot.pan {
  background: rgba(239, 68, 68, 0.25);
  border: 2px solid #ef4444;
  box-shadow: 0 0 15px rgba(239, 68, 68, 0.5);
}
.lane-spot.disabled {
  cursor: default;
  opacity: 0.45;
  pointer-events: none;
}
.chicken-avatar {
  font-size: 30px;
  filter: drop-shadow(0 0 8px #ffd700);
  animation: fxSpringFlip 0.35s ease;
}
.status-banner {
  background: rgba(15, 23, 42, 0.85);
  border: 1px solid #ffd700;
  color: #ffd700;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 13px;
  font-weight: 800;
  padding: 6px 18px;
  border-radius: 20px;
  margin-bottom: 12px;
}
</style>
<script src="../security-guard.js"></script>
</head>
<body>

<nav class="gnav">
  <div class="gnav-left">
    <button class="gnav-back" onclick="window.location.href='../index.html'">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="18" height="18"><polyline points="15 18 9 12 15 6"/></svg>
      Lobby
    </button>
    <div class="gnav-title">🐔 Chicken Cross</div>
  </div>
  <div class="gnav-right">
    <div class="wallet-switcher-container">
      <button class="wallet-chip-btn" onclick="toggleWalletMenu()">
        <span class="wallet-chip-icon">🪙</span>
        <span id="bal-display" style="color:#00e676;font-weight:800">₹50,000.00</span>
        <span class="wallet-active-badge" style="background:#7c4dff">DEMO</span>
        <svg class="chevron-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" width="12" height="12"><polyline points="6 9 12 15 18 9"/></svg>
      </button>
    </div>
  </div>
  <button class="btn-wallet-game" onclick="openWalletModal('deposit')">
    💳 Deposit
  </button>
</nav>

<div class="game-layout">
  <div class="game-area chicken-area">
    <div class="status-banner" id="chicken-status">START GAME & TAP A SPOT ON LANE 1</div>
    <div class="road-container" id="road-container"></div>
    <div class="copyright-footer">© 2026 GG Wins. Proprietary Algorithm & Code Protected.</div>
  </div>

  <div class="bet-panel">
    <div class="bet-section">
      <div class="bet-label">Bet Amount</div>
      <div class="bet-input-row">
        <div class="bet-currency">₹</div>
        <input class="bet-input" id="bet-amount" type="number" value="100.00" min="1" step="1">
        <div class="bet-quick-btns">
          <button class="qbtn" onclick="halveBet()">½</button>
          <button class="qbtn" onclick="doubleBet()">2×</button>
          <button class="qbtn" onclick="maxBet()">Max</button>
        </div>
      </div>
    </div>

    <div class="bet-section">
      <button class="btn-bet" id="start-btn" onclick="startCrossing()">🐔 Start Cross</button>
    </div>

    <div class="bet-section" id="cashout-section" style="display:none;margin-top:10px">
      <button class="btn-cashout" id="cashout-btn" onclick="cashOut()" style="width:100%;padding:14px;background:linear-gradient(135deg,#ffd700,#ff9100);color:#000;font-weight:900;font-size:16px;border:none;border-radius:12px;cursor:pointer;box-shadow:0 6px 20px rgba(255,215,0,0.4)">💰 CASH OUT (₹0.00)</button>
    </div>

    <div class="bet-section">
      <div id="result-box"></div>
    </div>

    <div class="stats-row">
      <div class="stat-box">
        <div class="stat-box-label">Profit</div>
        <div class="stat-box-val" id="stat-profit">₹0.00</div>
      </div>
      <div class="stat-box">
        <div class="stat-box-label">Wins</div>
        <div class="stat-box-val green" id="stat-wins">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-box-label">Losses</div>
        <div class="stat-box-val red" id="stat-losses">0</div>
      </div>
    </div>
  </div>
</div>

<script src="../wallet.js"></script>
<script>
const LANE_MULTS = [1.35, 2.10, 3.40, 5.50, 10.00];
let currentLane = -1;
let gameActive = false;
let betAmount = 100;
let laneTraps = []; // Safe column index for each lane
let totalProfit = 0; let wins = 0; let losses = 0;

function halveBet() {
  const el = document.getElementById('bet-amount');
  el.value = Math.max(1, (parseFloat(el.value) / 2).toFixed(2));
}
function doubleBet() {
  const el = document.getElementById('bet-amount');
  el.value = (parseFloat(el.value) * 2).toFixed(2);
}
function maxBet() {
  const bal = typeof getBalance === 'function' ? getBalance() : 50000;
  document.getElementById('bet-amount').value = Math.min(10000, bal).toFixed(2);
}

function buildEmptyRoad() {
  const container = document.getElementById('road-container');
  container.innerHTML = '';
  for (let i = 0; i < 5; i++) {
    const lane = document.createElement('div');
    lane.className = 'road-lane';
    lane.id = 'lane-' + i;
    lane.innerHTML = `
      <div class="lane-mult">${LANE_MULTS[i].toFixed(2)}×</div>
      <div class="lane-spots">
        <div class="lane-spot disabled">?</div>
        <div class="lane-spot disabled">?</div>
        <div class="lane-spot disabled">?</div>
      </div>
    `;
    container.appendChild(lane);
  }
}
buildEmptyRoad();

function startCrossing() {
  if (gameActive) return;
  const amt = parseFloat(document.getElementById('bet-amount').value);
  if (isNaN(amt) || amt <= 0) { showToast('Enter valid bet amount', 'error'); return; }
  const bal = typeof getBalance === 'function' ? getBalance() : 50000;
  if (amt > bal) { showToast('Insufficient balance', 'error'); return; }

  if (typeof adjustBalance === 'function') adjustBalance(-amt, 'Chicken Cross Bet');
  betAmount = amt;
  gameActive = true;
  currentLane = 0;

  // Decide lane traps:
  // Real account: 75% trap chance per lane!
  // Demo account: 55% trap chance per lane!
  const isDemo = typeof window.isDemoMode === 'function' && window.isDemoMode();
  laneTraps = [];

  for (let l = 0; l < 5; l++) {
    const safeCol = Math.floor(Math.random() * 3);
    const trapProb = isDemo ? 0.55 : 0.75;
    const hasSafe = Math.random() >= trapProb;
    laneTraps.push(hasSafe ? safeCol : -1); // -1 means all are frying pans!
  }

  buildPlayableRoad();

  document.getElementById('result-box').innerHTML = '';
  document.getElementById('start-btn').style.display = 'none';
  document.getElementById('cashout-section').style.display = 'none';
  document.getElementById('chicken-status').textContent = 'TAP ONE OF THE 3 SPOTS ON LANE 1 TO HOP!';
}

function buildPlayableRoad() {
  const container = document.getElementById('road-container');
  container.innerHTML = '';
  for (let i = 0; i < 5; i++) {
    const lane = document.createElement('div');
    lane.className = 'road-lane' + (i === 0 ? ' active' : '');
    lane.id = 'lane-' + i;

    const spotsWrap = document.createElement('div');
    spotsWrap.className = 'lane-spots';
    spotsWrap.id = 'spots-' + i;

    for (let s = 0; s < 3; s++) {
      const spot = document.createElement('div');
      spot.className = 'lane-spot' + (i !== 0 ? ' disabled' : '');
      spot.textContent = '?';
      spot.onclick = () => pickSpot(i, s, spot);
      spotsWrap.appendChild(spot);
    }

    lane.innerHTML = `<div class="lane-mult">${LANE_MULTS[i].toFixed(2)}×</div>`;
    lane.appendChild(spotsWrap);
    container.appendChild(lane);
  }
}

function pickSpot(laneIdx, spotIdx, spotEl) {
  if (!gameActive || laneIdx !== currentLane) return;

  const isSafe = (laneTraps[laneIdx] === spotIdx);
  const laneEl = document.getElementById('lane-' + laneIdx);
  const spotsEl = document.getElementById('spots-' + laneIdx);

  if (isSafe) {
    // Chicken lands safely!
    spotEl.className = 'lane-spot egg';
    spotEl.innerHTML = '<span class="chicken-avatar">🐔</span>';
    if (window.fxPlayGem) window.fxPlayGem(laneIdx + 1);

    // Reveal other spots
    Array.from(spotsEl.children).forEach((sp, idx) => {
      if (idx !== spotIdx) {
        sp.className = 'lane-spot pan disabled';
        sp.textContent = '🍳';
      }
    });

    laneEl.className = 'road-lane cleared';

    const mult = LANE_MULTS[laneIdx];
    const payout = betAmount * mult;

    // Reveal cashout button now that player has cleared this lane!
    document.getElementById('cashout-section').style.display = 'block';
    document.getElementById('cashout-btn').textContent = `💰 CASH OUT (₹${payout.toFixed(2)} / ${mult.toFixed(2)}×)`;
    document.getElementById('chicken-status').textContent = `CLEARED LANE ${laneIdx + 1}! CASH OUT OR TAP NEXT LANE`;

    currentLane++;

    if (currentLane >= 5) {
      // Reached the other side!
      cashOut();
    } else {
      const nextLane = document.getElementById('lane-' + currentLane);
      nextLane.classList.add('active');
      Array.from(nextLane.querySelector('.lane-spots').children).forEach(sp => sp.classList.remove('disabled'));
    }
  } else {
    // Roaster Trap!
    spotEl.className = 'lane-spot pan';
    spotEl.textContent = '🍳';
    laneEl.style.borderColor = '#ef4444';

    // Reveal where the safe egg was if any
    Array.from(spotsEl.children).forEach((sp, idx) => {
      if (idx === laneTraps[laneIdx]) {
        sp.className = 'lane-spot egg disabled';
        sp.textContent = '🥚';
      } else {
        sp.classList.add('disabled');
      }
    });

    totalProfit -= betAmount;
    losses++;
    gameActive = false;

    document.getElementById('result-box').innerHTML = `<div style="padding:10px;background:rgba(239,68,68,0.15);border:1px solid #ef4444;border-radius:8px;color:#ef4444;font-weight:800;text-align:center">🍳 ROASTED IN THE PAN! LOST WAGER</div>`;
    document.getElementById('chicken-status').textContent = `PAN ROASTED ON LANE ${laneIdx + 1}! WAGER LOST`;

    if (window.triggerScreenShake) window.triggerScreenShake(document.querySelector('.chicken-area'));
    if (window.fxPlayExplosion) window.fxPlayExplosion();

    updateStats();
    resetUI();
  }
}

function cashOut() {
  if (!gameActive || currentLane <= 0) return;
  gameActive = false;
  const mult = LANE_MULTS[currentLane - 1];
  const payout = betAmount * mult;

  if (typeof adjustBalance === 'function') adjustBalance(payout, `Chicken Cross Win (${mult.toFixed(2)}×)`);
  totalProfit += payout - betAmount;
  wins++;

  document.getElementById('result-box').innerHTML = `<div style="padding:10px;background:rgba(0,230,118,0.15);border:1px solid #00e676;border-radius:8px;color:#00e676;font-weight:800;text-align:center">🎉 WON ₹${payout.toFixed(2)} (${mult.toFixed(2)}×)</div>`;
  document.getElementById('chicken-status').textContent = `CASHED OUT ₹${payout.toFixed(2)} (${mult.toFixed(2)}×)!`;

  if (window.fireGoldCoinShower) window.fireGoldCoinShower(window.innerWidth / 2, window.innerHeight * 0.4, 45);
  if (window.showBigWinModal && mult >= 2.0) window.showBigWinModal('₹' + payout.toFixed(2), mult.toFixed(2) + '×');
  if (window.fxPlayWin) window.fxPlayWin();

  updateStats();
  resetUI();
}

function resetUI() {
  document.getElementById('start-btn').style.display = 'block';
  document.getElementById('cashout-section').style.display = 'none';
  document.querySelectorAll('.lane-spot').forEach(sp => sp.classList.add('disabled'));
}

function updateStats() {
  document.getElementById('stat-profit').textContent = (totalProfit >= 0 ? '+' : '') + '₹' + totalProfit.toFixed(2);
  document.getElementById('stat-profit').className = 'stat-box-val ' + (totalProfit >= 0 ? 'green' : 'red');
  document.getElementById('stat-wins').textContent = wins;
  document.getElementById('stat-losses').textContent = losses;
}
</script>
</body>
</html>
