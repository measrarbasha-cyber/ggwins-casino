plugins {
    id 'com.android.application'
}

android {
    namespace 'site.ggwins.app'
    compileSdk 34

    defaultConfig {
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "1.1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        buildConfig true
    }

    flavorDimensions += "tier"
    productFlavors {
        player {
            dimension "tier"
            applicationId "site.ggwins.app"
            manifestPlaceholders = [appName: "GG Wins"]
            buildConfigField "String", "START_URL", "\"https://ggwins.site\""
            buildConfigField "boolean", "IS_ADMIN_APP", "false"
        }
        admin {
            dimension "tier"
            applicationId "site.ggwins.admin"
            manifestPlaceholders = [appName: "GG Wins Admin"]
            buildConfigField "String", "START_URL", "\"https://ggwins.site/host/index.html\""
            buildConfigField "boolean", "IS_ADMIN_APP", "true"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
}
