name: Build & Deploy Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.2.2'

      - name: Build Android Debug & Release APK
        working-directory: ./android
        run: |
          gradle assembleDebug --stacktrace

      - name: Prepare Download Folder
        run: |
          mkdir -p download
          cp android/app/build/outputs/apk/debug/app-debug.apk download/ggwins.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk download/ggwins-debug.apk
          echo "APK build size: $(ls -lh download/ggwins.apk)"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ggwins-apk
          path: download/ggwins.apk
          retention-days: 30

      - name: Commit & Push APK to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add download/ggwins.apk download/ggwins-debug.apk
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-build & deploy Android APK: download/ggwins.apk [skip ci]" && git push origin main)
