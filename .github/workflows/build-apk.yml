name: Build & Deploy Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Grant Execute Permission to gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        working-directory: ./android
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Prepare Download Folder
        run: |
          mkdir -p download
          echo "Searching for built APK files in workspace..."
          find . -name "*.apk" -type f
          FIRST_APK=$(find . -name "*.apk" -type f | head -n 1)
          if [ -n "$FIRST_APK" ]; then
            echo "Copying $FIRST_APK to download/ggwins.apk"
            cp -v "$FIRST_APK" download/ggwins.apk
            cp -v "$FIRST_APK" download/ggwins-debug.apk
          else
            echo "Listing build directories..."
            ls -la android/app/
            ls -la android/app/build/ || true
            exit 1
          fi
          ls -lh download/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ggwins-apk
          path: download/ggwins.apk
          retention-days: 30

      - name: Commit & Push APK to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add download/ggwins.apk download/ggwins-debug.apk
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-build & deploy Android APK: download/ggwins.apk [skip ci]" && git push origin main)
