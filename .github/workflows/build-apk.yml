name: Build & Deploy Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Player & Admin APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK Licenses
        run: yes | sdkmanager --licenses || true

      - name: Grant Execute Permission to gradlew
        run: chmod +x android/gradlew

      - name: Build Android Debug APKs (Player and Admin)
        working-directory: ./android
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare Download Folder
        run: |
          mkdir -p download
          PLAYER_APK=$(find android/ -name "*player*debug*.apk" -o -name "app-player-debug.apk" | head -n 1)
          ADMIN_APK=$(find android/ -name "*admin*debug*.apk" -o -name "app-admin-debug.apk" | head -n 1)
          echo "Found Player APK: $PLAYER_APK"
          echo "Found Admin APK: $ADMIN_APK"
          
          if [ -n "$PLAYER_APK" ]; then
            cp -v "$PLAYER_APK" download/ggwins.apk
            cp -v "$PLAYER_APK" download/ggwins-debug.apk
          fi
          
          if [ -n "$ADMIN_APK" ]; then
            cp -v "$ADMIN_APK" download/ggwins-admin.apk
          fi
          
          ls -lh download/

      - name: Upload Player APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ggwins-player-apk
          path: download/ggwins.apk
          retention-days: 30

      - name: Upload Admin APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ggwins-admin-apk
          path: download/ggwins-admin.apk
          retention-days: 30

      - name: Commit & Push APKs to Repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add download/ggwins.apk download/ggwins-debug.apk download/ggwins-admin.apk
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-build & deploy Android Player & Admin APKs [skip ci]" && git push origin main)
