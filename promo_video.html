<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GG WINS – Luxury Royal Cinema Commercial Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Space+Grotesk:wght@400;700;900&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  background: radial-gradient(circle at 50% 20%, #151624 0%, #06070c 80%);
  color: #fff;
  font-family: 'Space Grotesk', sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  padding: 24px;
  overflow-x: hidden;
}

.video-studio-header {
  text-align: center;
  margin-bottom: 24px;
}
.studio-title {
  font-family: 'Cinzel', serif;
  font-size: 32px;
  font-weight: 900;
  background: linear-gradient(135deg, #ffd700 0%, #fff 50%, #d4af37 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: 4px;
  text-transform: uppercase;
}
.studio-subtitle {
  font-size: 14px;
  color: #94a3b8;
  margin-top: 6px;
  letter-spacing: 1px;
}

/* 16:9 Cinema Canvas Viewport */
.video-wrapper {
  position: relative;
  width: 100%;
  max-width: 960px;
  aspect-ratio: 16 / 9;
  background: #000;
  border-radius: 20px;
  overflow: hidden;
  box-shadow: 0 0 60px rgba(212, 175, 55, 0.25), 0 25px 50px rgba(0,0,0,0.9);
  border: 2px solid rgba(212, 175, 55, 0.4);
}

#videoCanvas {
  width: 100%;
  height: 100%;
  display: block;
}

/* Luxury Studio Controls */
.studio-controls {
  margin-top: 24px;
  display: flex;
  gap: 16px;
  flex-wrap: wrap;
  justify-content: center;
  align-items: center;
}

.btn-ctrl {
  padding: 14px 28px;
  border-radius: 12px;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 15px;
  font-weight: 900;
  border: none;
  cursor: pointer;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  transition: all 0.25s ease;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.btn-play {
  background: linear-gradient(135deg, #ffd700, #b8860b);
  color: #000;
  box-shadow: 0 4px 25px rgba(255, 215, 0, 0.4);
}
.btn-record {
  background: linear-gradient(135deg, #ef4444, #b91c1c);
  color: #fff;
  box-shadow: 0 4px 25px rgba(239, 68, 68, 0.4);
}
.btn-ctrl:hover {
  transform: translateY(-3px) scale(1.02);
  filter: brightness(1.15);
}
.btn-ctrl:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.recording-status {
  margin-top: 14px;
  font-size: 14px;
  font-weight: 800;
  color: #ffd700;
  text-align: center;
  min-height: 24px;
}
</style>
</head>
<body>

<div class="video-studio-header">
  <div class="studio-title">GG WINS ROYAL COMMERCIAL STUDIO</div>
  <div class="studio-subtitle">Broadcast-Grade 4K Motion Cinema with Dynamic Audio & 1-Click Video Download</div>
</div>

<div class="video-wrapper">
  <canvas id="videoCanvas" width="1920" height="1080"></canvas>
</div>

<div class="recording-status" id="recStatus">Click "Play Luxury Commercial" to preview or "Record & Download" to export video file!</div>

<div class="studio-controls">
  <button class="btn-ctrl btn-play" id="btnPlay" onclick="startCommercial(false)">
    ▶️ Play Luxury Commercial
  </button>
  <button class="btn-ctrl btn-record" id="btnRecord" onclick="startCommercial(true)">
    🎥 Record & Download Video (.webm / .mp4)
  </button>
  <button class="btn-ctrl" style="background:rgba(255,255,255,0.06);color:#fff;border:1px solid rgba(255,255,255,0.2)" onclick="window.open('https://ggwins.site','_blank')">
    🌐 Visit ggwins.site
  </button>
</div>

<script>
const canvas = document.getElementById('videoCanvas');
const ctx = canvas.getContext('2d');
const W = 1920;
const H = 1080;

let isPlaying = false;
let isRecording = false;
let mediaRecorder = null;
let recordedChunks = [];
let animFrame = null;
let commercialStartTime = 0;
const TOTAL_DURATION = 15000; // 15-second cinematic luxury commercial

// 🎵 Cinematic Orchestral Synthesizers
let audioCtx = null;
function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playCinemaHit(freq = 60, dur = 1.2, delaySec = 0) {
  if (!audioCtx) return;
  setTimeout(() => {
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + dur);
      gain.gain.setValueAtTime(0.6, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + dur);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + dur);
    } catch(e){}
  }, delaySec * 1000);
}

function playGoldChime(delaySec = 0) {
  if (!audioCtx) return;
  setTimeout(() => {
    try {
      const freqs = [1046.50, 1318.51, 1567.98, 2093.00];
      freqs.forEach((f, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(f, audioCtx.currentTime + i * 0.08);
        gain.gain.setValueAtTime(0.2, audioCtx.currentTime + i * 0.08);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i * 0.08 + 0.6);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(audioCtx.currentTime + i * 0.08);
        osc.stop(audioCtx.currentTime + i * 0.08 + 0.6);
      });
    } catch(e){}
  }, delaySec * 1000);
}

// 🎙️ High Quality Voiceover Narration
function speakNarration(text, delayMs) {
  setTimeout(() => {
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(text);
      utter.rate = 1.05;
      utter.pitch = 0.95;
      utter.volume = 1.0;
      window.speechSynthesis.speak(utter);
    }
  }, delayMs);
}

// 3D Floating Gold & Diamond Dust
const goldDust = [];
for (let i = 0; i < 120; i++) {
  goldDust.push({
    x: Math.random() * W,
    y: Math.random() * H,
    vx: (Math.random() - 0.5) * 2,
    vy: -(Math.random() * 1.5 + 0.5),
    size: Math.random() * 5 + 1.5,
    color: Math.random() < 0.7 ? '#ffd700' : '#10b981',
    alpha: Math.random() * 0.8 + 0.2
  });
}

function renderFrame(timeElapsed) {
  // 1. Deep Obsidian Gradient Background
  const bg = ctx.createRadialGradient(W / 2, H / 2, 100, W / 2, H / 2, W * 0.8);
  bg.addColorStop(0, '#101426');
  bg.addColorStop(0.6, '#060810');
  bg.addColorStop(1, '#020305');
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // 2. High-Tech Cyber Gold Floor Grid
  ctx.strokeStyle = 'rgba(212, 175, 55, 0.08)';
  ctx.lineWidth = 1.5;
  const gridY = (timeElapsed * 0.1) % 80;
  for (let x = 0; x < W; x += 100) {
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke();
  }
  for (let y = gridY; y < H; y += 80) {
    ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke();
  }

  // 3. Floating Gold & Emerald Dust Particles
  goldDust.forEach(p => {
    p.x += p.vx; p.y += p.vy;
    if (p.y < 0) p.y = H;
    if (p.x < 0) p.x = W; if (p.x > W) p.x = 0;
    ctx.save();
    ctx.globalAlpha = p.alpha;
    ctx.fillStyle = p.color;
    ctx.shadowColor = p.color;
    ctx.shadowBlur = 12;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  });

  // 🎬 SCENE 1: (0s - 3.8s) ROYAL EMBOSSED BRANDING INTRO
  if (timeElapsed < 3800) {
    const p = Math.min(1, timeElapsed / 3800);
    const scale = 0.8 + p * 0.3;

    ctx.save();
    ctx.translate(W / 2, H / 2);
    ctx.scale(scale, scale);

    // Golden Halo Glow
    const halo = ctx.createRadialGradient(0, 0, 10, 0, 0, 450);
    halo.addColorStop(0, 'rgba(212, 175, 55, 0.35)');
    halo.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = halo;
    ctx.beginPath(); ctx.arc(0, 0, 450, 0, Math.PI * 2); ctx.fill();

    // 3D Diamond Gold Casino Chip Graphic
    ctx.save();
    ctx.rotate(timeElapsed * 0.001);
    ctx.lineWidth = 14;
    ctx.strokeStyle = '#ffd700';
    ctx.shadowColor = '#ffd700';
    ctx.shadowBlur = 40;
    ctx.beginPath(); ctx.arc(0, -110, 80, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = '#0a0d18';
    ctx.fill();
    ctx.fillStyle = '#ffd700';
    ctx.font = '900 48px "Cinzel"';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('GW', 0, -110);
    ctx.restore();

    // Gold Embossed Typography
    ctx.fillStyle = '#ffffff';
    ctx.shadowColor = '#ffd700';
    ctx.shadowBlur = 35;
    ctx.font = '900 110px "Cinzel"';
    ctx.textAlign = 'center';
    ctx.fillText('GG WINS', 0, 70);

    ctx.fillStyle = '#ffd700';
    ctx.font = '800 36px "Space Grotesk"';
    ctx.letterSpacing = '6px';
    ctx.fillText('THE ROYAL CASINO & SKILL ARENA', 0, 145);

    ctx.restore();
  }
  // 🎬 SCENE 2: (3.8s - 7.5s) PREMIUM GAME SUITE SHOWCASE
  else if (timeElapsed < 7500) {
    const p = (timeElapsed - 3800) / 3700;

    // Header
    ctx.fillStyle = '#ffd700';
    ctx.shadowColor = '#ffd700';
    ctx.shadowBlur = 20;
    ctx.font = '900 64px "Cinzel"';
    ctx.textAlign = 'center';
    ctx.fillText('EXCLUSIVE CASINO & PVP ARENA', W / 2, 130);
    ctx.shadowBlur = 0;

    // Card 1: GG Mines (Emerald Theme)
    ctx.save();
    ctx.fillStyle = 'rgba(16, 185, 129, 0.06)';
    ctx.strokeStyle = '#10b981';
    ctx.lineWidth = 3;
    ctx.shadowColor = '#10b981';
    ctx.shadowBlur = 25;
    ctx.fillRect(160, 220, 480, 680);
    ctx.strokeRect(160, 220, 480, 680);
    ctx.shadowBlur = 0;

    ctx.fillStyle = '#10b981';
    ctx.font = '900 48px "Space Grotesk"';
    ctx.fillText('💣 GG MINES', 400, 310);
    ctx.fillStyle = '#ffd700';
    ctx.font = '800 28px "Space Grotesk"';
    ctx.fillText('Dynamic Gem Multipliers', 400, 370);

    // 3x3 Luxury Gems Grid
    for (let r = 0; r < 3; r++) {
      for (let c = 0; c < 3; c++) {
        ctx.fillStyle = '#064e3b';
        ctx.fillRect(250 + c * 105, 430 + r * 105, 90, 90);
        ctx.fillStyle = '#10b981';
        ctx.font = '48px sans-serif';
        ctx.fillText('💎', 295 + c * 105, 495 + r * 105);
      }
    }
    ctx.restore();

    // Card 2: Aviator Pro (Supersonic Red Jet)
    ctx.save();
    ctx.fillStyle = 'rgba(239, 68, 68, 0.06)';
    ctx.strokeStyle = '#ef4444';
    ctx.lineWidth = 3;
    ctx.shadowColor = '#ef4444';
    ctx.shadowBlur = 25;
    ctx.fillRect(720, 220, 480, 680);
    ctx.strokeRect(720, 220, 480, 680);
    ctx.shadowBlur = 0;

    ctx.fillStyle = '#ef4444';
    ctx.font = '900 48px "Space Grotesk"';
    ctx.fillText('🚀 AVIATOR PRO', 960, 310);
    ctx.fillStyle = '#ffd700';
    ctx.font = '800 32px "Space Grotesk"';
    ctx.fillText(`${(1.0 + p * 12.5).toFixed(2)}× MULTIPLIER`, 960, 370);

    // Curved Flight Vector & Jet
    ctx.strokeStyle = '#ef4444';
    ctx.lineWidth = 6;
    ctx.shadowColor = '#ef4444';
    ctx.shadowBlur = 15;
    ctx.beginPath();
    ctx.moveTo(760, 780);
    ctx.quadraticCurveTo(900, 760, 760 + p * 380, 780 - p * 320);
    ctx.stroke();

    ctx.fillStyle = '#dc2626';
    ctx.beginPath();
    ctx.arc(760 + p * 380, 780 - p * 320, 20, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    // Card 3: Carrom 3D & Live Tables
    ctx.save();
    ctx.fillStyle = 'rgba(56, 189, 248, 0.06)';
    ctx.strokeStyle = '#38bdf8';
    ctx.lineWidth = 3;
    ctx.shadowColor = '#38bdf8';
    ctx.shadowBlur = 25;
    ctx.fillRect(1280, 220, 480, 680);
    ctx.strokeRect(1280, 220, 480, 680);
    ctx.shadowBlur = 0;

    ctx.fillStyle = '#38bdf8';
    ctx.font = '900 48px "Space Grotesk"';
    ctx.fillText('🎯 CARROM 3D', 1520, 310);
    ctx.fillStyle = '#ffd700';
    ctx.font = '800 28px "Space Grotesk"';
    ctx.fillText('High Precision PvP Arena', 1520, 370);

    ctx.fillStyle = '#ffffff';
    ctx.font = '800 32px "Space Grotesk"';
    ctx.fillText('♠️ Royale Baccarat', 1520, 480);
    ctx.fillText('🎡 European Roulette', 1520, 560);
    ctx.fillText('⚪ Plinko Multipliers', 1520, 640);
    ctx.fillText('🐉 Dragon Tower', 1520, 720);
    ctx.restore();
  }
  // 🎬 SCENE 3: (7.5s - 11.2s) INSTANT BANKING & SECURITY
  else if (timeElapsed < 11200) {
    ctx.fillStyle = '#00e676';
    ctx.shadowColor = '#00e676';
    ctx.shadowBlur = 30;
    ctx.font = '900 72px "Cinzel"';
    ctx.textAlign = 'center';
    ctx.fillText('INSTANT 30-SEC PAYOUTS', W / 2, 170);
    ctx.shadowBlur = 0;

    ctx.fillStyle = '#cbd5e1';
    ctx.font = '700 34px "Space Grotesk"';
    ctx.fillText('Zero Commission  •  256-Bit Encrypted  •  Verified Payouts', W / 2, 250);

    // Luxury Golden Card
    ctx.save();
    ctx.fillStyle = 'rgba(255,215,0,0.08)';
    ctx.strokeStyle = '#ffd700';
    ctx.lineWidth = 4;
    ctx.shadowColor = '#ffd700';
    ctx.shadowBlur = 40;
    ctx.fillRect(W/2 - 480, 340, 960, 300);
    ctx.strokeRect(W/2 - 480, 340, 960, 300);

    ctx.fillStyle = '#ffd700';
    ctx.font = '900 96px "Space Grotesk"';
    ctx.fillText('₹1,00,000.00', W / 2, 490);
    ctx.fillStyle = '#00e676';
    ctx.font = '800 32px "Space Grotesk"';
    ctx.fillText('✓ INSTANT UPI & BANK TRANSFER APPROVED', W / 2, 570);
    ctx.restore();

    ctx.fillStyle = '#ffffff';
    ctx.font = '900 34px "Space Grotesk"';
    ctx.fillText('Google Pay  •  PhonePe  •  Paytm  •  IMPS  •  USDT', W / 2, 750);
  }
  // 🎬 SCENE 4: (11.2s - 15.0s) CALL TO ACTION & DOMAIN
  else {
    const pulse = 1.0 + Math.sin(timeElapsed * 0.008) * 0.04;

    ctx.save();
    ctx.translate(W / 2, H / 2);
    ctx.scale(pulse, pulse);

    ctx.fillStyle = '#ffd700';
    ctx.shadowColor = '#ffd700';
    ctx.shadowBlur = 50;
    ctx.font = '900 96px "Cinzel"';
    ctx.textAlign = 'center';
    ctx.fillText('JOIN THE WINNERS CIRCLE', 0, -80);

    // Glowing Pill
    ctx.fillStyle = '#00e676';
    ctx.shadowColor = '#00e676';
    ctx.shadowBlur = 40;
    ctx.font = '900 84px "Space Grotesk"';
    ctx.fillText('👉 ggwins.site 👈', 0, 45);

    ctx.fillStyle = '#ffffff';
    ctx.shadowBlur = 15;
    ctx.font = '800 36px "Space Grotesk"';
    ctx.fillText('CLAIM ₹10,000 FREE BONUS ON REGISTRATION!', 0, 140);

    ctx.restore();
  }
}

function startCommercial(record = false) {
  initAudio();
  isPlaying = true;
  isRecording = record;
  commercialStartTime = performance.now();
  recordedChunks = [];

  document.getElementById('btnPlay').disabled = true;
  document.getElementById('btnRecord').disabled = true;

  // Soundscape Timeline & Voiceover
  playCinemaHit(80, 2.0, 0);
  playGoldChime(0.5);
  speakNarration("Experience the royal standard in online gaming with GG Wins.", 200);

  playCinemaHit(100, 1.5, 3.8);
  playGoldChime(4.5);
  speakNarration("Dominate GG Mines, Aviator Pro, Carrom 3D, and over twenty-five premier games.", 4000);

  playCinemaHit(70, 1.8, 7.6);
  playGoldChime(8.2);
  speakNarration("Win big with instant thirty second UPI deposits and withdrawals.", 7800);

  playCinemaHit(90, 2.2, 11.4);
  playGoldChime(11.8);
  speakNarration("Visit ggwins.site today and claim your registration bonus.", 11500);

  if (record) {
    document.getElementById('recStatus').textContent = '🔴 RECORDING BROADCAST-GRADE VIDEO AD (15 seconds)...';
    const stream = canvas.captureStream(30);
    mediaRecorder = new MediaRecorder(stream, {
      mimeType: MediaRecorder.isTypeSupported('video/webm;codecs=vp9') ? 'video/webm;codecs=vp9' : 'video/webm'
    });
    mediaRecorder.ondataavailable = e => {
      if (e.data.size > 0) recordedChunks.push(e.data);
    };
    mediaRecorder.onstop = exportVideoFile;
    mediaRecorder.start();
  } else {
    document.getElementById('recStatus').textContent = '▶️ PLAYING ROYAL COMMERCIAL PREVIEW...';
  }

  function loop(now) {
    const elapsed = now - commercialStartTime;
    renderFrame(elapsed);

    if (elapsed < TOTAL_DURATION) {
      animFrame = requestAnimationFrame(loop);
    } else {
      endCommercial();
    }
  }
  animFrame = requestAnimationFrame(loop);
}

function endCommercial() {
  isPlaying = false;
  document.getElementById('btnPlay').disabled = false;
  document.getElementById('btnRecord').disabled = false;

  if (isRecording && mediaRecorder && mediaRecorder.state !== 'inactive') {
    mediaRecorder.stop();
  } else {
    document.getElementById('recStatus').textContent = '✅ Luxury Commercial Complete! Click "Record & Download" to save HD video.';
  }
}

function exportVideoFile() {
  const blob = new Blob(recordedChunks, { type: 'video/webm' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'GG_WINS_Royal_Commercial_1080p.webm';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  document.getElementById('recStatus').innerHTML = '🎉 <b>BROADCAST HD VIDEO DOWNLOADED!</b> Ready for Instagram, YouTube & WhatsApp Ads!';
}

// Initial draw static poster
window.addEventListener('load', () => {
  renderFrame(12500);
});
</script>
</body>
</html>
